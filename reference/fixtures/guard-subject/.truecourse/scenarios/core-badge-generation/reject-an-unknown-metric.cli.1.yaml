guard: 3
id: reject-an-unknown-metric.cli.1
title: Rejecting an unsupported coverage metric reports the documented usage error
promise: The user receives the documented error when selecting an unsupported metric.
flow:
  id: reject-an-unknown-metric
  fingerprint: sha256:4aa7f0e3048495dcd89e6a8c7637310af2bff45e85379b0e21c7e0d6d2278fe4
journey:
  path:
    - cli/check
  fingerprints:
    - sha256:8d2acf397b010a40adda2f619efbfb0d4a3f779f96eb95fb8826eb82c90c83d4
binds:
  - doc: docs/cli-reference.md
    section: cli-reference/invalid-flag-values
    fingerprint: sha256:4ed87f2f494e69dd597b4362e3295742e09837652e830aaf090539204701fb3a
normalize: []
driver: cli
steps:
  - run:
      - check
      - '--metric'
