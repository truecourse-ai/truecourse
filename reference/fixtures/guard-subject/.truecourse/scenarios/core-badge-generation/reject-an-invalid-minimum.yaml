id: reject-an-invalid-minimum
title: Rejecting an invalid minimum reports the documented usage error
promise: The user receives the documented error when the minimum is not a number from 0 to 100.
flow:
  id: reject-an-invalid-minimum
  fingerprint: sha256:3b59a70e314ef81f4a14437427a805f0605c9eee5d5b97ecc3e029879dcf52f4
journey:
  path:
    - cli/check
  fingerprints:
    - sha256:8d2acf397b010a40adda2f619efbfb0d4a3f779f96eb95fb8826eb82c90c83d4
binds:
  - doc: docs/cli-reference.md
    section: cli-reference/invalid-flag-values
    fingerprint: sha256:4ed87f2f494e69dd597b4362e3295742e09837652e830aaf090539204701fb3a
normalize: []
driver: cli
steps:
  - run:
      - check
      - '--min'
      - not-a-number
    expect:
      exit: 2
      stderr:
        contains: 'covergate: the minimum must be a number between 0 and 100'
    milestone: 1
