guard: 3
id: reject-unreadable-reports.cli.1
title: Unreadable reports are rejected with documented covergate errors
promise: The user receives a documented covergate error when the selected report cannot provide the requested coverage percentage.
flow:
  id: reject-unreadable-reports
  fingerprint: sha256:64bfb4057bf94c405624f0092aab797f4428f69c6a93ca21bbbed3855e6d49ed
journey:
  path:
    - cli/check
    - cli/badge
  fingerprints:
    - sha256:8d2acf397b010a40adda2f619efbfb0d4a3f779f96eb95fb8826eb82c90c83d4
    - sha256:4908ef34443952702a6417f3a24c0a2bfad4399407ffb8a734e76af255b24239
binds:
  - doc: docs/cli-reference.md
    section: cli-reference/unreadable-reports
    fingerprint: sha256:edacd384335efdfe5a73ed5f8b243deb8bafb809e96df659b5a1a3ed30b7bd6c
setup:
  files:
    reports/invalid-${unique}.json: |
      { not json
    reports/no-branches-${unique}.json: |
      {"total":{"lines":{"pct":91}}}
normalize: []
driver: cli
steps:
  - run:
      - check
      - reports/missing-${unique}.json
    expect:
      exit: 2
      stderr:
        contains: 'covergate: cannot read reports/missing-${unique}.json'
    milestone: 1
  - run:
      - check
      - reports/invalid-${unique}.json
    expect:
      exit: 2
      stderr:
        contains: 'covergate: reports/invalid-${unique}.json is not valid JSON'
    milestone: 1
  - run:
      - check
      - reports/no-branches-${unique}.json
      - '--metric'
      - branches
    expect:
      exit: 2
      stderr:
        contains: 'covergate: reports/no-branches-${unique}.json has no total.branches.pct'
    milestone: 1
  - run:
      - badge
      - reports/missing-${unique}.json
    expect:
      exit: 2
      stderr:
        contains: 'covergate: cannot read reports/missing-${unique}.json'
    milestone: 1
  - run:
      - badge
      - reports/invalid-${unique}.json
    expect:
      exit: 2
      stderr:
        contains: 'covergate: reports/invalid-${unique}.json is not valid JSON'
    milestone: 1
  - run:
      - badge
      - reports/no-branches-${unique}.json
      - '--metric'
      - branches
    expect:
      exit: 2
      stderr:
        contains: 'covergate: reports/no-branches-${unique}.json has no total.branches.pct'
    milestone: 1
