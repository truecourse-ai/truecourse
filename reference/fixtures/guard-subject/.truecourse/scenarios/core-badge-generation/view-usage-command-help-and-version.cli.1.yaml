guard: 3
id: view-usage-command-help-and-version.cli.1
title: View top-level usage, command-specific help, and installed version
promise: The user can discover the top-level commands, inspect command-specific flags, and print the installed version.
flow:
  id: view-usage-command-help-and-version
  fingerprint: sha256:8ef05f380c9a9c368397794ff64eaecd56e20af4464215124bd194ec3ec5ce96
journey:
  path:
    - cli/badge
    - cli/check
    - cli/init
  fingerprints:
    - sha256:4908ef34443952702a6417f3a24c0a2bfad4399407ffb8a734e76af255b24239
    - sha256:8d2acf397b010a40adda2f619efbfb0d4a3f779f96eb95fb8826eb82c90c83d4
    - sha256:5ccef841d61a4744cd5214d8bbfb107ee6fce9e994403a8b53dfa8a0a4aca163
binds:
  - doc: docs/cli-reference.md
    section: cli-reference/usage-and-version
    fingerprint: sha256:874335c007e2b76879826438ace16cdcaff0ae90c77084d247b75367b146d4ad
  - doc: docs/cli-reference.md
    section: cli-reference/command-help
    fingerprint: sha256:f55d9f3b0b0d4db5f6364d40e6356be99360b5808b2e65eec346163c1baa80e6
normalize: []
driver: cli
steps:
  - run: []
    expect:
      exit: 0
      stdout:
        matches: ^[\s\S]*Usage:[\s\S]*Commands:[\s\S]*\bcheck\b[\s\S]*\bbadge\b[\s\S]*\binit\b[\s\S]*$
    milestone: 1
  - run:
      - '--help'
    expect:
      exit: 0
      stdout:
        matches: ^[\s\S]*Usage:[\s\S]*Commands:[\s\S]*\bcheck\b[\s\S]*\bbadge\b[\s\S]*\binit\b[\s\S]*$
    milestone: 1
  - run:
      - check
      - '--help'
    expect:
      exit: 0
      stdout:
        matches: '^(?![\s\S]*--(?!min\b|metric\b))[\s\S]*Usage: covergate check[^\n]*[\s\S]*Options:\n\s+--min\b[^\n]*\n\s+--metric\b[^\n]*\s*$'
    milestone: 2
  - run:
      - badge
      - '--help'
    expect:
      exit: 0
      stdout:
        matches: '^(?![\s\S]*--(?!metric\b|out\b))[\s\S]*Usage: covergate badge[^\n]*[\s\S]*Options:\n\s+--metric\b[^\n]*\n\s+--out\b[^\n]*\s*$'
    milestone: 2
  - run:
      - init
      - '--help'
    expect:
      exit: 0
      stdout:
        matches: '^(?![\s\S]*--)[\s\S]*Usage: covergate init[\s\S]*$'
    milestone: 2
  - run:
      - '--version'
    expect:
      exit: 0
      stdout:
        matches: ^covergate\s+\d+(?:\.\d+)+(?:[-+][0-9A-Za-z.-]+)?\s*$
    milestone: 3
