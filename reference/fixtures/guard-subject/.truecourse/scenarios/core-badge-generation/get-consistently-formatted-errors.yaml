  fingerprint: sha256:ff9e4d129526c4a46b0558040e3dc436f0600762f879b3330fab320492d0a88f
journey:
  path:
    - cli/badge
    - cli/check
    - cli/init
  fingerprints:
    - sha256:4908ef34443952702a6417f3a24c0a2bfad4399407ffb8a734e76af255b24239
    - sha256:8d2acf397b010a40adda2f619efbfb0d4a3f779f96eb95fb8826eb82c90c83d4
    - sha256:5ccef841d61a4744cd5214d8bbfb107ee6fce9e994403a8b53dfa8a0a4aca163
binds:
  - doc: docs/cli-reference.md
    section: cli-reference/errors
    fingerprint: sha256:81e44d29cfb1dcddba7c1121eaa6664d09320fc718671a6966b3c4e2cf95c2aa
setup:
