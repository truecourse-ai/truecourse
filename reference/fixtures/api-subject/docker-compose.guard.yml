# docker-compose.guard.yml — generated by `truecourse guard`.
#
# The datastores this repository needs in order to run, derived from the
# connection URL(s) the app itself declares in its source:
#   postgres://bookclub:bookclub@localhost:5433/bookclub  (overridable via DATABASE_URL)
#
# The recipe's `api.services` runs it (`docker compose -f docker-compose.guard.yml up -d --wait`).
# It is yours now: review it, edit it, and commit it. Guard regenerates this file
# only while no recipe references it, so your edits are safe.
#
# It is NOT a deployment artifact — it publishes a throwaway datastore on
# localhost for tests to run against.

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: bookclub
      POSTGRES_DB: bookclub
      POSTGRES_PASSWORD: bookclub
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U bookclub -d bookclub
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 2s
