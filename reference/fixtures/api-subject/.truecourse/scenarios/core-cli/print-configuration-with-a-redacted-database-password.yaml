id: print-configuration-with-a-redacted-database-password
title: Inspecting configuration redacts the database password
promise: The user can inspect the service configuration while keeping the database password hidden.
flow:
  id: print-configuration-with-a-redacted-database-password
  fingerprint: sha256:87a8f0f03277c522adc3fe439e50499adbe16d7c951ab4e42fcc8c6d64c885c5
journey:
  path:
    - cli/config
  fingerprints:
    - sha256:0f5253231732763b4d269f6a8f0b54c14035637ffbb64c9de4dd6c16403c2b60
binds:
  - doc: docs/cli.md
    section: the-bookclub-cli/bookclub-config
    fingerprint: sha256:28476d9f11959e15a54df328dc703015d20c7ba804d70540f7e631250ab9994a
normalize: []
driver: cli
steps:
  - run:
      - config
    expect:
      exit: 0
      stdout:
        equals: |
          database: postgres://bookclub:***@localhost:5433/bookclub
          port: 3000
          covers: https://covers.openlibrary.org
    milestone: 1
  - run:
      - config
    env:
      DATABASE_URL: postgres://user_${unique}:pw-${unique}@db-${unique}.local:15432/bookclub_${unique}
    expect:
      exit: 0
      stdout:
        matches: '^(?![\s\S]*pw-${unique})database: postgres://user_${unique}:\*\*\*@db-${unique}\.local:15432/bookclub_${unique}\nport: 3000\ncovers: https://covers\.openlibrary\.org\n?$'
    milestone: 2
