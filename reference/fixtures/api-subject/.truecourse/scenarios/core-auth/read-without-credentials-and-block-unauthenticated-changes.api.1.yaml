guard: 3
id: read-without-credentials-and-block-unauthenticated-changes.api.1
title: Anyone can read books while unauthenticated and invalidly authenticated shelf changes are rejected without writing
promise: Anyone can read books, while attempts to change the shelf without a valid member token are rejected without writing anything.
flow:
  id: read-without-credentials-and-block-unauthenticated-changes
  fingerprint: sha256:f48c22cd497712b532eedb9245a5f0fccc341712a5b8de136a593e67ff2284a4
journey:
  path:
    - api/get-books
    - api/get-books-id
    - api/post-books
    - api/post-books-id-finish
  fingerprints:
    - sha256:14b7488d1cfc312d312da7b7f9151936a1a85f515cb4e3b640fb84c86358a17a
    - sha256:3065d8df6e9e45c9ae0e578909273758dfafd3af87065d276a428e8890224917
    - sha256:669ba831388d19c1887828c546e0ef8d3c0c2dbb324a837285d007ec80ba3906
    - sha256:3462f3a5924acbd0bc7f25e90371a3be89fa11fd3e957d8e9cc18ffe65114b74
binds:
  - doc: docs/shelf-rules.md
    section: shelf-rules/who-may-change-the-shelf
    fingerprint: sha256:b5ffe03f72dda5183ad0c36d7e457ccf09cf2dc42f45e5455c402321a5e0544b
normalize: []
driver: api
steps:
  - request:
      method: GET
      path: /books
    capture:
      booksBefore: ''
    expect:
      status: 200
    milestone: 1
  - request:
      method: GET
      path: /books/{{fixture:finishTargetBook.id}}
    capture:
      finishTargetBefore: ''
    expect:
      status: 200
    milestone: 1
  - request:
      method: POST
      path: /books
      json:
        isbn: '{{fixture:newBookRequest.isbnInput}}'
        title: '{{fixture:newBookRequest.title}}'
        author: '{{fixture:newBookRequest.author}}'
    expect:
      status: 401
      body:
        equals: '{"error":"authentication required"}'
    milestone: 2
  - request:
      method: GET
      path: /books
    expect:
      status: 200
      body:
        equals: ${booksBefore}
    milestone: 2
  - request:
      method: POST
      path: /books
      headers:
        Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJub3QtYS1tZW1iZXIifQ.invalidsignature
      json:
        isbn: '{{fixture:newBookRequest.isbnInput}}'
        title: '{{fixture:newBookRequest.title}}'
        author: '{{fixture:newBookRequest.author}}'
    expect:
      status: 401
      body:
        equals: '{"error":"authentication required"}'
    milestone: 2
  - request:
      method: GET
      path: /books
    expect:
      status: 200
      body:
        equals: ${booksBefore}
    milestone: 2
  - request:
      method: POST
      path: /books/{{fixture:finishTargetBook.id}}/finish
    expect:
      status: 401
      body:
        equals: '{"error":"authentication required"}'
    milestone: 2
  - request:
      method: GET
      path: /books/{{fixture:finishTargetBook.id}}
    expect:
      status: 200
      body:
        equals: ${finishTargetBefore}
    milestone: 2
  - request:
      method: POST
      path: /books/{{fixture:finishTargetBook.id}}/finish
      headers:
        Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJub3QtYS1tZW1iZXIifQ.invalidsignature
    expect:
      status: 401
      body:
        equals: '{"error":"authentication required"}'
    milestone: 2
  - request:
      method: GET
      path: /books/{{fixture:finishTargetBook.id}}
    expect:
      status: 200
      body:
        equals: ${finishTargetBefore}
    milestone: 2
