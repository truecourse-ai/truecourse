guard: 3
id: reject-an-invalid-isbn.api.1
title: Invalid ISBN values are refused when a member adds a book
promise: A member gets a validation error when trying to add a book with a value that is not a valid ISBN-10 or ISBN-13.
flow:
  id: reject-an-invalid-isbn
  fingerprint: sha256:aca16517f3cfebfad3cf7d4fcb2a6b7fe4050f3d8b6533e53307b171d85a03d3
journey:
  path:
    - api/post-books
  fingerprints:
    - sha256:669ba831388d19c1887828c546e0ef8d3c0c2dbb324a837285d007ec80ba3906
binds:
  - doc: docs/shelf-rules.md
    section: shelf-rules/isbns-are-stored-as-thirteen-digits
    fingerprint: sha256:795425389ae93a43aa785731fb8248f0343129d63a74ef4510de4a76ebf93590
normalize: []
driver: api
steps:
  - request:
      method: POST
      path: /books
      headers:
        Authorization: '{{cred:member}}'
      json:
        isbn: not-an-isbn-${unique}
        title: Invalid ISBN ${unique}
        author: Shelf Tester
    expect:
      status: 400
      json:
        error:
          equals: isbn must be a valid ISBN-10 or ISBN-13
    milestone: 1
