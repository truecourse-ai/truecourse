guard: 3
id: reject-an-invalid-isbn.api.1
title: Invalid ISBN submissions are refused with the documented validation error
promise: A user who submits a value that is not a valid ISBN gets the documented validation error.
flow:
  id: reject-an-invalid-isbn
  fingerprint: sha256:a2b2cb3387ea3b6bce494089e116e7ad15c5f0fa202a2b373a4f11f0bece3957
journey:
  path:
    - api/post-books
  fingerprints:
    - sha256:669ba831388d19c1887828c546e0ef8d3c0c2dbb324a837285d007ec80ba3906
binds:
  - doc: docs/shelf-rules.md
    section: shelf-rules/isbns-are-stored-as-thirteen-digits
    fingerprint: sha256:795425389ae93a43aa785731fb8248f0343129d63a74ef4510de4a76ebf93590
normalize: []
driver: api
steps:
  - request:
      method: POST
      path: /books
      headers:
        Authorization: '{{cred:member}}'
      json:
        isbn: not-a-valid-isbn
        title: Invalid ISBN ${unique}
        author: Test Author ${unique}
    expect:
      status: 400
      json:
        error:
          equals: isbn must be a valid ISBN-10 or ISBN-13
    milestone: 1
