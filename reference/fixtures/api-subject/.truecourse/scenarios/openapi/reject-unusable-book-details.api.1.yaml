guard: 3
id: reject-unusable-book-details.api.1
title: Members receive a validation error when any required book detail is missing or unusable
promise: A member receives an error when trying to add a book without usable isbn, title, or author details.
flow:
  id: reject-unusable-book-details
  fingerprint: sha256:3492ecca016b1dce31e20c6221dd61aa09f8ad838685488a8f206412a426f7d4
journey:
  path:
    - api/post-books
  fingerprints:
    - sha256:669ba831388d19c1887828c546e0ef8d3c0c2dbb324a837285d007ec80ba3906
binds:
  - doc: docs/openapi.yaml
    section: paths/post-addbook
    fingerprint: sha256:1c55d318ba4976a4f903da7aae2a2176e9a38b4b770880d98a6591d89a1fa815
normalize: []
driver: api
steps:
  - request:
      method: POST
      path: /books
      headers:
        Authorization: '{{cred:member}}'
      json:
        title: '{{fixture:newBookRequest.title}} ${unique}'
        author: '{{fixture:newBookRequest.author}}'
    expect:
      status: 400
      json:
        error:
          exists: true
      schema: true
    milestone: 1
  - request:
      method: POST
      path: /books
      headers:
        Authorization: '{{cred:member}}'
      json:
        isbn: '{{fixture:newBookRequest.isbnInput}}'
        author: '{{fixture:newBookRequest.author}}'
    expect:
      status: 400
      json:
        error:
          exists: true
      schema: true
    milestone: 1
  - request:
      method: POST
      path: /books
      headers:
        Authorization: '{{cred:member}}'
      json:
        isbn: '{{fixture:newBookRequest.isbnInput}}'
        title: '{{fixture:newBookRequest.title}} ${unique}'
    expect:
      status: 400
      json:
        error:
          exists: true
      schema: true
    milestone: 1
  - request:
      method: POST
      path: /books
      headers:
        Authorization: '{{cred:member}}'
      json:
        isbn: not-a-usable-isbn-${unique}
        title: '{{fixture:newBookRequest.title}} ${unique}'
        author: '{{fixture:newBookRequest.author}}'
    expect:
      status: 400
      json:
        error:
          exists: true
      schema: true
    milestone: 1
  - request:
      method: POST
      path: /books
      headers:
        Authorization: '{{cred:member}}'
      json:
        isbn: '{{fixture:newBookRequest.isbnInput}}'
        title: ''
        author: '{{fixture:newBookRequest.author}}'
    expect:
      status: 400
      json:
        error:
          exists: true
      schema: true
    milestone: 1
  - request:
      method: POST
      path: /books
      headers:
        Authorization: '{{cred:member}}'
      json:
        isbn: '{{fixture:newBookRequest.isbnInput}}'
        title: '{{fixture:newBookRequest.title}} ${unique}'
        author: ''
    expect:
      status: 400
      json:
        error:
          exists: true
      schema: true
    milestone: 1
