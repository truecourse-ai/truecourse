guard: 3
id: author-the-same-tests-through-a-provider-api-key.cli.1
title: A developer points the LLM stages at a provider API and generates through it
promise: A developer authors the same tests through a provider API key
flow:
  id: author-the-same-tests-through-a-provider-api-key
  fingerprint: sha256:dde4490e9938f797dbe3785fe9b270e1e6e50a9a360c9dab2d781e681e0b27a2
journey:
  path:
    - cli/guard
    - cli/config
  fingerprints:
    - sha256:e9a6be7d4d84647db4b4451f8c57149baebd34a8d257f0f579db7b57877136bc
    - sha256:fd58e236b50daea8bc5799cfdff4228e9a6d3ef9a54529b14fa09ec45b47a9ed
binds:
  - doc: .truecourse/specs/sources/docs.truecourse.dev/guard/overview.md
    section: overview
    fingerprint: sha256:5d22eb967a0aa94ccc95aee7adbf3aad10d63ea770eee9eb84b46542ad7849f0
needs:
  - llm-api-credentials
  - guard-subject-project
setup:
  env:
    TRUECOURSE_TELEMETRY: '0'
    TRUECOURSE_LLM_TRANSPORT: api
    TRUECOURSE_NO_PRICE_FETCH: '1'
    CLAUDE_CODE_BINARY: /tc-guard-probe/no-such-claude
    TRUECOURSE_REFERENCE_API_KEY: ${supplied:llm-api-credentials.api-key}
normalize: []
driver: cli
steps:
  - run:
      - config
      - llm
      - setup
      - '--transport'
      - api
      - '--provider'
      - ${supplied:llm-api-credentials.provider}
      - '--model'
      - ${supplied:llm-api-credentials.model}
      - '--api-key-env'
      - TRUECOURSE_REFERENCE_API_KEY
      - optional:
          - '--base-url'
          - ${supplied:llm-api-credentials.base-url}
    timeoutMs: 600000
    expect:
      exit: 0
      stdout:
        matches: Saved — TrueCourse calls
    note: >-
      The documented lever, run for real: provider, model, key and endpoint all come from the
      registered instance and the key itself never enters the config file — `--api-key-env` stores
      the variable NAME. The command probes the account before it saves, so a save is an account that
      answered. It walks `cli/config`, which this flow also declares, and it proves nothing on its
      own; the pointing is only proved by a stage that then reaches the model.
  - delete:
      - .truecourse/scenarios/manifest.json
      - .truecourse/.cache
    cwd: .tc-supplied/guard-subject-project
    expect:
      files:
        .tc-supplied/guard-subject-project/.truecourse/scenarios/manifest.json:
          absent: true
        .tc-supplied/guard-subject-project/.truecourse/.cache:
          absent: true
    note: >-
      The two levers that buy a REAL authoring pass: the manifest (without it an immediate
      re-generate is a no-op) and the derived LLM cache (with it every re-authored section is a
      cache hit — zero calls, which would leave the transport claim unproved). Both are derived
      state, safe to delete in the sandbox copy; the registered instance always carries them
      because registration requires a completed local generate.
  - run:
      - guard
      - generate
      - '--llm-transport'
      - api
      - '-y'
    cwd: .tc-supplied/guard-subject-project
    timeoutMs: 3600000
    expect:
      exit: 0
      output:
        matches: >-
          ^(?=[\s\S]*Wrote )(?=[\s\S]*usage\s+[1-9][0-9]* calls)(?![\s\S]*`claude` CLI)[\s\S]*$
    note: >-
      Authoring that could only have gone through the provider: the run spent LLM calls and wrote
      tests, and there was no Claude Code path for it to take — `CLAUDE_CODE_BINARY` names a path that
      does not exist, so a run that reached the model reached it through the account saved a step
      ago. The absent `claude` line is the other half of that: this run never probed the CLI, because
      the configured transport is not the CLI. Everything generate DOES here is the parent flow's
      claim and is deliberately not re-tagged.
    milestone: guard-overview-config-llm-setup-points-at-a-provider-api
