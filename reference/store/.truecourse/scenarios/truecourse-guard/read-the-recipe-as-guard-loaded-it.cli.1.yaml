guard: 3
id: read-the-recipe-as-guard-loaded-it.cli.1
title: A developer reads the loaded recipe, runs the gate, and then moves a discovery input
promise: A developer reads the recipe guard loaded and watches its discovery inputs move
flow:
  id: read-the-recipe-as-guard-loaded-it
  fingerprint: sha256:cb147136bacf0717753aeab440449595c0eecaeb1d7c6c9c09e20cad060a3bac
journey:
  path:
    - cli/guard
  fingerprints:
    - sha256:e9a6be7d4d84647db4b4451f8c57149baebd34a8d257f0f579db7b57877136bc
binds:
  - doc: .truecourse/specs/sources/docs.truecourse.dev/guard/recipe.md
    section: the-recipe/the-file-is-yours
    fingerprint: sha256:07ed5da5f336c433f90aa5c90cfb372b4095a85ac020a3d6029ce40878b0389e
  - doc: .truecourse/specs/sources/docs.truecourse.dev/guard/overview.md
    section: overview/what-s-committable
    fingerprint: sha256:7c1889b600091b500f7548d292608cbf8ff54ee74f31b854faca18b5968517d9
  - doc: .truecourse/specs/sources/docs.truecourse.dev/guard/setup.md
    section: guard-setup/read-only-companions
    fingerprint: sha256:dc22b6b0681472c08614422384cbb4f341dffb0b81a3e76965392952bba4e69f
setup:
  files:
    package.json: |
      {
        "name": "tc-guard-probe",
        "version": "1.0.0",
        "private": true,
        "type": "module"
      }
    tc-probe/cli.js: |
      console.log(`tc-probe ${process.argv.slice(2).join(" ")}`);
    tc-probe/probe.md: |
      # Probe

      The document the reference corpus binds its hand-written probe scenarios to.

      ## Answer

      The probe answers 42.
    .truecourse/scenarios/recipe.json: |
      {
        "install": "printf installed > tc-install.mark",
        "build": "node --version",
        "entry": ["node", "tc-probe/cli.js"],
        "env": { "TC_PROBE_FLAG": "on" }
      }
    .truecourse/scenarios/tc-probe/probe-green.cli.1.yaml: |
      guard: 3
      id: probe-green.cli.1
      title: The probe branch is the one the repository declares
      binds:
        - doc: tc-probe/probe.md
          section: probe/answer
          fingerprint: sha256:b1c40709a3b661291fdec1935c2be4e719d615633ccf55d1578e7983cec7de78
      setup:
        git: {}
      normalize: []
      driver: cli
      steps:
        - git:
            - symbolic-ref
            - --short
            - HEAD
          expect:
            exit: 0
            stdout:
              contains: main
          milestone: 1
  env:
    TRUECOURSE_TELEMETRY: '0'
    CLAUDE_CODE_BINARY: /tc-guard-probe/no-such-claude
  git:
    branch: main
    identity:
      name: TrueCourse Reference
      email: reference@truecourse.test
normalize: []
driver: cli
steps:
  - run:
      - guard
      - recipe
    expect:
      exit: 0
      stdout:
        matches: >-
          ^(?=[\s\S]*install\s+printf installed > tc-install\.mark)(?=[\s\S]*build\s+node
          --version)(?=[\s\S]*entry\s+node tc-probe/cli\.js)(?=[\s\S]*env\s+TC_PROBE_FLAG=on)(?=[\s\S]*staleness\s+no
          guard run to compare against yet)[\s\S]*$
    note: >-
      The recipe as loaded, field by field, compared against the values seeded one step earlier —
      an exact comparison is legitimate here precisely because the file is this scenario's own and
      not a registered instance's. Those four fields ARE how to build and prepare the repository for a
      run, which is what the store claim says lives in this file. The staleness line is at its first
      of three states: nothing has run yet, so there is no fingerprint to compare against.
    milestone:
      - guard-recipe-prints-the-recipe-as-loaded
      - guard-store-recipe-json-holds-the-build-preparation
  - run:
      - guard
      - run
    timeoutMs: 900000
    expect:
      exit: 0
      output:
        matches: ^(?=[\s\S]*1 passed)[\s\S]*$
    note: >-
      The run that records a discovery-input fingerprint for the read below to compare against. Its
      own claims belong to the gate flow.
  - run:
      - guard
      - recipe
    expect:
      exit: 0
      stdout:
        matches: >-
          ^(?=[\s\S]*staleness\s+current — unchanged since the last guard run)(?![\s\S]*recipe
          may no longer describe)[\s\S]*$
    note: >-
      The second state: a run has happened and nothing has moved since. Without this reading the
      drift below would be indistinguishable from a command that always reports drift. The
      exclusion targets the stale warning's own tail — "unchanged" contains "changed", so the
      drift marker itself cannot serve as the negative.
    milestone:
      - guard-recipe-reports-whether-discovery-inputs-moved
      - guard-recipe-companion-reports-discovery-input-drift
  - write:
      package.json: |
        {
          "name": "tc-guard-probe",
          "version": "1.1.0",
          "private": true,
          "type": "module",
          "scripts": {
            "build": "node --version"
          }
        }
    expect:
      files:
        package.json:
          contains: '"version": "1.1.0"'
    note: >-
      One of the inputs the recipe was derived from — the package manifest — moves. Nothing about the
      recipe itself changes.
  - run:
      - guard
      - recipe
    expect:
      exit: 0
      stdout:
        matches: >-
          ^(?=[\s\S]*changed since the last guard run)(?![\s\S]*staleness\s+current)[\s\S]*$
    note: >-
      The third state, and the one the claim is about: the command notices that the inputs behind the
      recipe moved and says so, where a step ago it said the opposite. The recipe is untouched, so
      what it reports is the DRIFT of its inputs rather than a change to itself.
    milestone:
      - guard-recipe-reports-whether-discovery-inputs-moved
      - guard-recipe-companion-reports-discovery-input-drift
