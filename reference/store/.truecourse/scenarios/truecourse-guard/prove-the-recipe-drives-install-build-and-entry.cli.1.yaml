guard: 3
id: prove-the-recipe-drives-install-build-and-entry.cli.1
title: A developer proves the recipe installs, then builds, then hands its argv to each scenario
promise: A developer proves the recipe installs, builds and invokes the entrypoint
flow:
  id: prove-the-recipe-drives-install-build-and-entry
  fingerprint: sha256:c0379cac919f24f3fefb06c0804df306fb96f6060e7b95b5beb2368eeea5aa17
journey:
  path:
    - cli/guard
  fingerprints:
    - sha256:e9a6be7d4d84647db4b4451f8c57149baebd34a8d257f0f579db7b57877136bc
binds:
  - doc: .truecourse/specs/sources/docs.truecourse.dev/guard/recipe.md
    section: the-recipe
    fingerprint: sha256:ae697b9a5acc171679466c1d729cb0a80a4ec09779ffceebf23f87756f457e1c
setup:
  files:
    package.json: |
      {
        "name": "tc-guard-probe",
        "version": "1.0.0",
        "private": true,
        "type": "module"
      }
    tc-probe/echo.js: |
      console.log(`tc-probe echo ${process.argv.slice(2).join(" ")}`);
    tc-probe/probe.md: |
      # Probe

      The document the reference corpus binds its hand-written probe scenarios to.

      ## Answer

      The probe answers 42.
    .truecourse/scenarios/recipe.json: |
      {
        "install": "printf installed > tc-install.mark",
        "build": "test -f tc-install.mark && printf built > tc-build.mark",
        "entry": ["node", "tc-probe/echo.js"]
      }
    .truecourse/scenarios/tc-probe/probe-entry.cli.1.yaml: |
      guard: 3
      id: probe-entry.cli.1
      title: The entrypoint receives the scenario's own argument
      binds:
        - doc: tc-probe/probe.md
          section: probe/answer
          fingerprint: sha256:b1c40709a3b661291fdec1935c2be4e719d615633ccf55d1578e7983cec7de78
      normalize: []
      driver: cli
      steps:
        - run:
            - --probe-token
          expect:
            exit: 0
            stdout:
              contains: tc-probe echo --probe-token
          milestone: 1
  env:
    TRUECOURSE_TELEMETRY: '0'
    CLAUDE_CODE_BINARY: /tc-guard-probe/no-such-claude
  git:
    branch: main
    identity:
      name: TrueCourse Reference
      email: reference@truecourse.test
normalize: []
driver: cli
steps:
  - run:
      - guard
      - run
    timeoutMs: 900000
    expect:
      exit: 0
      output:
        matches: ^(?=[\s\S]*1 passed)(?=[\s\S]*Every section that ran succeeded\.)[\s\S]*$
      files:
        tc-install.mark:
          contains: installed
        tc-build.mark:
          contains: built
    note: >-
      Ordering proved by construction rather than read off a log. The install writes a marker into the
      repository root; the build refuses to succeed unless that marker is already there, so a run that
      got past preparation has established install-then-build, both in the root, in the only way two
      shell commands can be observed — a build that ran first would have exited non-zero and no
      scenario would have run at all. Both markers landing beside `package.json` is the "in the repo
      root" half. The scenario that then passed proves the last two: the process it ran is the
      recipe's argv with its own `--probe-token` appended, and the script that answered is at the
      repo-relative path the recipe names, resolved from a sandbox somewhere else entirely.
    milestone:
      - recipe-install-is-one-command-run-before-every-build
      - recipe-build-runs-in-the-repo-root-before-scenarios-execute
      - recipe-entry-is-the-entrypoint-argv
      - recipe-entry-is-repo-relative
  - delete:
      - tc-install.mark
      - tc-build.mark
    expect:
      files:
        tc-install.mark:
          absent: true
    note: >-
      Both markers go, so a stale one from the run above cannot make the next run look as though an
      install had happened.
  - write:
      .truecourse/scenarios/recipe.json: |
        {
          "build": "node --version",
          "entry": ["node", "tc-probe/echo.js"]
        }
    expect:
      files:
        .truecourse/scenarios/recipe.json:
          contains: node --version
    note: The same recipe with the install field simply left out.
  - run:
      - guard
      - run
    timeoutMs: 900000
    expect:
      exit: 0
      output:
        matches: ^(?=[\s\S]*1 passed)[\s\S]*$
      files:
        tc-install.mark:
          absent: true
    note: >-
      A recipe with no `install` loads and runs to the same green gate, and the marker is still
      missing afterwards — nothing was fetched because nothing was declared. The absent file is the
      assertion; a run that quietly re-used the previous install would have left it there.
    milestone: recipe-install-is-optional
