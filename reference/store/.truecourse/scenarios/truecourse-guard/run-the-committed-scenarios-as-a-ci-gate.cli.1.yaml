guard: 3
id: run-the-committed-scenarios-as-a-ci-gate.cli.1
title: A developer runs a committed scenario corpus and the gate exits 0
promise: A developer runs the committed scenarios and the gate comes back green
flow:
  id: run-the-committed-scenarios-as-a-ci-gate
  fingerprint: sha256:c7621c66e4eef02160884b6376c4a1c093220a448eb41e4e2ace5bbb59408fe0
