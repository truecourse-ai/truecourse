guard: 3
id: drive-a-service-repositorys-api-tests-from-the-cli.cli.1
title: A developer runs a service repository’s api tests and adds one of their own
promise: >-
  A developer runs the api tests of a service repository, and a hand-written one drives the same
  server
flow:
  id: drive-a-service-repositorys-api-tests-from-the-cli
  fingerprint: sha256:50d19c5235bd522142446cc3ff8d151c9ab56a40f928f22307ad81b7acfdd868
journey:
  path:
    - cli/guard
  fingerprints:
    - sha256:e9a6be7d4d84647db4b4451f8c57149baebd34a8d257f0f579db7b57877136bc
binds:
  - doc: .truecourse/specs/sources/docs.truecourse.dev/guard/overview.md
    section: overview/the-pipeline
    fingerprint: sha256:7b0a3547044c55b0c8aadb328173114e460eea8e5d069389d14a9aeaa9e0c5ca
  - doc: .truecourse/specs/sources/docs.truecourse.dev/guard/generate.md
    section: guard-generate
    fingerprint: sha256:5f8270c0033ba9a92d284036f60f5d6ce90de01b75a74d330c1aee8c176adcee
  - doc: .truecourse/specs/sources/docs.truecourse.dev/guard/recipe.md
    section: the-recipe/the-api-driver-api
    fingerprint: sha256:a4458acbc6feccae8b2ed2bfe57f95d8028989119cd1db00e635d889f57282b8
needs:
  - api-subject-project
setup:
  env:
    TRUECOURSE_TELEMETRY: '0'
    CLAUDE_CODE_BINARY: /tc-guard-probe/no-such-claude
normalize: []
driver: cli
steps:
  - run:
      - guard
      - status
    cwd: .tc-supplied/api-subject-project
    expect:
      exit: 0
      stdout:
        matches: >-
          ^(?=[\s\S]*coverage    [1-9][0-9]* sections)(?=[\s\S]*\bcli [0-9]+\b)(?=[\s\S]*\bapi
          [0-9]+\b)[\s\S]*$
    note: >-
      Two drivers, counted by the program. The line under the coverage row carries one `<driver>
      <count>` pair per registered driver, and both `cli` and `api` are there — the CLI one invoking
      the project’s binary, the api one driving its HTTP service. A corpus that knew one driver
      would print one pair.
    milestone:
      - guard-pipeline-two-drivers-cli-and-api
      - guard-generate-two-drivers-cli-and-api
  - run:
      - guard
      - recipe
    cwd: .tc-supplied/api-subject-project
    expect:
      exit: 0
      stdout:
        matches: \n  health      /\S*
    capture:
      healthPath:
        pattern: \n  health      (/\S*)
    note: >-
      The one route the probe scenarios below may drive without knowing anything about the
      repository: its declared health path, taken out of the recipe view rather than written down.
      Capturing it is what keeps the probe structural — a literal path here would be an assertion
      about the bound instance’s content.
  - write:
      tc-guard-probe/probe.md: |
        # Probe

        The document the reference corpus binds its hand-written probe scenarios to.

        ## Answer

        The probe answers 42.
    cwd: .tc-supplied/api-subject-project
    expect:
      files:
        .tc-supplied/api-subject-project/tc-guard-probe/probe.md:
          contains: The probe answers 42.
    note: >-
      A section for the probe scenarios to bind to. A scenario binds to spec sections and a bound
      section must resolve in the repository being run, so the probe brings its own — with content
      fixed here, its fingerprint is fixed too.
  - write:
      .truecourse/scenarios/tc-guard-probe/probe-api-green.api.1.yaml: |
        guard: 3
        id: probe-api-green.api.1
        title: The declared health path answers the probe
        binds:
          - doc: tc-guard-probe/probe.md
            section: probe/answer
            fingerprint: sha256:b1c40709a3b661291fdec1935c2be4e719d615633ccf55d1578e7983cec7de78
        normalize: []
        driver: api
        steps:
          - boot: {}
            milestone: 1
          - request:
              method: GET
              path: ${captured:healthPath}
            expect:
              status: 200
              headers:
                content-type:
                  contains: json
              body:
                matches: '\S'
              json:
                '':
                  exists: true
            milestone: 2
          - logs:
              stream: stdout
              match:
                pattern: '\S'
            milestone: 3
    cwd: .tc-supplied/api-subject-project
    expect:
      files:
        .tc-supplied/api-subject-project/.truecourse/scenarios/tc-guard-probe/probe-api-green.api.1.yaml:
          contains: 'driver: api'
    note: >-
      The probe, written with a captured path and nothing else borrowed from the repository. A bare
      `boot` carries no expectation, so it means the default one; the request asserts on all four
      api matchers — the status code, a response header, the raw body text and a JSON path — and the
      logs step asserts the server wrote something at all.
  - run:
      - guard
      - run
      - '--scenario'
      - probe-api-green.api.1
      - '--verbose'
    cwd: .tc-supplied/api-subject-project
    timeoutMs: 900000
    expect:
      exit: 0
      stdout:
        matches: ^(?=[\s\S]*✓ probe-api-green\.api\.1)(?=[\s\S]*1 passed)[\s\S]*$
    note: >-
      One scenario, green. The request reached the booted server with the method and path the step
      declared and came back with a status, a header, a body and a JSON document that all matched —
      which is the whole request-and-assert contract in one verdict. The bare `boot` became ready,
      and it could only become ready by the declared health path answering 2xx: the poll is what the
      first request waited on.
    milestone:
      - recipe-api-request-steps-drive-the-booted-server
      - recipe-api-boot-expects-ready-true-by-default
      - recipe-api-assertions-on-status-headers-body-and-json-paths
      - recipe-api-logs-step-asserts-what-the-server-wrote
  - write:
      .truecourse/scenarios/tc-guard-probe/probe-api-red.api.1.yaml: |
        guard: 3
        id: probe-api-red.api.1
        title: The same route, asserted against things that are not true
        binds:
          - doc: tc-guard-probe/probe.md
            section: probe/answer
            fingerprint: sha256:b1c40709a3b661291fdec1935c2be4e719d615633ccf55d1578e7983cec7de78
        normalize: []
        driver: api
        steps:
          - request:
              method: GET
              path: ${captured:healthPath}
            expect:
              status: 599
            milestone: 1
    cwd: .tc-supplied/api-subject-project
    expect:
      files:
        .tc-supplied/api-subject-project/.truecourse/scenarios/tc-guard-probe/probe-api-red.api.1.yaml:
          contains: 'status: 599'
    note: >-
      The falsifying half. 599 is not a status any server answers, so a scenario that still passed
      here would mean the status matcher is not evaluated at all — which is what a green assertion
      on its own can never rule out.
  - run:
      - guard
      - run
      - '--scenario'
      - probe-api-red.api.1
    cwd: .tc-supplied/api-subject-project
    timeoutMs: 900000
    expect:
      exit: 1
      output:
        matches: ^(?=[\s\S]*probe-api-red\.api\.1)(?=[\s\S]*Guard found drift\.)[\s\S]*$
    note: >-
      The mismatch fails the scenario and the gate. Together with the green run above, the four
      matchers are shown to be evaluated rather than decorative.
  - patch:
      .truecourse/scenarios/recipe.json:
        set:
          api.healthPath: /tc-guard-probe/no-such-health
    cwd: .tc-supplied/api-subject-project
    note: >-
      A health path nothing serves. The route is this scenario’s own invention, so the failure below
      cannot be about anything the repository declares.
  - run:
      - guard
      - run
      - '--scenario'
      - probe-api-green.api.1
    cwd: .tc-supplied/api-subject-project
    timeoutMs: 900000
    expect:
      exit: 1
      output:
        matches: ^(?![\s\S]*1 passed)[\s\S]*$
    note: >-
      The same probe that passed a moment ago now fails, and the only thing that changed is the path
      the runner polls. A readiness gate that answered on anything but a 2xx would have let the boot
      through and the request would have passed again.
    milestone: recipe-api-healthpath-polled-until-2xx
