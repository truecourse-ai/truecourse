guard: 3
id: stop-the-run-when-a-service-or-a-seed-cannot-deliver.cli.1
title: A developer half-supplies a service and over-declares a seed, and the run refuses to start
promise: >-
  A run refuses to start against a half-configured service or a seed that cannot deliver what it
  promised
flow:
  id: stop-the-run-when-a-service-or-a-seed-cannot-deliver
  fingerprint: sha256:b396518e602f80c4127e146d8c4dfbc5608b345b055052c60389fecf89d6a832
journey:
  path:
    - cli/guard
  fingerprints:
    - sha256:e9a6be7d4d84647db4b4451f8c57149baebd34a8d257f0f579db7b57877136bc
binds:
  - doc: .truecourse/specs/sources/docs.truecourse.dev/guard/external-services.md
    section: external-services/3-real-accounts-api-externals
    fingerprint: sha256:2f64db9f8bde4762bdf74876c94f9018f37e4786cde16dcb13801b2fc726dd42
  - doc: .truecourse/specs/sources/docs.truecourse.dev/guard/seeding.md
    section: seeding/the-manifest
    fingerprint: sha256:fd27b1e468baf1ee689652e4fea4f312a9ccb38a82a1aa1044bc4c45b9ae8b86
  - doc: .truecourse/specs/sources/docs.truecourse.dev/guard/seeding.md
    section: seeding
    fingerprint: sha256:e438e2d202aa647532d8f44cd8dfdbfd2c2aedb4a55733cf8e3ea267a1a14576
needs:
  - api-subject-project
setup:
  env:
    TRUECOURSE_TELEMETRY: '0'
    CLAUDE_CODE_BINARY: /tc-guard-probe/no-such-claude
normalize: []
driver: cli
steps:
  - patch:
      .truecourse/scenarios/recipe.json:
        remove:
          - api.externals
    cwd: .tc-supplied/api-subject-project
    note: >-
      The repository’s own external declarations withdrawn, so every refusal this scenario
      constructs below is the run’s first objection rather than its second.
  - patch:
      .truecourse/scenarios/recipe.json:
        set:
          api.seed.provides.fixtures.tc-probe-ghost:
            - tc_probe_missing_field
    cwd: .tc-supplied/api-subject-project
    note: >-
      A fixture the repository’s real seed script cannot emit, because this scenario invented its
      name — added BESIDE the real fixtures, so everything the script does deliver still checks
      out and the one gap is the one this scenario declared. The declaration is the contract; the
      manifest is what the script actually wrote.
  - run:
      - guard
      - run
    cwd: .tc-supplied/api-subject-project
    timeoutMs: 900000
    expect:
      exit: 1
      output:
        matches: >-
          ^(?=[\s\S]*seed manifest is missing declared fixture "tc-probe-ghost")(?![\s\S]*
          passed)[\s\S]*$
    note: >-
      A gap in the manifest is a hard stop that says which promise was broken. The message names the
      declared fixture by name, the run does not continue to its scenarios, and the exit code is the
      gate’s — never a silent skip that would let every later assertion pass against absent data.
    milestone:
      - seed-every-declared-fixture-field-must-be-present
      - seed-gap-is-a-hard-seed-failed-stop-naming-what-is-missing
  - patch:
      .truecourse/scenarios/recipe.json:
        remove:
          - api.seed.provides.fixtures.tc-probe-ghost
        set:
          api.seed.provides.credentials.tc-probe-ghost-principal:
            header: X-Tc-Probe-Ghost
    cwd: .tc-supplied/api-subject-project
    note: >-
      The same over-declaration on the other half of `provides`: a principal the script never
      mints, again beside the real one — and the fixture ghost withdrawn, so this run’s stop can
      only be the credential’s.
  - run:
      - guard
      - run
    cwd: .tc-supplied/api-subject-project
    timeoutMs: 900000
    expect:
      exit: 1
      output:
        matches: >-
          ^(?=[\s\S]*seed manifest is missing a non-blank value for declared credential
          "tc-probe-ghost-principal")(?![\s\S]* passed)[\s\S]*$
    note: >-
      The credential half of the same contract, and the word that matters is "non-blank": the
      manifest is required to come back with a real string for every credential it was told to mint,
      and an absent one stops the run exactly as a missing fixture field does.
    milestone: seed-every-declared-credential-must-return-a-non-blank-value
  - patch:
      .truecourse/scenarios/recipe.json:
        set:
          api.credentials:
            tc-probe-ghost-principal:
              header: X-Tc-Probe-Ghost
              value: tc-probe-static
    cwd: .tc-supplied/api-subject-project
    note: >-
      The same name now declared in both `api.credentials` and `api.seed.provides.credentials`.
      Whether the seed could mint it stops mattering: the recipe itself is the thing that no longer
      makes sense.
  - run:
      - guard
      - run
    cwd: .tc-supplied/api-subject-project
    timeoutMs: 900000
    expect:
      exit: 1
      output:
        matches: >-
          ^(?=[\s\S]*credential "tc-probe-ghost-principal" is declared in both api\.credentials and
          api\.seed\.provides\.credentials)(?=[\s\S]*a name has exactly one source)[\s\S]*$
    note: >-
      The recipe is refused before anything runs, and the refusal quotes the rule: one name, one
      source. It is reported as a load failure rather than as a seed failure, which is the collision
      being caught by the file’s own shape instead of by whichever stage happened to read it first.
    milestone: seed-credential-name-has-exactly-one-source
  - patch:
      .truecourse/scenarios/recipe.json:
        remove:
          - api.credentials
          - api.seed.provides.credentials.tc-probe-ghost-principal
        set:
          api.externals:
            tc-probe-vendor:
              baseUrlEnv: TC_PROBE_VENDOR_BASE_URL
              baseUrl: https://sandbox.tc-probe-vendor.test
              env:
                TC_PROBE_VENDOR_KEY: {}
    cwd: .tc-supplied/api-subject-project
    note: >-
      Every invented seed declaration withdrawn — the recipe is coherent again, exactly as setup
      proved it — and in its place one external service supplied in part: a base URL and a variable
      with nothing behind it, which is the state the run below is supposed to refuse rather than
      half-honour.
  - run:
      - guard
      - run
    cwd: .tc-supplied/api-subject-project
    timeoutMs: 900000
    expect:
      exit: 1
      output:
        matches: ^(?=[\s\S]*TC_PROBE_VENDOR_KEY)(?![\s\S]*Running scenarios)(?![\s\S]* passed)[\s\S]*$
    note: >-
      The run stops, and stops EARLY. The unmet variable is named, the scenario phase never starts
      and no pass count is printed — so nothing was booted against a service that would have been
      called with half its configuration. PRODUCT FINDING (2026-08-10): the docs
      (external-services.md, "real accounts") promise `guard run` stops with `missing-external-env`
      whenever a declared service is incomplete, but the engine DELIBERATELY scopes the refusal to
      scenarios that name the service in `setup.externals` (packages/guard-runner/src/run.ts —
      field evidence: a run-wide stop turned one half-configured service on the cal.diy bench into
      zero tests across 93 flows) and refuses the whole run only when nothing else is left. No
      scenario here names the probe service, so the run proceeds and exits 0. The doc and the
      engine disagree; the scenario asserts the doc’s promise and stays red until one side is
      reconciled — the verdict on which side is wrong is the user’s.
    milestone: externals-incomplete-service-stops-the-run-with-missing-external-env
