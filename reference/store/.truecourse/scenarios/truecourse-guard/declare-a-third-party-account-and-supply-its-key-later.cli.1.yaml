guard: 3
id: declare-a-third-party-account-and-supply-its-key-later.cli.1
title: >-
  A developer declares a third-party service, watches it stay unprovided, and supplies its key
  afterwards
promise: A developer declares a third party in the recipe and hands guard its key later, for free
flow:
  id: declare-a-third-party-account-and-supply-its-key-later
  fingerprint: sha256:a605fe33d9ce70bb62e76872ade7b5790c8ea82ac00175ab0a625fcc2a661e15
journey:
  path:
    - cli/guard
  fingerprints:
    - sha256:e9a6be7d4d84647db4b4451f8c57149baebd34a8d257f0f579db7b57877136bc
binds:
  - doc: .truecourse/specs/sources/docs.truecourse.dev/guard/external-services.md
    section: external-services/3-real-accounts-api-externals
    fingerprint: sha256:2f64db9f8bde4762bdf74876c94f9018f37e4786cde16dcb13801b2fc726dd42
  - doc: .truecourse/specs/sources/docs.truecourse.dev/guard/setup.md
    section: guard-setup
    fingerprint: sha256:1c25a017a3cc551c20ba1eea67733304054bb612e3a95c8f925120a6e3b27bf6
  - doc: .truecourse/specs/sources/docs.truecourse.dev/guard/overview.md
    section: overview/the-pipeline
    fingerprint: sha256:7b0a3547044c55b0c8aadb328173114e460eea8e5d069389d14a9aeaa9e0c5ca
  - doc: .truecourse/specs/sources/docs.truecourse.dev/guard/recipe.md
    section: the-recipe/the-api-driver-api
    fingerprint: sha256:a4458acbc6feccae8b2ed2bfe57f95d8028989119cd1db00e635d889f57282b8
  - doc: .truecourse/specs/sources/docs.truecourse.dev/guard/setup.md
    section: guard-setup/why-a-separate-stage
    fingerprint: sha256:fade9a94004b2881f478019e08d9fcb9c66e28f52fc2de674782099a9cc575be
needs:
  - api-subject-project
  - claude-login
setup:
  env:
    TRUECOURSE_TELEMETRY: '0'
    TRUECOURSE_LLM_TRANSPORT: claude-code
    TRUECOURSE_NO_PRICE_FETCH: '1'
    TC_PROBE_VENDOR_REGION: tc-probe-region-eu
normalize: []
driver: cli
steps:
  - run:
      - guard
      - externals
    cwd: .tc-supplied/api-subject-project
    expect:
      exit: 0
      stdout:
        matches: >-
          ^(?=[\s\S]*externals   [1-9][0-9]* service)(?![\s\S]*No detection yet)(?=[\s\S]*Provide an
          account with `truecourse guard setup`)[\s\S]*$
      files:
        .tc-supplied/api-subject-project/.truecourse/scenarios/recipe.json:
          contains: '"externals"'
    note: >-
      What setup left behind, before this flow writes anything. Detection has run (the "no detection
      yet" line is absent), the view counts at least one service, and the recipe itself carries an
      `externals` key — so the declaration skeleton exists for services the user may well have no
      account for, which is exactly what the closing invitation to provide one says.
    milestone:
      - externals-setup-writes-a-skeleton-for-every-detected-service
      - guard-setup-declares-every-detected-external-api-including-unowned
      - guard-pipeline-setup-declares-detected-external-apis-in-the-recipe
  - run:
      - guard
      - generate
      - '--llm-transport'
      - cli
    cwd: .tc-supplied/api-subject-project
    tty: true
    timeoutMs: 900000
    expect:
      exit: 0
      output:
        matches: ^(?=[\s\S]*Nothing changed)(?![\s\S]*Wrote )[\s\S]*$
    note: >-
      The baseline the two fingerprint claims are measured against: with the corpus as registered, a
      re-generate has nothing to buy and says so. Preparation only — the no-op estimate itself
      belongs to the sibling pricing flow.
  - patch:
      .truecourse/scenarios/recipe.json:
        set:
          api.externals:
            tc-probe-vendor:
              baseUrlEnv: TC_PROBE_VENDOR_BASE_URL
              description: the probe vendor this flow declares, so no bound repository’s own vendors are graded
              env:
                TC_PROBE_VENDOR_KEY: {}
    cwd: .tc-supplied/api-subject-project
    expect:
      files:
        .tc-supplied/api-subject-project/.truecourse/scenarios/recipe.json:
          contains: TC_PROBE_VENDOR_KEY
    note: >-
      The declaration in its barest form: a base-URL variable and `{}` for a variable whose value is
      a secret nobody may commit. Deliberately nothing that could resolve — no inline value, no
      host-exported variable — because the reading below is about the state where NOTHING has been
      supplied, and `unprovided` means zero of the declaration's requirements resolve.
  - run:
      - guard
      - externals
    cwd: .tc-supplied/api-subject-project
    expect:
      exit: 0
      stdout:
        matches: ^(?=[\s\S]*tc-probe-vendor  unprovided)(?![\s\S]*tc-probe-tenant)[\s\S]*$
      files:
        .tc-supplied/api-subject-project/.truecourse/scenarios/externals.local.json:
          absent: true
    note: >-
      Declared and unprovided in one line. Nothing has been supplied, so the service reports the
      state whose flows stay blocked, and the gitignored overlay where a value would land does not
      exist yet — the declaration alone is what is committed. The negative lookahead is the other
      half of the split: even the non-secret literal is a declaration detail the state line does not
      echo back as a value.
    milestone:
      - externals-declaration-committed-secrets-not
      - externals-empty-object-declares-a-needed-variable
      - externals-unprovided-service-leaves-flows-blocked-on
      - recipe-api-externals-declares-real-third-party-accounts
  - patch:
      .truecourse/scenarios/recipe.json:
        set:
          api.externals.tc-probe-vendor.env.TC_PROBE_VENDOR_REGION:
            valueFromEnv: TC_PROBE_VENDOR_REGION
          api.externals.tc-probe-vendor.env.TC_PROBE_VENDOR_TENANT:
            value: tc-probe-tenant
    cwd: .tc-supplied/api-subject-project
    expect:
      files:
        .tc-supplied/api-subject-project/.truecourse/scenarios/recipe.json:
          contains: TC_PROBE_VENDOR_TENANT
    note: >-
      The other two variable forms join the declaration now that the unprovided reading is on
      record: a `valueFromEnv` the host exports and a `value` for a literal that genuinely is not
      secret. Both would resolve immediately — which is exactly why they arrive AFTER the reading
      above — and both are inputs to the estimate below and to the three-source `provided` reading
      the overlay completes.
  - run:
      - guard
      - generate
      - '--llm-transport'
      - cli
    cwd: .tc-supplied/api-subject-project
    tty: true
    stdin:
      - marker: Proceed with generate?
        answer: 'n'
    timeoutMs: 900000
    expect:
      exit: 0
      output:
        matches: >-
          ^(?=[\s\S]*Generate will make ~)(?![\s\S]*Nothing changed)(?=[\s\S]*Generate
          cancelled\.)(?![\s\S]*Wrote )[\s\S]*$
    capture:
      callsAfterDeclare:
        pattern: Generate will make ~([0-9]+) LLM calls
        from: output
    note: >-
      The declaration entering the recipe fingerprint, priced. The identical command reported
      "nothing changed" two steps ago and now quotes real work — no doc moved, so the section label
      still reads cached, and what the declaration re-opened is the FLOWS (the recipe fingerprint
      folds into every flow's inputs) — and the only thing that moved between the two runs is the
      `api.externals` entry. Declined at the prompt, so the reading costs nothing.
    milestone:
      - externals-declaration-in-the-fingerprint-values-excluded
      - guard-setup-declaration-enters-the-recipe-fingerprint
  - write:
      .truecourse/scenarios/externals.local.json: |
        {
          "tc-probe-vendor": {
            "baseUrl": "https://sandbox.tc-probe-vendor.test",
            "env": {
              "TC_PROBE_VENDOR_KEY": "tc-probe-vendor-secret-key"
            }
          }
        }
    cwd: .tc-supplied/api-subject-project
    expect:
      files:
        .tc-supplied/api-subject-project/.truecourse/scenarios/externals.local.json:
          contains: tc-probe-vendor-secret-key
    note: >-
      The key, handed over the way the docs describe: a sibling file next to the recipe, carrying
      only the base URL and the secret. It fills in exactly two of the three declared fields and
      says nothing about the other two, which is what makes the merge below a per-field one rather
      than a replacement.
  - git:
      - check-ignore
      - '--'
      - .truecourse/scenarios/externals.local.json
    cwd: .tc-supplied/api-subject-project
    expect:
      exit: 0
      stdout:
        contains: externals.local.json
    note: >-
      Where the values live, in git’s own terms: `check-ignore` names the path and exits 0, so the
      file the secret was just written into is one git will never carry. The declaration beside it
      is tracked, which is the whole split in two adjacent readings.
    milestone: externals-values-live-in-the-gitignored-local-overlay
  - run:
      - guard
      - externals
    cwd: .tc-supplied/api-subject-project
    expect:
      exit: 0
      stdout:
        matches: >-
          ^(?=[\s\S]*tc-probe-vendor 
          provided)(?=[\s\S]*https://sandbox\.tc-probe-vendor\.test)(?![\s\S]*tc-probe-vendor-secret-key)(?![\s\S]*TC_PROBE_VENDOR_REGION:)(?![\s\S]*TC_PROBE_VENDOR_TENANT:)[\s\S]*$
    note: >-
      Provided, and why. The base URL is known and every declared variable resolved — the overlay
      supplied the secret one, the host environment supplied the `valueFromEnv` one, and the
      declaration itself supplied the literal — so no variable is reported unmet, which the two
      negative lookaheads assert (an unmet requirement prints as `VAR: reason`). The overlay named
      only the base URL and the key and the other two still resolve, which is the merge happening
      per field rather than per service. The secret is not echoed anywhere.
    milestone:
      - externals-provided-when-base-url-known-and-every-variable-resolves
      - externals-overlay-merged-per-field-at-run-time
      - externals-valuefromenv-reads-the-host-environment-at-run-start
      - externals-value-supplies-a-non-secret-literal
  - git:
      - status
      - '--porcelain'
      - '--'
      - .truecourse/scenarios
    cwd: .tc-supplied/api-subject-project
    expect:
      exit: 0
      stdout:
        matches: ^(?=[\s\S]*recipe\.json)(?![\s\S]*externals\.local\.json)[\s\S]*$
    note: >-
      What supplying a key changed, and what it did not. Git reports the recipe — this flow declared
      a service in it — and reports nothing at all about the overlay, because the overlay is
      ignored. Handing guard an account after the fact touches that file and no other.
    milestone:
      - guard-setup-handing-a-key-later-touches-only-the-local-overlay
      - externals-supplying-a-key-later-touches-only-the-overlay
  - run:
      - guard
      - generate
      - '--llm-transport'
      - cli
    cwd: .tc-supplied/api-subject-project
    tty: true
    stdin:
      - marker: Proceed with generate?
        answer: 'n'
    timeoutMs: 900000
    expect:
      exit: 0
      output:
        compare:
          number: Generate will make ~([0-9]+) LLM calls
          equals: ${captured:callsAfterDeclare}
    note: >-
      The comparison the claim actually makes: the call count the estimate quotes with a key in the
      overlay equals the one it quoted before the key existed — captured at the declaration-only
      estimate, compared here rather than asserted as a literal, because what the claim is about is
      the count NOT CHANGING, not what it happens to be for a given repository. A key that had
      entered the fingerprint would have moved it. This is also the "re-authors nothing" half — an
      unchanged estimate is unchanged authoring.
    milestone:
      - guard-setup-api-key-does-not-enter-the-fingerprint
      - guard-setup-handing-a-key-later-re-authors-nothing
