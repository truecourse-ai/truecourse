guard: 3
id: run-the-llm-stages-with-no-transport-configured.cli.1
title: A developer runs the three LLM stages with no usable transport and then reads the LLM-free summary
promise: A developer runs the three LLM stages with no transport and only the LLM-free views answer
flow:
  id: run-the-llm-stages-with-no-transport-configured
  fingerprint: sha256:c59029514d5d546693daf35013b0da3be9340049d35a7e1929bd5bca02794413
journey:
  path:
    - cli/guard
    - cli/spec
  fingerprints:
    - sha256:e9a6be7d4d84647db4b4451f8c57149baebd34a8d257f0f579db7b57877136bc
    - sha256:fc8c4d5ddb9203e73c8831381877c7c0ffd4539a860f994d7caa82312df2a956
binds:
  - doc: .truecourse/specs/sources/docs.truecourse.dev/guard/overview.md
    section: overview
    fingerprint: sha256:5d22eb967a0aa94ccc95aee7adbf3aad10d63ea770eee9eb84b46542ad7849f0
  - doc: .truecourse/specs/sources/docs.truecourse.dev/guard/run.md
    section: guard-run/reading-the-results
    fingerprint: sha256:ea11d3559206df300d075071aaf7ed1f5cfc2ecc444aa5117f9739a76de83aca
setup:
  files:
    package.json: |
      {
        "name": "tc-guard-probe",
        "version": "1.0.0",
        "private": true,
        "type": "module"
      }
  env:
    TRUECOURSE_TELEMETRY: '0'
    TRUECOURSE_NO_PRICE_FETCH: '1'
    CLAUDE_CODE_BINARY: /tc-guard-probe/no-such-claude
  git:
    branch: main
    identity:
      name: TrueCourse Reference
      email: reference@truecourse.test
normalize: []
driver: cli
steps:
  - run:
      - spec
      - scan
      - '-y'
    timeoutMs: 600000
    expect:
      exit: 1
      output:
        matches: >-
          ^(?=[\s\S]*`claude` CLI not ready)(?=[\s\S]*The `claude` CLI isn't installed or isn't on
          your PATH\.)[\s\S]*$
    note: >-
      The first of the three stages the prerequisite note names. Nothing is configured — the sandbox
      HOME holds no saved transport and `TRUECOURSE_LLM_TRANSPORT` is deliberately unset — so the
      DEFAULT applies, and the default is what the run then names: it went looking for the Claude Code
      CLI. `CLAUDE_CODE_BINARY` points at a path that does not exist, which is how "no transport" is
      constructed rather than inherited from whatever the machine happens to have installed.
    milestone:
      - guard-overview-scan-setup-generate-need-an-llm-transport
      - guard-overview-default-transport-shells-out-to-claude-code
  - run:
      - guard
      - setup
      - '-y'
    timeoutMs: 600000
    expect:
      exit: 1
      output:
        matches: >-
          ^(?=[\s\S]*`claude` CLI not ready)(?=[\s\S]*The `claude` CLI isn't installed or isn't on
          your PATH\.)[\s\S]*$
    note: >-
      The second stage, refusing for the same reason and in the same words. It is a separate step
      because "each of the three" is not proved by one of them.
    milestone:
      - guard-overview-scan-setup-generate-need-an-llm-transport
      - guard-overview-default-transport-shells-out-to-claude-code
  - run:
      - guard
      - generate
      - '-y'
    timeoutMs: 600000
    expect:
      exit: 1
      output:
        matches: >-
          ^(?=[\s\S]*`claude` CLI not ready)(?=[\s\S]*The `claude` CLI isn't installed or isn't on
          your PATH\.)[\s\S]*$
    note: >-
      The third stage. It stops on the transport before it looks for a corpus or a recipe, which is
      what makes this a transport claim rather than a preparation one.
    milestone:
      - guard-overview-scan-setup-generate-need-an-llm-transport
      - guard-overview-default-transport-shells-out-to-claude-code
  - run:
      - guard
      - status
    expect:
      exit: 0
      stdout:
        matches: >-
          ^(?=[\s\S]*setup\s+)(?=[\s\S]*coverage\s+)(?=[\s\S]*last run\s+)(?=[\s\S]*last
          gen\s+)[\s\S]*$
    note: >-
      The same world, and this command answers in it: all four parts of the summary print — the setup
      state, the section coverage, the last run and the last generate — with no transport anywhere and
      no `claude` binary to find. Three commands refused a step ago for exactly the thing this one
      does not need.
    milestone:
      - guard-status-prints-a-compact-summary
      - guard-status-is-llm-free
