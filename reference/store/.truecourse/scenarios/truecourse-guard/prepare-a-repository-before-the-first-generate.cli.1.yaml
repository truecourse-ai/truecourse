guard: 3
id: prepare-a-repository-before-the-first-generate.cli.1
title: A developer prepares an already-prepared repository, then re-derives and re-proves its recipe
promise: A developer prepares a repository for guard and then re-derives its recipe
flow:
  id: prepare-a-repository-before-the-first-generate
  fingerprint: sha256:76c86bf496c5351679785fc36f7a78ca0fa6c1a8bb146ce7f38c12eea8484df2
journey:
  path:
    - cli/guard
  fingerprints:
    - sha256:e9a6be7d4d84647db4b4451f8c57149baebd34a8d257f0f579db7b57877136bc
binds:
  - doc: .truecourse/specs/sources/docs.truecourse.dev/guard/setup.md
    section: guard-setup/idempotence-and-refresh
    fingerprint: sha256:4717a000c23ae63271c0e34cff1170f77f43865b0c5475c6f4aaaa5c36e99b50
  - doc: .truecourse/specs/sources/docs.truecourse.dev/guard/recipe.md
    section: the-recipe/the-file-is-yours
    fingerprint: sha256:07ed5da5f336c433f90aa5c90cfb372b4095a85ac020a3d6029ce40878b0389e
  - doc: .truecourse/specs/sources/docs.truecourse.dev/guard/setup.md
    section: guard-setup/output
    fingerprint: sha256:c0026ba7e1b49f7ccb79cef1b9569c3cc9a1fef8de89ce1e5e8bdc2ea0d652b3
  - doc: .truecourse/specs/sources/docs.truecourse.dev/guard/overview.md
    section: overview/what-s-committable
    fingerprint: sha256:7c1889b600091b500f7548d292608cbf8ff54ee74f31b854faca18b5968517d9
  - doc: .truecourse/specs/sources/docs.truecourse.dev/guard/run.md
    section: guard-run/the-run-store
    fingerprint: sha256:f1efd8c98eed9d15abd94e923ba4d6918f29dcdf90fdb31031f9a3dc7f253c60
  - doc: .truecourse/specs/sources/docs.truecourse.dev/guard/setup.md
    section: guard-setup
    fingerprint: sha256:1c25a017a3cc551c20ba1eea67733304054bb612e3a95c8f925120a6e3b27bf6
  - doc: .truecourse/specs/sources/docs.truecourse.dev/guard/overview.md
    section: overview/the-pipeline
    fingerprint: sha256:7b0a3547044c55b0c8aadb328173114e460eea8e5d069389d14a9aeaa9e0c5ca
  - doc: .truecourse/specs/sources/docs.truecourse.dev/guard/setup.md
    section: guard-setup/how-discovery-works
    fingerprint: sha256:f1ec6e42fdca1cec95c2638db30cac0eac9e53c2ecc2ee79527695e597baf25e
needs:
  - guard-subject-project
  - claude-login
setup:
  env:
    TRUECOURSE_TELEMETRY: '0'
    TRUECOURSE_LLM_TRANSPORT: claude-code
    TRUECOURSE_NO_PRICE_FETCH: '1'
normalize: []
driver: cli
steps:
  - run:
      - guard
      - setup
      - '--llm-transport'
      - cli
      - '-y'
    cwd: .tc-supplied/guard-subject-project
    tty: true
    timeoutMs: 3600000
    expect:
      exit: 0
      output:
        matches: >-
          ^(?=[\s\S]*recipe\s+already present — reused, not
          re-derived)(?=[\s\S]*detected\s+)(?=[\s\S]*report: )(?![\s\S]*Proceed with
          setup\?)[\s\S]*$
    note: >-
      Setup where there is nothing left to do: it reports the state it found and exits. The reused
      line is the no-op in the run's own words — a run that had derived anything would say `wrote`
      instead. `-y` is asserted by ABSENCE on a pseudo-terminal: the question would be asked here if
      the flag did not stand for the answer, and a step that hung waiting for it would time out
      rather than pass.
    milestone:
      - guard-setup-no-ops-on-an-already-prepared-repo
      - guard-setup-yes-skips-the-cost-confirm
  - git:
      - status
      - '--porcelain'
      - '--'
      - .truecourse/scenarios/recipe.json
    cwd: .tc-supplied/guard-subject-project
    expect:
      exit: 0
      stdout:
        matches: ^\s*$
    note: >-
      What "an existing recipe always wins" means on disk: after a full setup the committed recipe is
      byte-identical — git has nothing to report about it. Discovery never got the chance to propose
      anything over the top of it.
    milestone: recipe-an-existing-recipe-json-always-wins
  - git:
      - check-ignore
      - .truecourse/guard/setup.json
    cwd: .tc-supplied/guard-subject-project
    expect:
      exit: 0
      files:
        .tc-supplied/guard-subject-project/.truecourse/guard/setup.json:
          exists: true
    note: >-
      The record setup always writes, and the rule that keeps it local: it is there after the run
      above, and git reports a rule covering it — the two halves three documents state about this
      path.
    milestone:
      - guard-setup-writes-a-gitignored-setup-record
      - guard-store-setup-json-is-gitignored
      - guard-run-store-setup-json-is-not-committable
  - run:
      - guard
      - setup
      - '--refresh'
      - '--llm-transport'
      - cli
      - '-y'
    cwd: .tc-supplied/guard-subject-project
    tty: true
    timeoutMs: 3600000
    expect:
      exit: 0
      output:
        matches: >-
          ^(?=[\s\S]*recipe\s+wrote )(?=[\s\S]*derived from the repo's own manifests — no LLM
          call)(?=[\s\S]*verifying: install)(?=[\s\S]*verifying:
          build)(?=[\s\S]*verifying: entry probe)(?![\s\S]*usage\s+([3-9]|[0-9][0-9]+)
          calls)[\s\S]*$
    note: >-
      The same command with the one flag that makes it work, and every part of "derives and PROVES"
      read as it happens. The recipe is written this time, not reused. The proposal came from the
      repository's own manifests, which is the deterministic proposer answering before any model is
      asked. And the proof is the three verification phases the run names in order: the install runs,
      the build runs, and the entrypoint is probed — on a CLI-only repository those are the whole of
      install → build → boot, since the doc's boot stage is the api driver's server and there is none
      here. The trailing lookahead is the call bound: a ceiling is falsified by exceeding it, so the
      assertion is that no usage row above two is ever printed.
    milestone:
      - recipe-refresh-re-derives-the-recipe
      - recipe-is-derived-and-proved-once-by-guard-setup
      - guard-setup-derives-and-proves-the-recipe
      - guard-pipeline-setup-derives-and-proves-the-recipe
      - guard-setup-verification-runs-the-install-and-build
      - guard-setup-verification-probes-the-cli-entrypoint
      - guard-setup-deterministic-proposer-runs-first
      - guard-setup-makes-at-most-two-llm-calls
      - guard-pipeline-setup-makes-at-most-two-llm-calls
