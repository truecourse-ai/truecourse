guard: 3
id: prepare-a-service-repository-with-a-database-and-a-seed.cli.1
title: >-
  A developer prepares a service repository: the recipe is derived and proved, a datastore is
  generated, and the seed is drafted and run
promise: >-
  A developer prepares an HTTP service repository for guard in one command, and everything it wrote
  was proved first
flow:
  id: prepare-a-service-repository-with-a-database-and-a-seed
  fingerprint: sha256:b75519417003f611b21b05190fe25e04e862f5104dd334cf45d2fc2935e06ca1
journey:
  path:
    - cli/guard
  fingerprints:
    - sha256:e9a6be7d4d84647db4b4451f8c57149baebd34a8d257f0f579db7b57877136bc
binds:
  - doc: .truecourse/specs/sources/docs.truecourse.dev/guard/setup.md
    section: guard-setup/how-discovery-works
    fingerprint: sha256:f1ec6e42fdca1cec95c2638db30cac0eac9e53c2ecc2ee79527695e597baf25e
  - doc: .truecourse/specs/sources/docs.truecourse.dev/guard/setup.md
    section: guard-setup
    fingerprint: sha256:1c25a017a3cc551c20ba1eea67733304054bb612e3a95c8f925120a6e3b27bf6
  - doc: .truecourse/specs/sources/docs.truecourse.dev/guard/overview.md
    section: overview/the-pipeline
    fingerprint: sha256:7b0a3547044c55b0c8aadb328173114e460eea8e5d069389d14a9aeaa9e0c5ca
  - doc: .truecourse/specs/sources/docs.truecourse.dev/guard/seeding.md
    section: seeding/let-guard-draft-it
    fingerprint: sha256:8b4e6125dde7f92c9abb1386ea564f91a92f2cc98c9fc6ebaeba8ccd525c775f
  - doc: .truecourse/specs/sources/docs.truecourse.dev/guard/setup.md
    section: guard-setup/idempotence-and-refresh
    fingerprint: sha256:4717a000c23ae63271c0e34cff1170f77f43865b0c5475c6f4aaaa5c36e99b50
  - doc: .truecourse/specs/sources/docs.truecourse.dev/guard/setup.md
    section: guard-setup/output
    fingerprint: sha256:c0026ba7e1b49f7ccb79cef1b9569c3cc9a1fef8de89ce1e5e8bdc2ea0d652b3
needs:
  - api-subject-project
  - claude-login
setup:
  env:
    TRUECOURSE_TELEMETRY: '0'
    TRUECOURSE_LLM_TRANSPORT: claude-code
    TRUECOURSE_NO_PRICE_FETCH: '1'
normalize: []
driver: cli
steps:
  - delete:
      - .truecourse/scenarios/recipe.json
      - docker-compose.guard.yml
    cwd: .tc-supplied/api-subject-project
    expect:
      files:
        .tc-supplied/api-subject-project/.truecourse/scenarios/recipe.json:
          absent: true
        .tc-supplied/api-subject-project/docker-compose.guard.yml:
          absent: true
        .tc-supplied/api-subject-project/docker-compose.yml:
          absent: true
    note: >-
      Back to a repository that has never been prepared, so the derivation below is a derivation. A
      `delete` of a path that is not there fails, so this step also asserts the registered instance
      really carried both files it is about to have re-derived — and that it ships no
      `docker-compose.yml` of its own, which is the precondition the generation claim is stated
      under.
  - run:
      - guard
      - setup
      - '--refresh'
      - '--llm-transport'
      - cli
      - '-y'
    cwd: .tc-supplied/api-subject-project
    timeoutMs: 3600000
    expect:
      exit: 0
      output:
        matches: >-
          ^(?=[\s\S]*recipe      wrote )(?=[\s\S]*  datastore   wrote )(?=[\s\S]*  reached     \S+:
          GET /\S* → [0-9]{3})(?=[\s\S]*seed        wrote )(?=[\s\S]*The script RAN, its manifest
          matched `provides`, and the server booted against it\.)(?=[\s\S]*Review and commit what
          changed)[\s\S]*$
      files:
        .tc-supplied/api-subject-project/.truecourse/scenarios/recipe.json:
          contains: '"serve"'
        .tc-supplied/api-subject-project/docker-compose.guard.yml:
          matches: '^(?=[\s\S]*\n +image: +\S+:(?!latest[ ]*\n)\S+[ ]*(?:\n|$))(?=[\s\S]*\n +healthcheck:[ ]*(?:\n|$))[\s\S]*$'
        .tc-supplied/api-subject-project/docker-compose.yml:
          absent: true
    note: >-
      The whole preparation, in one reading. `recipe wrote` and `seed wrote` are the two artifacts
      the output claim names, and both exist on disk afterwards. The `reached` row is the
      verification chain stated by its last link: a live GET against a real route of a declared
      server, which is only reachable once the datastore came up, the migrations ran, the server
      booted and its health path answered — and its status is matched as any three digits, because
      the probe judges "is this the server my scenarios will drive", not whether the endpoint works.
      Verification also takes the datastore back down: a second setup below brings it up again,
      which a still-running container would make impossible. The `datastore wrote` row plus a
      generated file on disk is the compose generation, and the name `docker-compose.yml` is still
      free — that one belongs to the repository. That generated file is then read as a SHAPE rather
      than as bytes: an `image:` whose value carries an explicit tag that is not `latest`, and a
      `healthcheck:` block — the two halves of the pinning claim, stated so they hold for whichever
      engine the bound repository turns out to declare rather than for this instance’s postgres. The
      sentence about the script having RUN and its manifest having matched is the engine saying, in
      its own words, that neither artifact was written until it had been proved.
    milestone:
      - guard-setup-reads-start-argv-or-framework-invocation
      - guard-setup-reads-the-route-surface-for-the-health-path
      - guard-setup-verification-boots-the-server-to-its-health-path
      - guard-setup-probe-accepts-any-http-status
      - guard-setup-calls-a-real-route-on-every-declared-server
      - guard-pipeline-setup-makes-a-live-call-against-every-declared-server
      - guard-setup-generates-a-compose-file-when-the-repo-has-none
      - guard-setup-generated-compose-pins-one-container-per-engine-with-a-healthcheck
      - guard-setup-never-writes-docker-compose-yml
      - guard-setup-verifies-the-whole-datastore-chain-before-keeping-it
      - guard-setup-drafts-the-one-seed-script
      - guard-pipeline-setup-drafts-the-one-seed-script
      - guard-setup-runs-the-seed-and-validates-its-manifest-before-writing
      - guard-pipeline-setup-runs-the-seed-for-real-before-writing
      - seed-neither-artifact-written-until-proved-by-running-it
      - guard-setup-refresh-re-derives-and-re-drafts
      - guard-setup-yes-with-refresh-consents-to-replacing-the-seed
      - guard-setup-writes-the-recipe-and-the-seed-script
  - run:
      - guard
      - recipe
    cwd: .tc-supplied/api-subject-project
    expect:
      exit: 0
      stdout:
        matches: ^(?=[\s\S]*\n[│ ]*health\s+/\S)(?=[\s\S]*\n[│ ]*services\s+up.[\s\S]*docker-compose\.guard\.yml)(?=[\s\S]*\n[│ ]*seeds cred\s+\S+ → \S+ \(minted at run time\))(?=[\s\S]*\n[│ ]*seed\s+\S)[\s\S]*$
    note: >-
      What the derivation decided, read back off the recipe. The health path is a declared route
      rather than the bare default, so it came from the repository’s route surface. The `services`
      row drives the file discovery just generated, which is the generated datastore arriving WITH
      the commands that run it. The credential this repository needs is a seed row, minted at run
      time — the OpenAPI scheme's stub was superseded by the drafted seed in the same setup, so no
      env-var placeholder survives to the file. The stub claim itself moved to the gap ledger: it
      only surfaces on a repository whose scheme the seed cannot mint.
    milestone:
      - guard-setup-generated-compose-comes-with-its-api-services
  - run:
      - guard
      - seed
    cwd: .tc-supplied/api-subject-project
    expect:
      exit: 0
      stdout:
        matches: ^(?=[\s\S]*\n[│ ]*command\s+\S)(?=[\s\S]*\n[│ ]*script\s+\S)(?![\s\S]*← MISSING on disk)(?=[\s\S]*\n[│ ]*fixture\s+\S+ \()(?=[\s\S]*\n[│ ]*credential\s+\S+ → \S)[\s\S]*$
    capture:
      seedScript:
        pattern: \n[│ ]*script\s+(\S+)
    note: >-
      ONE script covering both halves: the drafted seed promises fixtures — rows in the repository’s
      own tables — and principals it mints, and the script it names is on disk. A draft written from
      a template rather than from this repository could not have produced a fixture list at all,
      because the fields come from the parsed schema. The script path is captured here so the
      committability check below asks git about the file setup actually wrote rather than about a
      path this scenario guessed.
    milestone:
      - seed-draft-is-grounded-in-the-repo
  - git:
      - check-ignore
      - '--'
      - .truecourse/scenarios/recipe.json
      - ${captured:seedScript}
    cwd: .tc-supplied/api-subject-project
    expect:
      exit: 1
      stdout:
        matches: ^\s*$
      files:
        .tc-supplied/api-subject-project/${captured:seedScript}:
          exists: true
    note: >-
      Both artifacts, and both committable. The recipe and the seed script exist on disk — the
      second one at the path the seed view named — and `check-ignore` reports neither, so a teammate
      who clones the repository inherits the preparation instead of paying for it again.
    milestone:
      - guard-setup-recipe-and-seed-are-committable
  - git:
      - add
      - '-A'
    cwd: .tc-supplied/api-subject-project
    expect:
      exit: 0
    note: >-
      Everything the first setup wrote, staged — the baseline the byte-identity reading below is
      taken against.
  - git:
      - commit
      - '-m'
      - 'probe: what the first setup wrote'
    cwd: .tc-supplied/api-subject-project
    expect:
      exit: 0
    note: >-
      Committed for the same reason: `git status` can only say "unchanged" about a file it is
      already tracking, and the generated datastore file was created by the run above.
  - run:
      - guard
      - setup
      - '--llm-transport'
      - cli
      - '-y'
    cwd: .tc-supplied/api-subject-project
    timeoutMs: 3600000
    expect:
      exit: 0
      output:
        matches: >-
          ^(?=[\s\S]*recipe      already present — reused, not re-derived)(?=[\s\S]*seed       
          already present \()(?=[\s\S]*  reached     \S+: GET /\S* → [0-9]{3})[\s\S]*$
    note: >-
      A second setup, with no `--refresh`: the recipe is reused and the seed reported rather than
      re-drafted — and the live probe answers again, which it could not do if the first run had left
      its datastore container running and its ports taken. Verification brings the services up and
      puts them back down, and this is the reading that shows the second half.
    milestone:
      - guard-setup-verification-brings-services-up-and-back-down
  - git:
      - status
      - '--porcelain'
      - '--'
      - docker-compose.guard.yml
    cwd: .tc-supplied/api-subject-project
    expect:
      exit: 0
      stdout:
        matches: ^\s*$
    note: >-
      The generated file after a later setup, in git’s terms: reported as nothing, so it is
      byte-identical to the one the recipe already references. Guard wrote it once and will not
      write it again.
    milestone: guard-setup-never-rewrites-a-referenced-compose-file
