guard: 3
id: refuse-the-guard-commands-outside-a-git-repository.cli.1
title: A developer runs guard beside a repository and inside it, and only the inside run proceeds
promise: A developer runs guard outside a git repository and is told why it stopped
flow:
  id: refuse-the-guard-commands-outside-a-git-repository
  fingerprint: sha256:e6a826fa134fb84dbe18d302f9ee4dbb0cc3a5a69e2c2dea36b8b61e9d8606f2
journey:
  path:
    - cli/guard
  fingerprints:
    - sha256:e9a6be7d4d84647db4b4451f8c57149baebd34a8d257f0f579db7b57877136bc
binds:
  - doc: .truecourse/specs/sources/docs.truecourse.dev/guard/overview.md
    section: overview
    fingerprint: sha256:5d22eb967a0aa94ccc95aee7adbf3aad10d63ea770eee9eb84b46542ad7849f0
setup:
  files:
    repo/package.json: |
      {
        "name": "tc-guard-probe",
        "version": "1.0.0",
        "private": true,
        "type": "module"
      }
    repo/tc-probe/cli.js: |
      console.log(`tc-probe ${process.argv.slice(2).join(" ")}`);
    repo/tc-probe/probe.md: |
      # Probe

      The document the reference corpus binds its hand-written probe scenarios to.

      ## Answer

      The probe answers 42.
    repo/.truecourse/scenarios/recipe.json: |
      {
        "build": "node --version",
        "entry": ["node", "tc-probe/cli.js"]
      }
    repo/.truecourse/scenarios/tc-probe/probe-green.cli.1.yaml: |
      guard: 3
      id: probe-green.cli.1
      title: The probe branch is the one the repository declares
      binds:
        - doc: tc-probe/probe.md
          section: probe/answer
          fingerprint: sha256:b1c40709a3b661291fdec1935c2be4e719d615633ccf55d1578e7983cec7de78
      setup:
        git: {}
      normalize: []
      driver: cli
      steps:
        - git:
            - symbolic-ref
            - --short
            - HEAD
          expect:
            exit: 0
            stdout:
              contains: main
          milestone: 1
  env:
    TRUECOURSE_TELEMETRY: '0'
    CLAUDE_CODE_BINARY: /tc-guard-probe/no-such-claude
  git:
    root: repo
    branch: main
    identity:
      name: TrueCourse Reference
      email: reference@truecourse.test
normalize: []
driver: cli
steps:
  - run:
      - guard
      - run
    timeoutMs: 900000
    expect:
      exit: 1
      output:
        matches: >-
          ^(?=[\s\S]*The selected folder is not a git repository\.)(?![\s\S]*Building via
          recipe)[\s\S]*$
    note: >-
      The sandbox root is a real, populated directory that simply is not a repository — the repo sits
      beside it in `repo/`. The command stops there: it names git as the reason and never reaches the
      build, so the refusal is a precondition rather than something that failed later.
    milestone:
      - guard-overview-non-git-folder-stops-with-a-clear-message
      - guard-overview-spec-guard-track-requires-a-git-repository
  - run:
      - guard
      - run
    cwd: repo
    timeoutMs: 900000
    expect:
      exit: 0
      output:
        matches: ^(?=[\s\S]*Every section that ran succeeded\.)(?=[\s\S]*1 passed)[\s\S]*$
    note: >-
      The same command, the same corpus, one directory deeper — and it runs to a green gate. Without
      this half the flow would only show that some folder fails; with it, the git repository is what
      the difference is.
    milestone: guard-overview-spec-guard-track-requires-a-git-repository
