guard: 3
id: catch-a-drift-and-read-the-evidence.cli.1
title: A developer commits scenarios the world does not satisfy and reads the drifts and the evidence
promise: A developer commits a scenario the world does not satisfy and reads the drift
flow:
  id: catch-a-drift-and-read-the-evidence
  fingerprint: sha256:a3c826c4613110b5cb2e6a82e9b5b9563db86ccdc8166ad4f1a91d72cbc861ed
