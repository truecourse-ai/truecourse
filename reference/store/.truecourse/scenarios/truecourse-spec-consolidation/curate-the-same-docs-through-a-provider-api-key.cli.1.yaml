guard: 3
id: curate-the-same-docs-through-a-provider-api-key.cli.1
title: A developer curates the same documentation through a provider API key
promise: A developer curates the same docs through a provider API key instead
flow:
  id: curate-the-same-docs-through-a-provider-api-key
  fingerprint: sha256:578ae3eb8ba44dc68b4a9b9ca7af1da3b45a4737085f19ec7c9bcd068110b05f
journey:
  path:
    - cli/spec
  fingerprints:
    - sha256:fc8c4d5ddb9203e73c8831381877c7c0ffd4539a860f994d7caa82312df2a956
binds:
  - doc: .truecourse/specs/sources/docs.truecourse.dev/guard/spec-scan.md
    section: spec-scan
    fingerprint: sha256:adee6bcd70703f699a6ee5d9e8870a7e4469e70e1f3ade42d30adc3029efb4f8
needs:
  - llm-api-credentials
  - spec-docs-project
setup:
  env:
    TRUECOURSE_TELEMETRY: '0'
    TRUECOURSE_LLM_TRANSPORT: api
    TRUECOURSE_REFERENCE_API_KEY: ${supplied:llm-api-credentials.api-key}
normalize: []
driver: cli
steps:
  - run:
      - config
      - llm
      - setup
      - '--transport'
      - api
      - '--provider'
      - ${supplied:llm-api-credentials.provider}
      - '--model'
      - ${supplied:llm-api-credentials.model}
      - '--api-key-env'
      - TRUECOURSE_REFERENCE_API_KEY
      - optional:
          - '--base-url'
          - ${supplied:llm-api-credentials.base-url}
    expect:
      exit: 0
      stdout:
        matches: Saved — TrueCourse calls
    note: >-
      The transport selection is created by the public command that owns it; the scenario picks
      nothing for itself — provider, model, key and endpoint all come from the registered instance.
      The key never enters the config file: `--api-key-env` stores the VARIABLE NAME. BLOCKED while
      `llm-api-credentials` has no instance, because this command probes the provider live before
      saving, which is this variant's correct state rather than a failure. It walks `cli/config`,
      which this flow's journey path does not claim, so it is not listed there and it proves
      nothing.
  - write:
      tc-reference-probe/scratch-todo.md: |
        # Scratch TODO

        Running list of things to do this week. Not a specification.

        - [ ] chase the flaky CI job
        - [ ] ask design for the new icons
        - [x] reply to the vendor email
        - [ ] book the offsite room
        - [ ] clean up the old branches
    cwd: .tc-supplied/spec-docs-project
    expect:
      files:
        .tc-supplied/spec-docs-project/tc-reference-probe/scratch-todo.md:
          contains: '- [ ] chase the flaky CI job'
    note: >-
      The doc's own example of non-spec material — a task list. It is written rather than found
      because naming a supplied project's own scratch file would be a content-exact assertion
      against a bound instance, and the claim is about the KIND of file, which the scenario may
      legitimately supply.
  - run:
      - spec
      - scan
      - '--llm-transport'
      - api
      - '-y'
    cwd: .tc-supplied/spec-docs-project
    timeoutMs: 3600000
    expect:
      exit: 0
      stdout:
        matches: docs\s+[1-9][0-9]* scanned · [1-9][0-9]* kept · [1-9][0-9]* dropped
      files:
        .tc-supplied/spec-docs-project/.truecourse/specs/corpus.json:
          contains: '"reason"'
    note: >-
      The same curation reached through a provider key instead of a local login. A non-zero dropped
      count is the relevance filter having refused something, and `"reason"` in corpus.json is the
      drop being recorded WITH one — `skippedDocs[].reason` is the only place that key exists in the
      corpus schema, so its presence means at least one dropped doc carries a reason.
    milestone:
      - spec-scan-relevance-filter-drops-non-spec-material
      - spec-scan-dropped-docs-recorded-with-a-reason
  - run:
      - spec
      - docs
      - skipped
    cwd: .tc-supplied/spec-docs-project
    timeoutMs: 900000
    expect:
      exit: 0
      stdout:
        contains: tc-reference-probe/scratch-todo.md
    note: >-
      The dropped document, by name — and it is a document this scenario wrote, so naming it grades
      the filter rather than the instance. Which of the supplied project's own files were dropped is
      never asserted.
    milestone: spec-scan-relevance-filter-drops-non-spec-material
