guard: 3
id: scope-the-scan-to-a-subset-of-the-repository.cli.1
title: A developer narrows the scan to one directory and the other filters still run
promise: A developer narrows the scan to one directory and the other filters still apply
flow:
  id: scope-the-scan-to-a-subset-of-the-repository
  fingerprint: sha256:2fd92d73253443530b9bc384e416fefb1f031120e809f1cf7bb43c27e807af43
journey:
  path:
    - cli/spec
  fingerprints:
    - sha256:fc8c4d5ddb9203e73c8831381877c7c0ffd4539a860f994d7caa82312df2a956
binds:
  - doc: .truecourse/specs/sources/docs.truecourse.dev/guard/spec-scan.md
    section: spec-scan/scoping-the-scan
    fingerprint: sha256:f449c91eacac22dfcb9924b8219018103ceb1fab8c8481004881c32058c8b118
needs:
  - claude-login
setup:
  files:
    package.json: |
      {
        "name": "scope-sample",
        "description": "The orders service: order intake, refunds, and shipping for the storefront",
        "version": "1.0.0",
        "type": "module",
        "private": true
      }
    .truecourseignore: |
      # reference corpus probe
      docs/in-scope-ignored.md
    docs/in-scope-spec.md: |
      # Refund handling

      Refunds for the orders service. A refund applies to a delivered or
      cancelled order, never a pending one.

      ## Rules

      - `POST /orders/{id}/refund` accepts `{ amountCents, reason }` and rejects
        an amount above the order total with `422 refund_too_large`.
      - A refund is allowed within 14 days of delivery; later requests get
        `422 refund_window_closed`.
      - Partial refunds are allowed; the running refunded total may never
        exceed the order total.
      - Every refund emits `order.refunded` with the order id and amount.
    docs/in-scope-ignored.md: |
      # Legacy refunds (pre-2024 orders)

      Orders created before the ledger migration follow the old path: refunds
      go through the finance queue, take up to 5 business days, and are always
      full-amount — the legacy ledger cannot represent partial refunds.
    docs/in-scope-tasklist.md: |
      # Scratch TODO

      Running list of things to do this week. Not a specification.

      - [ ] chase the flaky CI job
      - [ ] ask design for the new icons
      - [x] reply to the vendor email
      - [ ] book the offsite room
      - [ ] clean up the old branches
    docs/in-scope-notes.txt: |
      Loose refund notes. Real prose, wrong extension.
    docs/in-scope-openapi.yaml: |
      openapi: 3.1.0
      info:
        title: Orders API
        version: 1.0.0
      paths:
        /orders:
          get:
            summary: List orders
            responses:
              '200':
                description: The orders page
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/OrderPage'
          post:
            summary: Create an order
            responses:
              '201':
                description: The created order
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/Order'
      components:
        schemas:
          Order:
            type: object
            properties:
              id:
                type: string
              total:
                type: number
          OrderPage:
            type: object
            properties:
              items:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
    out-of-scope/outside-spec.md: |
      # Shipping rules

      How the orders service ships what was bought.

      ## Rules

      - A shipment is created when an order reaches `paid`; it starts in
        `preparing` and moves through `handed_over` and `in_transit` to
        `delivered`.
      - The tracking id is `SH-` followed by ten digits and is unique per
        shipment.
      - An order splits into multiple shipments when items come from
        different warehouses; each shipment tracks independently.
      - `order.shipped` fires once per shipment, with the tracking id.
    out-of-scope/outside-openapi.yaml: |
      openapi: 3.1.0
      info:
        title: Orders API
        version: 1.0.0
      paths:
        /orders:
          get:
            summary: List orders
            responses:
              '200':
                description: The orders page
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/OrderPage'
          post:
            summary: Create an order
            responses:
              '201':
                description: The created order
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/Order'
      components:
        schemas:
          Order:
            type: object
            properties:
              id:
                type: string
              total:
                type: number
          OrderPage:
            type: object
            properties:
              items:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
  env:
    TRUECOURSE_TELEMETRY: '0'
    TRUECOURSE_LLM_TRANSPORT: claude-code
  git:
    branch: main
    identity:
      name: TrueCourse Reference
      email: reference@truecourse.test
    commits:
      - files:
          - package.json
          - .truecourseignore
          - docs/in-scope-spec.md
          - docs/in-scope-ignored.md
          - docs/in-scope-tasklist.md
          - docs/in-scope-notes.txt
          - docs/in-scope-openapi.yaml
          - out-of-scope/outside-spec.md
          - out-of-scope/outside-openapi.yaml
        message: seed scope sample
normalize: []
driver: cli
steps:
  - run:
      - spec
      - scan
      - '--llm-transport'
      - cli
      - '-y'
    timeoutMs: 1800000
    expect:
      exit: 0
      stdout:
        matches: ^(?![\s\S]*\(config\))[\s\S]*Corpus written to [\s\S]*$
    note: >-
      The no-scope world. The absent `scope … (config)` line is the run confirming it read no
      include-scope, which is what makes the next listing the "everything" baseline.
      PRODUCT FINDING (2026-08-09, kept red on purpose): removing the scope returns docs to the
      universe, but every returned doc is cache-warm, so the run makes zero LLM calls — and the
      scan's no-op check is literally "zero LLM calls", so it declares "corpus is up to date"
      while the corpus is still missing the returned docs. Same root as the re-scan finding:
      no-change must be decided by comparing the discovered universe and content against the
      corpus, never by counting calls. Spec Scan workstream territory.

  - run:
      - spec
      - docs
      - list
    expect:
      exit: 0
      stdout:
        matches: ^(?=[\s\S]*docs/in-scope-spec\.md)(?=[\s\S]*out-of-scope/outside-spec\.md)[\s\S]*$
    note: >-
      With no scope set, documents on both sides of the future boundary are in the corpus. Without
      this baseline the later absences would be unattributable — a document can be missing because a
      scope excluded it or because it was never there.
    milestone: spec-scan-absent-or-empty-scope-means-everything
  - write:
      .truecourse/config.json: |
        {
          "spec": {
            "include": ["docs/**"]
          }
        }
    expect:
      files:
        .truecourse/config.json:
          contains: '"include": ["docs/**"]'
    note: >-
      The include-scope, written where the claim says it lives: under `spec` in
      `.truecourse/config.json`, as a gitignore-style glob list.
  - run:
      - spec
      - scan
      - '--llm-transport'
      - cli
      - '-y'
    timeoutMs: 1800000
    expect:
      exit: 0
      stdout:
        matches: scope\s+docs/\*\* \(config\)
    note: >-
      The run echoes the glob it read and says where it came from. That line is the claim: the scope
      is a per-repo setting the scan picks up from config.json, not a flag or a guess.
    milestone: spec-scan-include-scope-lives-in-config-json
  - run:
      - spec
      - docs
      - list
    expect:
      exit: 0
      stdout:
        matches: >-
          ^(?=[\s\S]*docs/in-scope-spec\.md)(?=[\s\S]*docs/in-scope-openapi\.yaml)(?![\s\S]*out-of-scope/outside-spec\.md)(?![\s\S]*out-of-scope/outside-openapi\.yaml)(?![\s\S]*docs/in-scope-notes\.txt)(?![\s\S]*docs/in-scope-ignored\.md)[\s\S]*$
    note: >-
      Four readings of one listing. Markdown and OpenAPI inside the glob are in; the same two kinds
      outside it are gone — "markdown and OpenAPI docs alike" needs both pairs or it is a guess. The
      `.txt` sitting inside the scope is still absent, which is the scope narrowing discovery rather
      than widening it. And the file `.truecourseignore` names is absent despite matching the glob,
      which is the ignore file still running on top.
    milestone:
      - spec-scan-include-scope-narrows-the-scan-universe
      - spec-scan-scope-cannot-widen-discovery
      - spec-scan-truecourseignore-still-applies-inside-the-scope
  - run:
      - spec
      - docs
      - skipped
    timeoutMs: 900000
    expect:
      exit: 0
      stdout:
        matches: >-
          ^(?=[\s\S]*docs/in-scope-tasklist\.md)(?![\s\S]*docs/in-scope-notes\.txt)(?![\s\S]*docs/in-scope-ignored\.md)[\s\S]*$
    note: >-
      A task list that matches the scope is still dropped as non-spec — the relevance filter running
      on top. The two negatives complete the previous step: the `.txt` and the ignored markdown are
      in NEITHER listing, so they were never discovered rather than discovered and dropped.
    milestone:
      - spec-scan-relevance-filter-still-applies-inside-the-scope
      - spec-scan-scope-cannot-widen-discovery
      - spec-scan-truecourseignore-still-applies-inside-the-scope
  - write:
      .truecourse/config.json: |
        {
          "spec": {
            "include": []
          }
        }
    expect:
      files:
        .truecourse/config.json:
          contains: '"include": []'
    note: The empty list — the other spelling of "no scope", which the claim says means everything.
  - run:
      - spec
      - scan
      - '--llm-transport'
      - cli
      - '-y'
    timeoutMs: 1800000
    expect:
      exit: 0
      stdout:
        matches: ^(?![\s\S]*\(config\))[\s\S]*Corpus written to [\s\S]*$
    note: >-
      An empty scope prints no scope line at all — the run treating `[]` as "no narrowing" rather
      than as "narrow to nothing".
  - run:
      - spec
      - docs
      - list
    expect:
      exit: 0
      stdout:
        contains: out-of-scope/outside-spec.md
    note: >-
      The document the `docs/**` scope had removed is back. Set against the first listing, that is
      both halves of the claim: absent means everything, and `[]` means everything too.
    milestone: spec-scan-absent-or-empty-scope-means-everything
