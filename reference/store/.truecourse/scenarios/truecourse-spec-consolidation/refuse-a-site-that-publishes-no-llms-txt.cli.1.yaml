guard: 3
id: refuse-a-site-that-publishes-no-llms-txt.cli.1
title: A developer points the fetcher at a site with no llms.txt and nothing is written
promise: A developer points the fetcher at a site with no llms.txt and is refused
flow:
  id: refuse-a-site-that-publishes-no-llms-txt
  fingerprint: sha256:84a714bbeffbe20ad8086687fa7087c5ace41c2a1b31cb29403ced1d0e7703dc
journey:
  path:
    - cli/spec
  fingerprints:
    - sha256:fc8c4d5ddb9203e73c8831381877c7c0ffd4539a860f994d7caa82312df2a956
binds:
  - doc: .truecourse/specs/sources/docs.truecourse.dev/guard/web-sources.md
    section: web-sources/behavior-notes
    fingerprint: sha256:d5a65b98d0db746dd8395cad07f230dbfa8129c7b7e5ee9f2573a5e637a4d4e0
needs:
  - llms-txt-site
setup:
  files:
    package.json: |
      {
        "name": "no-llms-txt-sample",
        "version": "1.0.0",
        "type": "module",
        "private": true
      }
  env:
    TRUECOURSE_TELEMETRY: '0'
    TRUECOURSE_LLM_TRANSPORT: claude-code
  git:
    branch: main
    identity:
      name: TrueCourse Reference
      email: reference@truecourse.test
normalize: []
driver: cli
steps:
  - run:
      - spec
      - source
      - add
      - ${supplied:llms-txt-site.no-llms-txt-url}
      - '-y'
    timeoutMs: 600000
    expect:
      exit: 1
      files:
        .truecourse/specs/sources.json:
          absent: true
        .truecourse/specs/sources:
          absent: true
    note: >-
      Both halves of the claim ride the same observation. Unsupported: the command fails instead of
      registering anything. No HTML crawling fallback: a crawl would have produced pages, and the
      sandbox holds neither a registry nor a snapshot directory afterwards. The URL comes from the
      registered instance so the refusal is measured against a host that really answers — otherwise
      this would only prove that an unreachable URL is unreachable.
    milestone: web-sources-sites-without-llms-txt-unsupported
