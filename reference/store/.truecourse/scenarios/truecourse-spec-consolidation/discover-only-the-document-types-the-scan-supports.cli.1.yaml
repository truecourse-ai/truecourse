id: discover-only-the-document-types-the-scan-supports.cli.1
title: A developer sees exactly which files doc discovery opens
promise: A developer sees which files doc discovery reaches and which it never opens
flow:
  id: discover-only-the-document-types-the-scan-supports
  fingerprint: sha256:879a897d98ce4a1fbccee78bdf87cf28bf552edc2164a7c40661b2a8cd65f15d
journey:
  path:
    - cli/spec
  fingerprints:
    - sha256:fc8c4d5ddb9203e73c8831381877c7c0ffd4539a860f994d7caa82312df2a956
binds:
  - doc: .truecourse/specs/sources/docs.truecourse.dev/guard/spec-scan.md
    section: spec-scan/which-documents-are-scanned
    fingerprint: sha256:3795501d7c674e4397074ebc9e75b29cddd8a2f7cdfe086bcd8ff86de0577986
  - doc: .truecourse/specs/sources/docs.truecourse.dev/guard/spec-scan.md
