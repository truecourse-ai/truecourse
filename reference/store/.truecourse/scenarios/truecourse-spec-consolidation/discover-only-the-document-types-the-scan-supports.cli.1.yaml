  env:
    TRUECOURSE_TELEMETRY: '0'
    TRUECOURSE_LLM_TRANSPORT: claude-code
  git:
    branch: main
    identity:
      name: TrueCourse Reference
      email: reference@truecourse.test
    commits:
      - files:
          - package.json
          - pnpm-lock.yaml
          - docker-compose.yml
          - CHANGELOG.md
          - docs/probe-alpha.md
          - docs/probe-beta.mdx
          - docs/probe-gamma.markdown
          - docs/probe-delta.mdown
          - docs/probe-epsilon.mkd
          - docs/probe-notes.txt
          - docs/probe-notes.rst
          - dist/probe-build.md
          - vendor/probe-vendor.md
          - agents/rules/probe-rule.md
          - agents/skills/probe-skill.md
          - templates/probe-boilerplate.md
        message: seed discovery sample
normalize: []
driver: cli
steps:
  - write:
      .git/probe-inside-git.md: |
        # Git internals note

        ## Scope

        a git object is described here for the teams that build and operate it.

        ## Requirements

        - Every a git object request carries a tenant identifier and is rejected without one.
        - A a git object record is retained for 90 days and then deleted.
        - Changes to a git object are audited with the actor, the timestamp and the previous value.

        ## Out of scope

        Reporting and billing are specified elsewhere.
    expect:
      files:
        .git/probe-inside-git.md:
          exists: true
    note: >-
      Written after the repository exists, because a file seeded before `git init` would be inside a
      directory git is about to create. `.git/` is one of the three directories the claim says are
      always skipped.
  - run:
      - spec
      - scan
      - '--llm-transport'
      - cli
      - '-y'
    timeoutMs: 1800000
    expect:
      exit: 0
      stdout:
        contains: Corpus written to .truecourse/specs/corpus.json
    note: >-
      One scan over the whole seeded tree; the two listings after it are where every claim in this
      flow is read.
  - run:
      - spec
      - docs
      - list
    expect:
      exit: 0
      stdout:
        matches: >-
          ^(?=[\s\S]*docs/probe-alpha\.md)(?=[\s\S]*docs/probe-beta\.mdx)(?=[\s\S]*docs/probe-gamma\.markdown)(?=[\s\S]*docs/probe-delta\.mdown)(?=[\s\S]*docs/probe-epsilon\.mkd)(?![\s\S]*docs/probe-notes\.txt)(?![\s\S]*docs/probe-notes\.rst)(?![\s\S]*dist/probe-build\.md)(?![\s\S]*vendor/probe-vendor\.md)(?![\s\S]*node_modules/probe-pkg/readme\.md)(?![\s\S]*\.truecourse/probe-inside-store\.md)(?![\s\S]*\.git/probe-inside-git\.md)(?![\s\S]*agents/rules/probe-rule\.md)(?![\s\S]*agents/skills/probe-skill\.md)(?![\s\S]*CHANGELOG\.md)(?![\s\S]*templates/probe-boilerplate\.md)(?![\s\S]*package\.json)(?![\s\S]*pnpm-lock\.yaml)(?![\s\S]*docker-compose\.yml)[\s\S]*$
    note: >-
      All five discovered markdown extensions are in the corpus, the `.mdx` among them — headings
      and prose read normally with its JSX components passing through, which is the whole MDX claim.
      Everything the walker must never open is absent: two wrong extensions, a build and a vendor
      directory, `node_modules/`, `.truecourse/`, `.git/`, the two agent-config trees, a changelog,
      a template directory, and three ordinary configuration files. Absence here is half of "never
      discovered"; the other half is the next step.
    milestone:
      - spec-scan-discovers-five-markdown-extensions
      - spec-scan-reads-mdx-like-any-other-markdown
      - spec-scan-other-extensions-are-never-discovered
      - spec-scan-skips-build-and-vendor-directories
      - spec-scan-always-skips-truecourse-node-modules-and-git
      - spec-scan-prefilter-drops-non-spec-trees-without-an-llm
      - spec-scan-ordinary-config-is-never-mistaken-for-a-spec
  - run:
      - spec
      - docs
      - skipped
    timeoutMs: 900000
    expect:
      exit: 0
      stdout:
        matches: >-
          ^(?![\s\S]*docs/probe-notes\.txt)(?![\s\S]*docs/probe-notes\.rst)(?![\s\S]*dist/probe-build\.md)(?![\s\S]*vendor/probe-vendor\.md)(?![\s\S]*node_modules/probe-pkg/readme\.md)(?![\s\S]*\.truecourse/probe-inside-store\.md)(?![\s\S]*\.git/probe-inside-git\.md)(?![\s\S]*package\.json)(?![\s\S]*pnpm-lock\.yaml)(?![\s\S]*docker-compose\.yml)(?=[\s\S]*agents/rules/probe-rule\.md[\s\S]*\(rules/\))(?=[\s\S]*agents/skills/probe-skill\.md[\s\S]*\(skills/\))(?=[\s\S]*templates/probe-boilerplate\.md[\s\S]*\(under templates/\))(?=[\s\S]*CHANGELOG\.md[\s\S]*\(changelog\.md\))[\s\S]*$
    note: >-
      The other half, in two registers. NEVER DISCOVERED (absent from every listing): the wrong
      extensions and the build/vendor/tooling trees — the walker never opened them. PRE-FILTERED
      (present in the skipped listing, each with its deterministic parenthesised rule as the
      reason): the agent-config trees, the template dir and the changelog — recorded so a user can
      force-include them, and the canned rule-shaped reason is itself the proof no LLM was asked.
    milestone:
      - spec-scan-other-extensions-are-never-discovered
      - spec-scan-skips-build-and-vendor-directories
      - spec-scan-always-skips-truecourse-node-modules-and-git
      - spec-scan-prefilter-drops-non-spec-trees-without-an-llm
      - spec-scan-ordinary-config-is-never-mistaken-for-a-spec
