    pnpm-lock.yaml: |
      lockfileVersion: '9.0'
      settings:
        autoInstallPeers: true
    docker-compose.yml: |
      services:
        api:
          image: node:22
    CHANGELOG.md: |
      # Changelog

      ## 1.2.0

      - Added the retention window.
    docs/probe-alpha.md: |
      # Account provisioning

      ## Scope

      an account is described here for the teams that build and operate it.

      ## Requirements

      - Every an account request carries a tenant identifier and is rejected without one.
      - A an account record is retained for 90 days and then deleted.
      - Changes to an account are audited with the actor, the timestamp and the previous value.

      ## Out of scope

      Reporting and billing are specified elsewhere.
    docs/probe-beta.mdx: |
      ---
      title: Notification delivery
      ---

      import { Callout } from '@site/components/Callout'

      # Notification delivery

      <Callout type="warning">Delivery is at-least-once.</Callout>

      ## Requirements

      - A notification is delivered at least once and may be delivered twice.
      - A notification that fails five delivery attempts moves to the dead-letter queue.

      <Callout>Consumers must be idempotent.</Callout>
