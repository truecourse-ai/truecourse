guard: 3
id: price-a-scan-and-decline-it-before-any-llm-call.cli.1
title: A developer is shown what a scan will cost and declines it twice before approving
promise: A developer prices a scan, declines it, and then approves it
flow:
  id: price-a-scan-and-decline-it-before-any-llm-call
  fingerprint: sha256:7a00fb82b6085f9fee8ced8f214cf686f6321ae40e6d2116ff39bb80d3c4b750
journey:
  path:
    - cli/spec
  fingerprints:
    - sha256:fc8c4d5ddb9203e73c8831381877c7c0ffd4539a860f994d7caa82312df2a956
binds:
  - doc: .truecourse/specs/sources/docs.truecourse.dev/guard/spec-scan.md
    section: spec-scan/cost-estimate-and-caching
    fingerprint: sha256:87d2d9f8d2ac2c55241c589c9d2fb83634cfacbffdee40b793fa93455c1b0662
needs:
  - spec-docs-project
  - claude-login
setup:
  env:
    TRUECOURSE_TELEMETRY: '0'
    TRUECOURSE_LLM_TRANSPORT: claude-code
normalize: []
driver: cli
steps:
  - run:
      - spec
      - scan
      - '--llm-transport'
      - cli
    cwd: .tc-supplied/spec-docs-project
    timeoutMs: 600000
    expect:
      exit: 0
      stdout:
        matches: >-
          ^(?=[\s\S]*Scan will make ~[0-9]+ LLM calls)(?=[\s\S]*Cannot prompt for confirmation
          non-interactively\. Pass --yes to approve the estimate\.)(?=[\s\S]*Scan
          cancelled\.)[\s\S]*$
      files:
        .tc-supplied/spec-docs-project/.truecourse/specs/corpus.json:
          absent: true
    note: >-
      The estimate is printed and the run then ends without a corpus — which is the sharpest
      available form of "before calling the LLM": nothing was called, so the panel demonstrably
      precedes the first call rather than merely preceding the summary. The two runs over an
      unchanged corpus that the claim also mentions are not compared here; no matcher relates one
      step's output to another's.
    milestone: spec-scan-prints-a-token-and-ceiling-cost-estimate
  - run:
      - spec
      - scan
      - '--llm-transport'
      - cli
    cwd: .tc-supplied/spec-docs-project
    stdin:
      - marker: 'Proceed with scan?'
        answer: 'n'
    tty: true
    timeoutMs: 600000
    expect:
      exit: 0
      output:
        matches: >-
          ^(?=[\s\S]*Scan will make ~)(?=[\s\S]*Proceed with scan\?)(?=[\s\S]*Scan
          cancelled\.)[\s\S]*$
      files:
        .tc-supplied/spec-docs-project/.truecourse/specs/corpus.json:
          absent: true
    note: >-
      On a real terminal the question itself exists, and it is asked AFTER the estimate and BEFORE
      any work: the answer is no and the store still holds no corpus. The scripted answer is the
      printable `n`, which a clack confirm accepts as a submit — unlike a select prompt, which the
      runner cannot yet drive.
    milestone: spec-scan-asks-for-confirmation-before-calling-the-llm
  - run:
      - spec
      - scan
      - '--llm-transport'
      - cli
      - '-y'
    cwd: .tc-supplied/spec-docs-project
    tty: true
    timeoutMs: 3600000
    expect:
      exit: 0
      output:
        matches: >-
          ^(?![\s\S]*Proceed with scan\?)(?=[\s\S]*Corpus written to
          \.truecourse/specs/corpus\.json)[\s\S]*$
    note: >-
      The same command on the same terminal, with the flag: the question is absent and the scan runs
      to a written corpus. It runs on a pseudo-terminal deliberately — on a pipe the missing
      question would be explained by the missing terminal and the flag would be proving nothing.
    milestone: spec-scan-yes-flag-skips-the-confirmation
