id: review-run-history-and-enter-diff-mode
title: A developer reads the run history, loads a past run, and diffs the working tree
promise: >-
  A developer reads the run history, loads an older analysis into every view, returns to
  latest, and compares the working tree against the committed baseline.
flow:
  id: review-run-history-and-enter-diff-mode
  fingerprint: sha256:542f79f0fdba1c5402ea550f1776d06ddcfb8a93d15bd287ee41286333fad51a
