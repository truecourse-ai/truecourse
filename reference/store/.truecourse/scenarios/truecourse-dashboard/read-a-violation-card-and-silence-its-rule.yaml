id: read-a-violation-card-and-silence-its-rule
title: A developer reads one violation card and silences the rule that raised it
promise: >-
  A developer reads a finding on its card, silences the rule that raised it, and turns
  it back on from the Rules panel.
flow:
  id: read-a-violation-card-and-silence-its-rule
  fingerprint: sha256:1d384e5b580dd32b0b6feef9d2fca690bfbbf3e8832f822ce980a41e223ba7fd
interface:
  path:
    - cli/analyze
    - web/open-dashboard-home
    - web/open-repo-report
    - web/search-the-violation-list
    - web/reveal-a-violations-fix-prompt
    - web/silence-rule-from-violation-card
    - api/get-api-repos-id-violations
    - cli/rules-list
    - web/reenable-rule-from-rules-panel
  fingerprints:
    - sha256:66792fe9ce97d69aa7a54ecd634d57f145eebe1d89de01e7f2f4aedc0dc232b8
