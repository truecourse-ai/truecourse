guard: 3
id: run-an-analysis-from-the-dashboard.cli.1
title: A developer presses Analyze, answers both gates, and watches the run to completion
promise: >-
  A developer presses Analyze in the dashboard, answers the dirty-tree and LLM gates, and
  watches the run to completion.
flow:
  id: run-an-analysis-from-the-dashboard
  fingerprint: sha256:91651d8bbaaad0660439c3de91c3e87a8a51e4ebc631a1e4dab681826cf59825
interface:
  path:
    - cli/add
    - web/open-an-unanalyzed-repository
    - web/run-an-analysis-from-the-header
    - web/analyze-working-tree-without-stashing
    - web/approve-the-llm-rules-for-a-run
    - cli/list
    - cli/analyze
    - web/open-the-graphs-tab
    - api/get-api-repos-id-violations
    - api/get-api-repos-id-analyses
    - cli/config-llm-show
  fingerprints:
    - sha256:61d9dd0c58f542195f6305faa593fc5ee2fc8de203fac212df3c86d442beb0a4
    - sha256:974fded7a1d399851b62982724063f2a195f5ba4cef7d83a221100319349c84b
