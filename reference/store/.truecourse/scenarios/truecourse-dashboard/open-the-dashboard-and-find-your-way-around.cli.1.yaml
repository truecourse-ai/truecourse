guard: 3
id: open-the-dashboard-and-find-your-way-around.cli.1
title: A developer starts the dashboard in a repository and learns where everything is
promise: >-
  A developer starts the dashboard in a repository, lands on that repository's page,
  and learns where everything is.
flow:
  id: open-the-dashboard-and-find-your-way-around
  fingerprint: sha256:3b35b313aa314e11329fbefe0d4b2ecfabb1a3b9bb5096415159bf7c907fda2a
interface:
  path:
    - cli/analyze
    - web/open-dashboard-home
    - web/open-repo-report
    - web/switch-to-the-guard-section
    - cli/dashboard
  fingerprints:
    - sha256:66792fe9ce97d69aa7a54ecd634d57f145eebe1d89de01e7f2f4aedc0dc232b8
    - sha256:88d3a9eac5b8cd6d86dbb9e63bcb0764bad77da40f236954826c55112408bf33
    - sha256:1dd16aa090f30f87c67c0c8811b74a258b28fbbbf6a74f2b586345544119ea8b
    - sha256:50a6d196d960baca6e757f0ab171cce945672a6dbd30047588f39e865f0b1066
    - sha256:d4d213322f7fb40cfada963f76850fd2e1f5be558cf43546dbe742fe1015b989
binds:
  - doc: reference/spec-docs/dashboard/overview.mdx
    section: overview
    fingerprint: sha256:428142f4f5b129e47fbdda4bf776c746ff031734c8940f42313c68758d92569e
  - doc: reference/spec-docs/dashboard/overview.mdx
    section: starting-and-stopping
    fingerprint: sha256:36db114b36152f2a4b2a916a40d68c61991646e449de6bdb048dab23f6c0b2a2
  - doc: reference/spec-docs/dashboard/overview.mdx
    section: getting-around
    fingerprint: sha256:b64d05bfdef7ef3cce1d95c719c53884d5a0c419c170d00526cc29d0f98842b2
  - doc: reference/spec-docs/dashboard/overview.mdx
    section: sections
    fingerprint: sha256:bc0a90ce41d05f9d7c50f93a81cf3478b6d6788eaf9af4cdabcd6ccc102e586a
  - doc: reference/spec-docs/dashboard/overview.mdx
    section: shareable-urls
    fingerprint: sha256:9d2179f678b0f8990a2708a23510b306c1ee3bf35be01dae1f6c860f71e5921a
setup:
  files:
    sample-app/package.json: |
      {
        "name": "sample-app",
        "version": "1.0.0",
        "type": "module"
      }
    sample-app/src/index.js: |
      export function main(input) {
        console.log('starting')
        return input
      }
    sample-app/src/unsafe.js: |
      export function runRule(source) {
        return eval(source)
      }
    sample-app/services/api/handler.js: |
      export function handle(request) {
        return { status: 200, body: request.body }
      }
  env:
    TRUECOURSE_TELEMETRY: '0'
    TRUECOURSE_LLM_TRANSPORT: claude-code
  git:
    root: sample-app
    branch: main
    identity:
      name: TrueCourse Reference
      email: reference@truecourse.test
    commits:
      - files:
          - package.json
          - src/index.js
          - src/unsafe.js
          - services/api/handler.js
        message: seed the sample app
normalize: []
steps:
  - run:
      - analyze
      - '--no-llm'
      - '--no-stash'
      - '--no-skills'
    cwd: sample-app
    expect:
      exit: 0
      files:
        sample-app/.truecourse/LATEST.json:
          exists: true
    note: >-
      Arranges the world the dashboard renders — the run the browser steps below must
      find already stored. It proves no claim of its own: every promise `analyze` makes
      belongs to the code-analysis area. `--no-llm` keeps it deterministic and free,
      `--no-stash` answers the dirty-tree question a committed tree would never ask, and
      `--no-skills` keeps the sandbox home free of an editor install. The scenario-global
      `TRUECOURSE_LLM_TRANSPORT` is what keeps `~/.truecourse/config.json` from being
      written by the first-run transport wizard — and that file's ABSENCE is the only
      condition under which the dashboard's own run-mode question is ever asked (the
      command treats the existence of that one file as "already configured").
  - driver: web
    navigate: /
    expect:
      url:
        equals: /
      visible:
        role: link
        name: sample-app
    note: >-
      The first browser step boots the surface over the same sandbox the step above
      wrote, so the front page can only list a repository the CLI really registered.
      Prepares the click below; it proves no claim, because every front-page promise is
      the repository-list section's, proved in the empty-state flow.
  - driver: web
    click:
      role: link
      name: sample-app
    expect:
      url:
        contains: /repos/sample-app
      text:
        matches: '^(?=[\s\S]*sample-app)(?=[\s\S]*main)(?=[\s\S]*Dynamic code evaluation)[\s\S]*$'
    note: >-
      One page state carrying two promises. The header identity is asserted as the
      repository name beside the branch name `main` — the branch the seeded repository
      is really on, so a header that lost the branch fails here. The findings are the
      other half: `Dynamic code evaluation` is the analyzer's own output for the seeded
      `eval`, written by the CLI run above, and the dashboard executed nothing to show
      it. Both are matched as page text because the header renders the name and the
      branch as unlabelled spans — neither is a heading and neither carries an
      accessible name of its own.
    milestone:
      - dashboard-overview-reads-the-same-store-the-cli-writes
      - dashboard-overview-header-shows-repository-name-and-branch
  - driver: web
    expect:
      visible:
        role: button
        name: Code Analysis
      text:
        matches: '^(?=[\s\S]*Graphs)(?=[\s\S]*Flows)(?=[\s\S]*Files)(?=[\s\S]*Databases)(?=[\s\S]*Analyses)[\s\S]*$'
    note: >-
      The same page, read for the rail. Each name is one rail entry's accessible label,
      and together they are exactly the surfaces the doc's table lists for Code
      Analysis — the graph, files, flows, databases and run history — with the
      violations list and analytics being Home, the tab the walk is standing on. The
      section switcher naming `Code Analysis` is what makes this the CODE ANALYSIS
      inventory rather than some other section's rail.
    milestone:
      - dashboard-overview-left-rail-holds-the-code-analysis-tabs
      - dashboard-overview-code-analysis-section-covers-analyze-output
  - driver: web
    expect:
      visible:
        role: textbox
        name: Search violations
      text:
        matches: '^(?=[\s\S]*Violation Trend)(?=[\s\S]*By Severity)(?=[\s\S]*Code Hotspots)[\s\S]*$'
    note: >-
      Home is one screen with two halves, and each half is asserted by something only
      that half has: the analytics column by three of its own panels, the violations
      column by the search box that sits above the list. Left-versus-right is geometry
      the vocabulary cannot state; what it can state is that both halves are on the
      Home tab at once, which is the falsifiable content of the split.
    milestone:
      - dashboard-overview-home-tab-shows-analytics-and-violations
  - driver: web
    click:
      role: button
      name: Code Analysis
    expect:
      visible:
        role: menuitemradio
        name: Spec Guard
    note: >-
      Opening the dropdown beside the logo. Prepares the switch below — the claim is
      about what choosing the other entry DOES, so the menu being open proves nothing
      on its own.
  - driver: web
    click:
      role: menuitemradio
      name: Spec Guard
    expect:
      url:
        matches: '^(?=.*section=guard)(?=.*tab=coverage).*$'
      text:
        matches: '^(?=[\s\S]*Coverage)(?=[\s\S]*Sources)(?=[\s\S]*Interfaces)(?![\s\S]*Graphs)[\s\S]*$'
    note: >-
      The dropdown moved the page to the other section, and three assertions come out of
      the one move. The section really changed (the Code Analysis rail is GONE — the
      negative on `Graphs` is the load-bearing half, since the rail's labels are always
      in the page text while it is rendered). The Spec Guard rail offers the corpus and
      coverage surfaces the doc names. And the address gained both `section=` and
      `tab=`, which is the shareable-URL promise stated over the very move that should
      have written it.
    milestone:
      - dashboard-overview-section-dropdown-switches-sections
      - dashboard-overview-spec-guard-section-covers-corpus-and-coverage
      - dashboard-overview-url-carries-section-and-tab
  - driver: web
    navigate: /repos/sample-app
    expect:
      url:
        equals: /repos/sample-app
      text:
        matches: '^(?=[\s\S]*Dynamic code evaluation)(?=[\s\S]*Graphs)[\s\S]*$'
    note: >-
      DELIBERATELY PARTIAL, and the note is the honest half. The claim is that browser
      Back and Forward move through the views the section and tab switches created; the
      web vocabulary has exactly four verbs — navigate, click, fill, expect — and none
      of them is history, so the return trip is expressed as re-opening the earlier
      address instead. What this step therefore proves is that the earlier view's
      address still renders that view (a link reopens it); that Back and Forward
      themselves make that move is NOT proved here and is filed as a driver gap.
    milestone:
      - dashboard-overview-back-and-forward-move-through-views
  - driver: web
    click:
      role: button
      name: Toggle theme
    expect:
      visible:
        role: button
        name: Toggle theme
    note: >-
      DELIBERATELY PARTIAL, twice over, and this note is the whole of the honesty. The
      sun/moon control is locatable — its accessible name is the constant `Toggle
      theme` — and this step presses it. What the page does NOT expose is the RESULT:
      dark mode lives in a `dark` class on the document element and in a `theme` key of
      browser storage, the button's name never changes, and no visible text names the
      palette. A web expectation can assert an address, page text, or an element's
      presence — none of the three can see a class or a storage key — so neither the
      flip nor its survival across a reload can be observed with today's vocabulary.
      Both claims are tagged here rather than split across a reload step that would
      assert nothing either; the missing matcher is filed as a driver gap.
    milestone:
      - dashboard-overview-theme-button-toggles-light-and-dark
      - dashboard-overview-theme-choice-is-remembered-in-the-browser
  - run:
      - dashboard
    cwd: sample-app/services/api
    tty: true
    stdin:
      - marker: How would you like to run the dashboard?
        answer: "\x1b"
    expect:
      exit: 0
      output:
        matches: '^(?=[\s\S]*How would you like to run the dashboard)(?=[\s\S]*Cancelled)[\s\S]*$'
    note: >-
      The first-run question, asked and answered — the only step in this scenario that
      can see it and return. The sandbox home has never been written to (the transport
      wizard was switched off by env), so this IS a first run with no saved mode, which
      is the doc's stated condition. The answer is ESCAPE, the terminal's cancel: the
      question is the observation, and cancelling leaves no mode saved, so the step
      below is still asked it. A piped step could never be asked at all, which is why
      this one holds a terminal.
    milestone:
      - dashboard-overview-first-run-asks-console-or-service
  - run:
      - dashboard
    cwd: sample-app/services/api
    tty: true
    timeoutMs: 120000
    stdin:
      - marker: How would you like to run the dashboard?
        answer: "\x1b[B\r"
    expect:
      output:
        matches: '^(?=[\s\S]*Starting dashboard server)(?=[\s\S]*Opening http://localhost:3001)(?=[\s\S]*Dashboard open at http://localhost:3001/repos/sample-app)(?=[\s\S]*Press Ctrl\+C to stop the server)[\s\S]*$'
    note: >-
      The whole console-mode promise in one invocation, answered with the second option
      (arrow-down, then carriage return — the only key a select prompt accepts as
      submit). Each lookahead is one claim: the server starts and answers on
      `localhost:3001`; a browser is opened at that address; the address it opens
      carries `/repos/sample-app`, which is this repository — reached from
      `services/api`, a directory with no `.truecourse/` of its own, so "standing in"
      really did mean an ancestor directory; and the terminal is held rather than
      returned, which is what console mode IS. No exit code is asserted, because a
      command that holds the terminal has none to give. TWO honesty notes: (1) this step
      is expected to consume its whole budget and be killed, which the runner reports as
      an infrastructure error rather than a verdict — there is no verb for "run until
      the output says X, then terminate", and that is filed as a gap; it is last in the
      list so nothing else is lost to it. (2) The registration claim rides here because
      the command's first open is what the doc says registers the repository, but the
      arranging `analyze` above already registered it, so registration is not falsifiable
      inside this sandbox — an edge flow starting from an unregistered `.truecourse/`
      is the honest home for it.
    milestone:
      - dashboard-overview-command-starts-a-local-web-server
      - dashboard-overview-server-listens-on-localhost-3001
      - dashboard-overview-console-runs-in-this-terminal
      - dashboard-overview-command-opens-the-browser
      - dashboard-overview-lands-on-the-repository-you-ran-it-in
      - dashboard-overview-standing-in-means-a-truecourse-dir-at-or-above-cwd
      - dashboard-overview-registers-the-repository-on-first-open
