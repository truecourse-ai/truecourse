guard: 3
id: read-the-analytics-of-a-run.cli.1
title: A developer reads the analytics column and uses a widget to narrow the list
promise: >-
  A developer reads the analytics column of an analysis and uses each widget to narrow the
  violations list beside it.
flow:
  id: read-the-analytics-of-a-run
  fingerprint: sha256:52327b3f9c969229222756c58b3511bdb373917f4fa5526728fc58bb28867f2d
