setup:
  files:
    sample-app/package.json: |
      {
        "name": "sample-app",
        "version": "1.0.0",
        "private": true,
        "type": "module",
        "workspaces": ["services/*"]
      }
    sample-app/prisma/schema.prisma: |
      datasource db {
        provider = "postgresql"
        url      = env("DATABASE_URL")
      }

      model User {
        id     Int     @id @default(autoincrement())
        email  String  @unique
        name   String?
        orders Order[]
      }

      model Order {
        id     Int   @id @default(autoincrement())
        userId Int
        user   User  @relation(fields: [userId], references: [id])
        total  Float
      }
    sample-app/services/api/package.json: |
      {
        "name": "api",
        "version": "1.0.0",
        "type": "module",
        "main": "src/server.js",
        "dependencies": { "express": "^4.18.2", "pg": "^8.11.3" }
      }
    sample-app/services/api/src/server.js: |
      import express from 'express'
      import { listUsers, createUser } from './routes.js'

      const app = express()

      app.get('/users', listUsers)
      app.post('/users', createUser)

      app.listen(3000)

      export default app
    sample-app/services/api/src/routes.js: |
      import { findAllUsers, saveUser } from './repositories/user-repository.js'

      export async function listUsers(req, res) {
        const users = await findAllUsers()
        res.json(users)
      }

      export async function createUser(req, res) {
        const user = await saveUser(req.body)
        res.json(user)
      }
    sample-app/services/api/src/repositories/user-repository.js: |
      import pg from 'pg'

      const pool = new pg.Pool({ connectionString: 'postgres://localhost:5432/shop' })

      export async function findAllUsers() {
        const result = await pool.query('SELECT * FROM users')
        return result.rows
      }

      export async function saveUser(user) {
        const result = await pool.query('INSERT INTO users (email) VALUES (' + user.email + ')')
        return result.rows
      }
    sample-app/services/worker/package.json: |
      {
        "name": "worker",
        "version": "1.0.0",
        "type": "module",
        "main": "src/index.js"
      }
    sample-app/services/worker/src/index.js: |
      export function runRule(source) {
        return eval(source)
      }

      export function main() {
        console.log('worker starting')
        return runRule('1 + 1')
      }

      main()
      setTimeout(main, 4200)
  env:
    TRUECOURSE_TELEMETRY: '0'
  git:
    root: sample-app
    branch: main
    identity:
      name: TrueCourse Reference
      email: reference@truecourse.test
    commits:
      - files:
          - package.json
          - prisma/schema.prisma
          - services/api/package.json
          - services/api/src/server.js
          - services/api/src/routes.js
          - services/api/src/repositories/user-repository.js
          - services/worker/package.json
          - services/worker/src/index.js
        message: seed the sample app
normalize: []
driver: cli
steps:
  - run:
      - analyze
      - '--no-llm'
      - '--no-stash'
      - '--no-skills'
    cwd: sample-app
    expect:
      exit: 0
      files:
        sample-app/.truecourse/LATEST.json:
          exists: true
    note: >-
      The first of the two analyses this flow needs. With one run on record there is no
      trend to draw, no previous analysis to compare against and nothing resolved to count,
      so half the summary row and the whole trend card would be unfalsifiable — the second
      run below is what gives them values. Deterministic and free (`--no-llm`), with the
      dirty-tree and editor-install questions pre-answered.
  - write:
      sample-app/services/worker/src/index.js: |
        export function runRule(source) {
          return Number(source)
        }

        export function main() {
          console.log('worker starting')
          return runRule('1 + 1')
        }

        main()
        setTimeout(main, 4200)
    note: >-
      The fix between the runs: the worker stops evaluating its input, which removes the one
      `security/deterministic/eval-usage` finding and leaves the other fifteen untouched.
      Transient, flow-specific state the resolved-count and trend claims are themselves
      about — exactly what a scenario may arrange for itself.
  - git:
      - commit
      - '-am'
      - stop evaluating the rule source
    cwd: sample-app
    expect:
      exit: 0
    note: >-
      Committed so the second analysis reads it as the baseline state; an uncommitted edit
      is the diff flow's world, not this one's.
  - run:
      - analyze
      - '--no-llm'
      - '--no-stash'
      - '--no-skills'
    cwd: sample-app
    expect:
      exit: 0
      stdout:
        contains: '15 violations'
    note: >-
      The second analysis: fifteen findings still open, one resolved against the first run.
      Asserted on the CLI's own count so the world this flow reads is pinned before the
      browser ever opens — every number the analytics column is checked against below
      derives from it.
  - driver: web
    navigate: /
    expect:
      visible:
        role: link
        name: sample-app
    note: >-
      Boots the browser against the surface the sandbox serves. Prepares the click below and
      proves nothing of its own.
  - driver: web
    click:
      role: link
      name: sample-app
    expect:
      url:
        contains: /repos/sample-app
    note: >-
      Opens the repository's report, which is where the analytics column lives. Prepares
      every reading below.
  - request:
      method: GET
      path: /api/repos/sample-app/violations?limit=100
    expect:
      status: 200
      json:
        total:
          equals: 15
    note: >-
      The unfiltered violations list, read as data at the same origin the browser is driving.
      It is what the `active` chip has to agree with — a chip asserted against a literal
      would only be asserting on the seed, while a chip asserted against the list beside it
      is the doc's actual promise. Proves no claim of its own.
  - driver: web
    expect:
      text:
        matches: ^(?=[\s\S]*resolve)(?=[\s\S]*resolved)(?=[\s\S]*active)(?=[\s\S]*stale)(?=[\s\S]*rate)[\s\S]*$
    note: >-
      The summary row, counted by its five labels. Asserted as the five words the chips
      render rather than as an element count, because the chips carry no role of their own —
      a row that lost one of them fails this.
    milestone:
      - dashboard-analytics-summary-row-has-five-chips
  - driver: web
    expect:
      text:
        matches: >-
          ^(?=[\s\S]*15\s*active)(?=[\s\S]*1\s*resolved)(?=[\s\S]*\d+[mhd]\s*resolve)(?=[\s\S]*6%\s*rate)[\s\S]*$
    note: >-
      The four chips this world can falsify, read together because they are one screen and
      one arrangement. `active` is 15 — the same number the list above answered with, which
      is what makes the left half a summary OF the analysis being viewed rather than a
      decoration. `resolved` is 1 because the second analysis really did fix a finding the
      first one had. `rate` is 6% — one resolved out of the sixteen ever detected — the
      arithmetic the doc states. `resolve` is asserted as a RENDERED DURATION, never as a
      value: its number is whatever the sandbox's clock made of the seconds between the two
      runs, and only the `—` of "nothing ever resolved" would fail it.
    milestone:
      - dashboard-analytics-left-half-summarizes-the-viewed-analysis
      - dashboard-analytics-active-chip-counts-open-violations
      - dashboard-analytics-resolved-chip-counts-all-fixed-violations
      - dashboard-analytics-resolve-chip-is-average-time-to-resolution
      - dashboard-analytics-rate-chip-is-the-resolved-share
  - driver: web
    expect:
      text:
        matches: ^(?=[\s\S]*Violation Trend)(?=[\s\S]*Total Active)(?=[\s\S]*New)(?=[\s\S]*Resolved)[\s\S]*$
    note: >-
      The trend card, asserted on the three series the doc says it plots. Authored to the
      doc's sentence and authored RED: the legend resolved its labels through the chart
      config by data key, the total-active series was configured under a different key,
      and the first legend entry rendered as a colour swatch with no words at all. The
      scenario was kept as the doc states it rather than weakened to the swatch, the
      finding was reported, and the chart was fixed — its config is now keyed by the data
      key each series is drawn with, so the legend names Total Active like the other two.
      This step passes as of that fix; the assertion is unchanged, which is the point of
      having authored it to the doc in the first place. The two series that always
      rendered stay asserted alongside it so a regression names exactly which one is
      missing.
    milestone:
      - dashboard-analytics-trend-plots-active-new-and-resolved
  - driver: web
    expect:
      text:
        matches: ^[\s\S]*Violation Trend[\s\S]*-1[\s\S]*$
    note: >-
      The header's change against the previous analysis: sixteen active then, fifteen now,
      so the delta is -1. Asserted as the signed number the header renders, immediately
      after the card's own title so a stray digit elsewhere on the page cannot satisfy it.
      Whether that number is drawn red or green is a colour treatment the driver has no
      vocabulary to read, and is recorded as a gap rather than faked here.
    milestone:
      - dashboard-analytics-trend-header-shows-the-change-vs-previous
  - driver: web
    expect:
      text:
        matches: >-
          ^(?=[\s\S]*By Category)(?=[\s\S]*Security)(?=[\s\S]*Code Quality)(?=[\s\S]*Database)(?=[\s\S]*By
          Category[\s\S]*15)[\s\S]*$
    note: >-
      The donut: a slice per category present in the analysis, and the total in the middle.
      The categories named are three of the six the seed really raises findings in, and the
      15 asserted after the card's title is the centre label — the sum of every slice, which
      is the whole analysis. The slices themselves are chart geometry with no role and no
      name, so clicking one is a gap; what the card SHOWS is read here.
    milestone:
      - dashboard-analytics-category-donut-shows-totals
  - driver: web
    expect:
      text:
        matches: >-
          ^(?=[\s\S]*By Severity)(?=[\s\S]*High)(?=[\s\S]*Medium)(?=[\s\S]*Low)(?![\s\S]*Critical)[\s\S]*$
    note: >-
      A bar per severity PRESENT, and none for a severity that is not. The seed raises high,
      medium and low findings and no critical one, so the negative is the load-bearing half:
      a chart that always drew four bars would fail here. The bars are addressed through
      their axis labels, which is the only text the chart renders. The negative is
      page-wide, which is sound in THIS world — with no attributed findings the offender
      table renders its empty state rather than its `Critical` column header, and the
      severity dropdown names its options only while open.
    milestone:
      - dashboard-analytics-severity-chart-has-a-bar-per-severity
  - driver: web
    expect:
      text:
        matches: >-
          ^[\s\S]*Code Hotspots[\s\S]*server\.js\s*8\s*(critical|high|medium|low)[\s\S]*index\.js\s*4\s*(critical|high|medium|low)[\s\S]*user-repository\.js\s*3\s*(critical|high|medium|low)[\s\S]*$
    note: >-
      The hotspot table, read as the doc describes it: the files with the most code
      violations, in descending order, each with its count. Three files carry findings in
      this world (8, 4 and 3), which is under the ten-row cap and enough to make the ORDER
      falsifiable — a table that listed them in any other order, or lost a file, fails. The
      rows render basenames only, which is what the assertion names.
    milestone:
      - dashboard-analytics-hotspots-lists-ten-files-by-code-violations
      - dashboard-analytics-hotspot-shows-its-worst-severity
  - driver: web
    click:
      role: row
      name: index.js
    expect:
      text:
        matches: ^(?=[\s\S]*Filtered by)(?=[\s\S]*index\.js)(?![\s\S]*Potential SQL injection)[\s\S]*$
    note: >-
      The first widget click of the flow, and so the step that proves BOTH the general
      promise — clicking into a chart narrows the list beside it — and the hotspot table's
      own. The doc states the general claim before the donut and this proves it after,
      because the donut and the severity bars expose no clickable element a user-replayable
      locator can name; this row does. The negative is what makes it a narrowing:
      `Potential SQL injection` is the highest-severity finding of ANOTHER file, first in
      the unfiltered list, and it has to leave.
    milestone:
      - dashboard-analytics-clicking-a-chart-narrows-the-list
      - dashboard-analytics-hotspot-row-filters-the-list
  - driver: web
    click:
      role: row
      name: index.js
    expect:
      text:
        matches: ^(?![\s\S]*Filtered by)(?=[\s\S]*Potential SQL injection)[\s\S]*$
    note: >-
      The same row again, and the filter is gone: the chip row disappears and the finding
      that was dropped a moment ago is back. Same widget, same click, opposite state — which
      is the doc's "clicking the same thing again clears it".
    milestone:
      - dashboard-analytics-clicking-again-clears-the-filter
