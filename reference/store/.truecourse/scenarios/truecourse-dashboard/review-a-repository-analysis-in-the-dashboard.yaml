id: review-a-repository-analysis-in-the-dashboard
title: A developer opens the dashboard and reads a repository’s analysis
promise: A developer opens the dashboard and reads a repository’s analysis
flow:
  id: review-a-repository-analysis-in-the-dashboard
  fingerprint: sha256:41ac476a2bfa0a774ce8545a9898ba8088ed46f67790950b3bd479fab6cc0b1a
interface:
  path:
    - cli/analyze
    - web/open-dashboard-home
    - web/open-repo-report
    - web/filter-violations-by-category
    - api/get-api-repos-id-violations
    - web/switch-to-the-guard-section
  fingerprints:
    - sha256:66792fe9ce97d69aa7a54ecd634d57f145eebe1d89de01e7f2f4aedc0dc232b8
    - sha256:88d3a9eac5b8cd6d86dbb9e63bcb0764bad77da40f236954826c55112408bf33
    - sha256:1dd16aa090f30f87c67c0c8811b74a258b28fbbbf6a74f2b586345544119ea8b
    - sha256:443701ef7e9295664459c180e548c8393ad77fb0d4e7246df117aa24147b3b14
    - sha256:3b451a118147cc0a8bdb70612625b77ea367536f7a04b7921d97bdaa39738b02
    - sha256:50a6d196d960baca6e757f0ab171cce945672a6dbd30047588f39e865f0b1066
binds:
  - doc: .truecourse/specs/sources/docs.truecourse.dev/dashboard.md
    section: dashboard
    fingerprint: sha256:e60acdd592b2c39a8d642d76efc2fca99157adf354fc790ff8d971fd09cdbbbe
  - doc: .truecourse/specs/sources/docs.truecourse.dev/dashboard.md
    section: dashboard/what-s-inside
    fingerprint: sha256:202814253200787ceed84a413e57a9e8db8688b81f8d719070682ceb632084cd
setup:
  files:
    sample-app/package.json: |
      {
        "name": "sample-app",
        "version": "1.0.0",
        "type": "module"
      }
    sample-app/src/index.js: |
      export function main(input) {
        console.log('starting')
        return input
      }
    sample-app/src/unsafe.js: |
      export function runRule(source) {
        return eval(source)
      }
  env:
    TRUECOURSE_TELEMETRY: '0'
  git:
    root: sample-app
    branch: main
    identity:
      name: TrueCourse Reference
      email: reference@truecourse.test
    commits:
      - files:
          - package.json
          - src/index.js
          - src/unsafe.js
        message: seed the sample app
normalize: []
steps:
  - run:
      - analyze
      - '--no-llm'
      - '--no-stash'
      - '--no-skills'
    cwd: sample-app
    expect:
      exit: 0
      files:
        sample-app/.truecourse/LATEST.json:
          exists: true
    note: >-
      Arranges the world the dashboard renders, in the sandbox the web surface will
      serve: the project is analyzed and, by analyzing it, registered — so the
      dashboard resolves it like any repository of the machine. Nothing here is a
      milestone; every claim analyze itself makes belongs to the code-analysis area,
      which proves them through the CLI. `--no-llm` keeps the run deterministic and
      free, `--no-stash` answers the dirty-tree question that a committed tree would
      never ask anyway, and `--no-skills` keeps the sandbox HOME free of an editor
      install this flow has no use for.
  - driver: web
    navigate: /
    expect:
      url:
        equals: /
      visible:
        role: link
        name: sample-app
    note: >-
      The first browser step is what boots the dashboard: the surface serves the
      sandbox the step above populated, so the home page can only list a repository
      that the analyze step really registered. Prepares the click below; it proves no
      claim of its own, because the doc says nothing about a home page.
  - driver: web
    click:
      role: link
      name: sample-app
    expect:
      url:
        contains: /repos/sample-app
      text:
        matches: ^(?=[\s\S]*Dynamic code evaluation)(?=[\s\S]*No unhandledRejection handler)[\s\S]*$
    note: >-
      The card opens the repository’s report, and the report carries the findings the
      analysis recorded — two of them named here, from two different files, so a
      single stray string could not satisfy the assertion. The titles are the
      analyzer’s own rule output rather than page furniture: a report that rendered
      but listed nothing would fail this step. Only the first 2,000 characters of the
      page are read (the driver’s visible-text cap), so the two titles asserted are
      the ones the list reaches early; the third and fourth cards sit past the cap and
      are deliberately not named.
    milestone:
      - dashboard-code-analysis-violations-list
  - driver: web
    expect:
      text:
        matches: ^(?=[\s\S]*Violation Trend)(?=[\s\S]*By Category)(?=[\s\S]*By Severity)(?=[\s\S]*Code Hotspots)[\s\S]*$
    note: >-
      The same report, read for the four analytics the doc names in one breath. Each
      panel is asserted by the heading it renders — never by a number, which moves
      with whatever project is analyzed. `By Category` and `By Severity` are the two
      halves of the doc’s "severity/category analytics"; the other two are their own
      sentence fragments and their own claims.
    milestone:
      - dashboard-code-analysis-severity-category-analytics
      - dashboard-code-analysis-code-hotspots
      - dashboard-code-analysis-trend-over-time
  - driver: web
    click:
      role: button
      name: Security
    expect:
      text:
        matches: ^(?![\s\S]*console\.log call)(?=[\s\S]*Filtered by)(?=[\s\S]*Dynamic code evaluation)[\s\S]*$
    note: >-
      The ACTION, and what the PAGE promises about it: narrowing to one category keeps
      that category’s finding and drops the others. The negative is the load-bearing
      half — `console.log call` is a code-quality finding of the same report, and it
      has to leave the page — and the "Filtered by" chip is the page saying which
      narrowing is in force. What the page cannot say for itself is whether it filtered
      real findings or merely rendered fewer words; the step below asks the app that.
    milestone:
      - dashboard-browses-code-findings
  - request:
      method: GET
      path: /api/repos/sample-app/violations?limit=100
    expect:
      status: 200
      json:
        total:
          equals: 4
        violations[2].ruleKey:
          equals: security/deterministic/eval-usage
        violations[2].severity:
          equals: high
        violations[3].ruleKey:
          equals: code-quality/deterministic/console-log
    note: >-
      The same narrowing, read as DATA rather than as words on a page. The chip filters
      by the finding’s domain — the first segment of its rule key — so the assertion
      that makes the step above falsifiable is that both domains are really in the
      answer: `security/deterministic/eval-usage` is the finding the chip kept, and
      `code-quality/deterministic/console-log` is the one it dropped, still there in
      the set the page filtered. A page that rendered fewer words would pass a text
      match and fail this. Read at the same origin the browser is driving, so it is
      the same run’s state — `limit` is what makes the route answer the
      `{violations,total}` envelope instead of a bare array, which is where the count
      of the whole filtered set lives.
    milestone:
      - dashboard-browses-code-findings
  - driver: web
    click:
      role: button
      name: Code Analysis
    expect:
      visible:
        role: menuitemradio
        name: Spec Guard
    note: >-
      The switcher names the section in view and opens onto the others: one UI, both
      capabilities. Asserted on the OTHER capability being offered from inside the
      code-findings surface, which is what "side by side" comes to in a single-window
      app.
    milestone:
      - dashboard-one-web-ui-for-both-capabilities
  - driver: web
    click:
      role: menuitemradio
      name: Spec Guard
    expect:
      url:
        contains: section=guard
      visible:
        role: button
        name: Coverage
    note: >-
      Picking the other capability reaches it for the SAME repository — the address
      keeps the repo and gains the section, and the drift surfaces are there to browse.
      The rail is asserted through Coverage alone: the doc’s own names for two of the
      others (Scenarios, External APIs) are not what this UI calls them, and those
      claims are recorded as doc-drift candidates rather than smuggled into a green
      step here.
    milestone:
      - dashboard-browses-business-logic-drift
