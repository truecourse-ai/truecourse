guard: 3
id: reject-a-severity-value-the-cli-does-not-define.cli.1
title: A developer filters by every documented severity, then mistypes one
promise: A developer filters by every documented severity, then mistypes one
flow:
  id: reject-a-severity-value-the-cli-does-not-define
  fingerprint: sha256:b05cd78e73905ae286eee3a88b010801c95f40460f1e5f9fcb4c79eb019cf99e
interface:
  path:
    - cli/analyze
    - cli/list
  fingerprints:
    - sha256:66792fe9ce97d69aa7a54ecd634d57f145eebe1d89de01e7f2f4aedc0dc232b8
    - sha256:b7b34908386f2c205afb3ab048ed34ebca96cd05f9ae0622025f613a45c574e8
binds:
  - doc: reference/spec-docs/reference/cli.mdx
    section: list
    fingerprint: sha256:4aa9067c6033329743f1f286961709f254df2d92e7d8ca87fb05be31f0154755
needs:
  - analysis-target
setup:
  env:
    TRUECOURSE_TELEMETRY: '0'
    TRUECOURSE_LLM_TRANSPORT: claude-code
normalize: []
driver: cli
steps:
  - run:
      - analyze
      - '--no-llm'
      - '--no-stash'
      - '--no-skills'
    cwd: .tc-supplied/analysis-target
    expect:
      exit: 0
      files:
        .tc-supplied/analysis-target/.truecourse/LATEST.json:
          exists: true
    note: Plumbing — the listing needs an analysis of the REGISTERED project behind it. Untagged.
  - run:
      - list
      - '--severity'
      - critical,high,medium,low,info
    cwd: .tc-supplied/analysis-target
    expect:
      exit: 0
      stdout:
        matches: '[0-9]+ violations \('
    note: >-
      All five documented values, in one comma-separated list, accepted: the command
      renders a listing — its footer count — instead of refusing. This is the first
      half of a value-set claim.
    milestone:
      - cli-ref-list-severity-accepts-the-five-severities
  - run:
      - list
      - '--severity'
      - nope
    cwd: .tc-supplied/analysis-target
    expect:
      exit: 1
      stderr:
        matches: unknown severity value\(s\)[\s\S]*critical, high, medium, low, info
    note: >-
      The second half, and the one that makes the first mean something: a value
      outside the documented set is refused, naming the set. Without it, "accepts the
      five" would be satisfied by a command that accepts anything at all.
    milestone:
      - cli-ref-list-severity-accepts-the-five-severities
