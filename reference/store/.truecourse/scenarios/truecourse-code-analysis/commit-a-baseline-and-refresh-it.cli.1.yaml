guard: 3
id: commit-a-baseline-and-refresh-it.cli.1
title: A team commits the analysis baseline so it travels with the repository
promise: A team commits the analysis baseline so it travels with the repository
flow:
  id: commit-a-baseline-and-refresh-it
  fingerprint: sha256:89e62a3de6d00e4a30c676b3c7e2693ce27a62a5e29cb55d8541e46edf69f355
journey:
  path:
    - cli/analyze
  fingerprints:
    - sha256:66792fe9ce97d69aa7a54ecd634d57f145eebe1d89de01e7f2f4aedc0dc232b8
binds:
  - doc: reference/spec-docs/analyze/baseline-and-diff.mdx
    section: baselines-diff
    fingerprint: sha256:e49543c814a36d09ff9ed323a2d12269d7371ebae20ebd392381c9374a5cbd4e
  - doc: reference/spec-docs/analyze/baseline-and-diff.mdx
    section: setting-the-baseline
    fingerprint: sha256:6b02d8b471badb53ef05949c6e5c093094b9ffc671d09d9fb02f10ce75a24c8e
setup:
  files:
    package.json: |
      {
        "name": "baseline-sample",
        "version": "1.0.0",
        "type": "module"
      }
    src/index.js: |
      export function main(input) {
        console.log('starting')
        return input
      }
  env:
    TRUECOURSE_TELEMETRY: '0'
  git:
    branch: main
    identity:
      name: TrueCourse Reference
      email: reference@truecourse.test
    commits:
      - files:
          - package.json
          - src/index.js
        message: seed baseline sample
normalize: []
driver: cli
steps:
  - run:
      - analyze
      - '--no-llm'
      - '--no-skills'
    expect:
      exit: 0
      files:
        .truecourse/.gitignore:
          exists: true
  - git:
      - check-ignore
      - .truecourse/LATEST.json
      - .truecourse/config.json
      - .truecourse/hooks.yaml
    expect:
      exit: 1
      stdout:
        equals: ''
    note: check-ignore exits 1 when NONE of the given paths is ignored — the falsifiable form of "these three are committable". `hooks.yaml` is checked as a path; it need not exist yet, and its creation is the hook flow's claim.
    milestone:
      - three-files-are-committable
  - git:
      - check-ignore
      - .truecourse/analyses
      - .truecourse/diff.json
      - .truecourse/history.json
      - .truecourse/ui-state.json
      - .truecourse/logs
      - .truecourse/.analyze.lock
    expect:
      exit: 0
      stdout:
        matches: ^(?=[\s\S]*analyses)(?=[\s\S]*diff\.json)(?=[\s\S]*history\.json)(?=[\s\S]*ui-state\.json)(?=[\s\S]*logs)(?=[\s\S]*\.analyze\.lock)[\s\S]*$
    note: check-ignore echoes each path it matched, so the six local-only entries are asserted individually rather than by trusting one exit code. Nobody wrote this .gitignore by hand — analyze seeded it.
    milestone:
      - local-only-files-gitignored-automatically
  - git:
      - add
      - .truecourse/LATEST.json
      - .truecourse/config.json
    expect:
      exit: 0
  - git:
      - status
      - '--porcelain'
    expect:
      exit: 0
      stdout:
        matches: ^(?=[\s\S]*A[ ]+\.truecourse/LATEST\.json)(?=[\s\S]*A[ ]+\.truecourse/config\.json)[\s\S]*$
    note: The documented command sequence, verbatim from the doc, with both files staged.
    milestone:
      - baseline-files-exist-and-are-stageable-after-analyze
  - git:
      - commit
      - '-m'
      - add truecourse baseline
    expect:
      exit: 0
  - write:
      src/unsafe.js: |
        export function runRule(source) {
          return eval(source)
        }
    expect:
      files:
        src/unsafe.js:
          exists: true
  - run:
      - analyze
      - '--no-llm'
      - '--no-stash'
      - '--no-skills'
    expect:
      exit: 0
      files:
        .truecourse/LATEST.json:
          contains: Dynamic code evaluation
    note: >-
      The snapshot committed a moment ago did not contain this finding; the
      re-run rewrote LATEST.json, which is what "commit the updated LATEST.json
      to refresh the baseline" depends on. `--no-stash` keeps the new file in the
      tree — the stash decision itself belongs to the dirty-tree flow.


      THIS STEP IS RED ON A PRODUCT BUG, verified 2026-08-10 by reproducing the
      exact sequence outside the harness three times in a plain temp repo (git
      init, seed the two files, commit, `analyze --no-llm --no-skills`, `git add
      .truecourse/LATEST.json .truecourse/config.json`, `git commit`, write an
      `eval()` file, `analyze --no-llm --no-stash --no-skills`): the refreshed
      LATEST.json never names "Dynamic code evaluation", and the analyze log
      reads `Code scan: 0 violations from 2 files` — the two files it scanned
      being `.truecourse/LATEST.json` and `.truecourse/config.json`, not any
      source file. Refreshing the baseline is what breaks it: the SAME command
      run once more (a third analyze, when HEAD no longer moved past the
      baseline commit) finds the eval and reports 4 violations. Root cause:
      `packages/core/src/commands/analyze-core.ts` derives a full-mode
      `changedFileSet` from `git diff <baseline commit>..HEAD --name-only` and
      hands it to the violation pipeline, which scans ONLY those paths
      (`filesToScan` in `violation-pipeline.service.ts`). Committing the
      baseline moves HEAD past the analysis it came from, so the next `analyze`
      rule-scans just the committed `.truecourse/*.json` — the working tree's
      new and modified source files are parsed into the graph (the run reports
      `analyzedFiles: 2` and `src/unsafe.js` appears as a module) but no rule
      ever runs on them, and every prior violation is carried forward
      unverified as `unchanged`. The optimization is documented in that file as
      a way "to cut LLM scan cost", yet it also silences the deterministic
      scan, and it consults commit history only — never the working tree — so
      an uncommitted change is invisible to it. baseline-and-diff.mdx promises
      the refresh ("re-run `truecourse analyze` after merging to `main` and
      commit the updated `LATEST.json`") and `--no-stash` promises "analyze the
      working tree as-is"; the engine delivers neither on the run that follows
      a baseline commit. Fixing the scenario would require asserting that a
      refreshed baseline may silently omit findings, which is the opposite of
      the promise, so this stays red.
    milestone:
      - rerun-analyze-updates-latest-json