guard: 3
id: manage-the-pre-commit-hook-through-the-documented-subcommands.cli.1
title: A developer installs the pre-commit hook, runs its checks, and removes it again
promise: A developer installs the pre-commit hook, runs its checks, and removes it again
flow:
  id: manage-the-pre-commit-hook-through-the-documented-subcommands
  fingerprint: sha256:a925a6b5233f47e998584461f33f40996f2689d517b69614126dcfe6a77e0f2c
interface:
  path:
    - cli/hooks-status
    - cli/analyze
    - cli/hooks-install
    - cli/hooks-run
    - cli/hooks-uninstall
  fingerprints:
    - sha256:cc07593d0bfb9c5bbe9fb290c2fe3ad39979bb48946f7dc2034429b66a7b00da
    - sha256:66792fe9ce97d69aa7a54ecd634d57f145eebe1d89de01e7f2f4aedc0dc232b8
    - sha256:1038639e4b6df928f00ecbcf7f8ddcecf6a249c62ae109d2838192aa506ac539
    - sha256:b588e83bab443372b0ba3f2f77974bc664ae84b16026f111fa676a553eb29423
    - sha256:230a4c0926ff198d87f7fd78a0824ed00f5d215073079e0bc54f500faafd8704
binds:
  - doc: reference/spec-docs/reference/cli.mdx
    section: hooks
    fingerprint: sha256:18fb0de96dcd7404b8ab705632f9d4a7f05ff94570b971cc7774c97382217b3c
setup:
  files:
    package.json: |
      {
        "name": "hooks-sample",
        "version": "1.0.0",
        "type": "module"
      }
    src/index.js: |
      export function main(input) {
        return input
      }
  env:
    TRUECOURSE_TELEMETRY: '0'
    TRUECOURSE_LLM_TRANSPORT: claude-code
  git:
    branch: main
    identity:
      name: TrueCourse Reference
      email: reference@truecourse.test
    commits:
      - files:
          - package.json
          - src/index.js
        message: seed hooks sample
normalize: []
steps:
  - run:
      - hooks
      - status
    expect:
      exit: 0
      stdout:
        matches: 'hook: not installed'
      files:
        .git/hooks/pre-commit:
          absent: true
    note: >-
      The inspection, in the state where there is nothing to inspect. Asserted
      alongside the hook file itself, so the report is checked against the world
      rather than trusted.
    milestone:
      - cli-ref-hooks-status-inspects-the-precommit-hook
  - run:
      - analyze
      - '--no-llm'
      - '--no-skills'
    expect:
      exit: 0
      files:
        .truecourse/LATEST.json:
          exists: true
    note: Plumbing — the hook's checks diff against an analysis baseline, so one is produced first.
  - run:
      - hooks
      - install
    stdin:
      - marker: 'Install the pre-commit hook?'
        answer: 'y'
    tty: true
    expect:
      exit: 0
      files:
        .git/hooks/pre-commit:
          exists: true
        .truecourse/hooks.yaml:
          exists: true
    note: >-
      Installation warns and asks first, so it runs on a pseudo-terminal. The two
      files it leaves behind — the git hook and its policy file — are the claim; the
      confirmation message is not.
    milestone:
      - cli-ref-hooks-install-installs-the-precommit-hook
  - run:
      - hooks
      - status
    expect:
      exit: 0
      stdout:
        matches: 'hook: installed'
    note: >-
      The same inspection, the other state. A status command that always answered the
      same way would pass one of these two reads and fail the other.
    milestone:
      - cli-ref-hooks-status-inspects-the-precommit-hook
  - write:
      src/notes.js: |
        export function notes(rows) {
          console.log('notes', rows.length)
          return rows
        }
    expect:
      files:
        src/notes.js:
          exists: true
    note: Prepares the next step — the checks only inspect STAGED content, so there has to be some.
  - git:
      - add
      - src/notes.js
    expect:
      exit: 0
  - run:
      - hooks
      - run
    expect:
      exit: 0
      stdout:
        matches: '^(?=[\s\S]*TrueCourse pre-commit check)(?=[\s\S]*running analysis)(?=[\s\S]*passed \([1-9][0-9]* new violations, none at or above critical/high\))[\s\S]*$'
    note: >-
      The checks the installed hook itself invokes, run directly — over a staged
      change, which is the only state in which they run at all. With nothing staged
      the command short-circuits to "passed (no staged files)" without reading the
      policy, diffing anything, or touching the baseline, so an exit code taken there
      is a green that proves nothing (that is exactly what this step asserted before,
      and it would have passed against a command whose checks were entirely broken).
      Here the assertion is the real outcome: the check ran the analysis, counted the
      violations the staged change introduces, and compared them against the policy's
      block-on set.
    milestone:
      - cli-ref-hooks-run-runs-the-precommit-checks
  - run:
      - hooks
      - uninstall
    expect:
      exit: 0
      files:
        .git/hooks/pre-commit:
          absent: true
    note: The hook file is gone, which is what removal means to git.
    milestone:
      - cli-ref-hooks-uninstall-removes-the-precommit-hook