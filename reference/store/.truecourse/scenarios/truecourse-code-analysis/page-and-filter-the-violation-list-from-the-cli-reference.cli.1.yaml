guard: 3
id: page-and-filter-the-violation-list-from-the-cli-reference.cli.1
title: A developer analyzes a repository and pages, windows and filters the violation list
promise: A developer analyzes a repository and pages, windows and filters the violation list
flow:
  id: page-and-filter-the-violation-list-from-the-cli-reference
  fingerprint: sha256:5dd990547e853427bc447578a8cdb043a8ae85b3cddcd361896bb1411feb315e
journey:
  path:
    - cli/analyze
    - cli/list
  fingerprints:
    - sha256:66792fe9ce97d69aa7a54ecd634d57f145eebe1d89de01e7f2f4aedc0dc232b8
    - sha256:b7b34908386f2c205afb3ab048ed34ebca96cd05f9ae0622025f613a45c574e8
binds:
  - doc: reference/spec-docs/reference/cli.mdx
    section: analyze
    fingerprint: sha256:432df8a8c3e5e2bff86bf632f5a0f699b70cecc843f54766e1f5256b08875708
  - doc: reference/spec-docs/reference/cli.mdx
    section: list
    fingerprint: sha256:4aa9067c6033329743f1f286961709f254df2d92e7d8ca87fb05be31f0154755
setup:
  files:
    package.json: |
      {
        "name": "paging-sample",
        "version": "1.0.0",
        "type": "module"
      }
    src/a.js: |
      export function a(rows) {
        console.log('a1', rows)
        console.log('a2', rows)
        console.log('a3', rows)
        console.log('a4', rows)
        console.log('a5', rows)
        return rows
      }
    src/b.js: |
      export function b(rows) {
        console.log('b1', rows)
        console.log('b2', rows)
        console.log('b3', rows)
        console.log('b4', rows)
        console.log('b5', rows)
        return rows
      }
    src/c.js: |
      export function c(rows) {
        console.log('c1', rows)
        console.log('c2', rows)
        console.log('c3', rows)
        console.log('c4', rows)
        console.log('c5', rows)
        return rows
      }
    src/d.js: |
      export function d(rows) {
        console.log('d1', rows)
        console.log('d2', rows)
        console.log('d3', rows)
        console.log('d4', rows)
        console.log('d5', rows)
        return rows
      }
    src/e.js: |
      export function e(rows) {
        console.log('e1', rows)
        console.log('e2', rows)
        console.log('e3', rows)
        console.log('e4', rows)
        console.log('e5', rows)
        return rows
      }
    src/unsafe.js: |
      export function runRule(source) {
        return eval(source)
      }
  env:
    TRUECOURSE_TELEMETRY: '0'
    TRUECOURSE_LLM_TRANSPORT: claude-code
  git:
    branch: main
    identity:
      name: TrueCourse Reference
      email: reference@truecourse.test
    commits:
      - files:
          - package.json
          - src/a.js
          - src/b.js
          - src/c.js
          - src/d.js
          - src/e.js
          - src/unsafe.js
        message: seed paging sample
normalize: []
driver: cli
steps:
  - run:
      - analyze
      - '--no-llm'
      - '--no-skills'
    expect:
      exit: 0
      stdout:
        matches: ^(?![\s\S]*LLM)[\s\S]*$
      files:
        .truecourse/LATEST.json:
          exists: true
    note: >-
      Two claims on one run. That the current repository was analyzed is the snapshot
      the run wrote; that `--no-llm` skipped the LLM rules is the absence of the LLM
      stage from the run's own report — an `--llm` run announces how many files and
      rules it will send, and this one says nothing about the LLM at all.
    milestone:
      - cli-ref-analyze-analyzes-the-current-repository
      - cli-ref-analyze-no-llm-skips-llm-rules-for-this-run
  - run:
      - list
    expect:
      exit: 0
      stdout:
        matches: Showing 1.20 of [0-9]+ violations
    note: >-
      The listing renders the analysis, and its window is twenty wide with no flag
      passed — the default the doc states. The footer states the window in numbers,
      which is the meaning; the rendered rows are the rendering. The `.` in `1.20`
      stands in for the en dash the renderer prints.
    milestone:
      - cli-ref-list-lists-violations-from-the-latest-analysis
      - cli-ref-list-pagination-defaults-to-20
  - run:
      - list
      - '--limit'
      - '2'
    expect:
      exit: 0
      stdout:
        matches: Showing 1.2 of [0-9]+ violations
    note: The same set, a two-wide window starting at the first violation.
    milestone:
      - cli-ref-list-limit-sets-the-page-size
  - run:
      - list
      - '--limit'
      - '2'
      - '--offset'
      - '2'
    expect:
      exit: 0
      stdout:
        matches: Showing 3.4 of [0-9]+ violations
    note: >-
      The same two-wide window, moved past the first two violations — which is what
      "skips the first n" means, and it is only observable against the previous step.
    milestone:
      - cli-ref-list-offset-skips-earlier-violations
  - run:
      - list
      - '--all'
    expect:
      exit: 0
      stdout:
        matches: ^(?![\s\S]*Showing )(?![\s\S]*Next page)(?=[\s\S]*[0-9]+ violations \()[\s\S]*$
    note: >-
      No window and no next-page pointer, but still a violation count: the footer
      switches to its whole-set form, which is how the renderer says "this is all of
      them".
    milestone:
      - cli-ref-list-all-shows-every-violation
  - run:
      - list
      - '--severity'
      - high,critical
    expect:
      exit: 0
      stdout:
        matches: ^(?![\s\S]*LOW)(?![\s\S]*MEDIUM)(?=[\s\S]*HIGH)[\s\S]*$
    note: >-
      Every printed row carries a requested severity: the 25 low findings that
      dominate the unfiltered listing are gone and the high one remains.
    milestone:
      - cli-ref-list-severity-filters-by-a-comma-separated-list
