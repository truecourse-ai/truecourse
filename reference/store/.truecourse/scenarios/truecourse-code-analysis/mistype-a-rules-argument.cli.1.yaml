guard: 3
id: mistype-a-rules-argument.cli.1
title: A developer runs the two `rules` commands that require a rule key, without one
promise: A developer runs the two `rules` commands that require a rule key, without one
flow:
  id: mistype-a-rules-argument
  fingerprint: sha256:ab558c09b56d75c09701cb86991cefde4eff55b655f736fa059d677cd79fcd4a
journey:
  path:
    - cli/rules
    - cli/root
  fingerprints:
    - sha256:a1cb5505112364f829d0346050d74816873fbd3f73c3eedb7730015c7d1f4008
    - sha256:816d25a9ace7be600d9664a00ede4f1e461c89530d18667feb5f35be022e3757
binds:
  - doc: reference/spec-docs/reference/cli.mdx
    section: rules
    fingerprint: sha256:3db6a25efb8692740c901c8d12d5b78a7bef67efe18ab0bf1cc7dd1b5c1d339f
setup:
  files:
    package.json: |
      {
        "name": "mistype-sample",
        "version": "1.0.0",
        "type": "module"
      }
    src/index.js: |
      export function main(input) {
        return input
      }
  env:
    TRUECOURSE_TELEMETRY: '0'
    TRUECOURSE_LLM_TRANSPORT: claude-code
normalize: []
driver: cli
steps:
  - run:
      - add
      - '--no-skills'
    expect:
      exit: 0
      files:
        .truecourse/.gitignore:
          exists: true
    note: >-
      Plumbing — a registered repository, so that every refusal below is about the
      argument the developer got wrong and not about a missing project.
  - run:
      - rules
      - enable
    expect:
      exit: 1
      stderr:
        contains: missing required argument 'ruleKey'
      files:
        .truecourse/config.json:
          absent: true
    note: >-
      The doc writes `rules enable <ruleKey>` — required, in contrast with
      `rules reset [ruleKey]` on the row below it. Requiredness is only falsifiable
      through the missing-argument path, and the refusal must also leave the
      repository's rule configuration untouched.
    milestone:
      - cli-ref-rules-enable-requires-a-rule-key
  - run:
      - rules
      - disable
    expect:
      exit: 1
      stderr:
        contains: missing required argument 'ruleKey'
      files:
        .truecourse/config.json:
          absent: true
    note: The same requiredness on the other half of the same documented row.
    milestone:
      - cli-ref-rules-disable-requires-a-rule-key