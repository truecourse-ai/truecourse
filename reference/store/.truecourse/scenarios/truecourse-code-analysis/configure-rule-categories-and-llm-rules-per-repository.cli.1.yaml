guard: 3
id: configure-rule-categories-and-llm-rules-per-repository.cli.1
title: A developer registers a repository and sets its rule policy
promise: A developer registers a repository and sets its rule policy
flow:
  id: configure-rule-categories-and-llm-rules-per-repository
  fingerprint: sha256:23dc06eaa958ea9152851c16f4763ca4648ca24dc23f538a04c1dc6fa1b5b0a5
journey:
  path:
    - cli/add
    - cli/rules
    - cli/analyze
    - cli/list
  fingerprints:
    - sha256:61d9dd0c58f542195f6305faa593fc5ee2fc8de203fac212df3c86d442beb0a4
    - sha256:a1cb5505112364f829d0346050d74816873fbd3f73c3eedb7730015c7d1f4008
    - sha256:66792fe9ce97d69aa7a54ecd634d57f145eebe1d89de01e7f2f4aedc0dc232b8
    - sha256:b7b34908386f2c205afb3ab048ed34ebca96cd05f9ae0622025f613a45c574e8
binds:
  - doc: reference/spec-docs/analyze/overview.mdx
    section: commands
    fingerprint: sha256:9b82a730b41a72e6e00cc47eaf3a26930b06548e0496be87a19843f7b3c73ede
  - doc: reference/spec-docs/analyze/rules.mdx
    section: categories
    fingerprint: sha256:b080ec80f259542368c63a62117a942a2a582842a524766a50ab1f4ae2b17a3e
  - doc: reference/spec-docs/analyze/overview.mdx
    section: what-it-catches
    fingerprint: sha256:6ca33dd8428dd3bf4098933ba88aa1dfb5f75ce20449bad634c7283985a5a4e0
  - doc: reference/spec-docs/analyze/rules.mdx
    section: rules
    fingerprint: sha256:e839886eafd05ebdce44454b407f45845dcfcd58c52d49e821cc77f2def8399b
  - doc: reference/spec-docs/analyze/overview.mdx
    section: rule-coverage
    fingerprint: sha256:e2ac33a1d0da9236cf914ab67ae65a25c2702a0b033828a750b416c44d61f89f
  - doc: reference/spec-docs/analyze/rules.mdx
    section: llm-powered-rules
    fingerprint: sha256:301491495084c720f3e0cd60ed343e7522ddb3d7203f98bdb1fd3b6909d6abaf
  - doc: reference/spec-docs/analyze/baseline-and-diff.mdx
    section: baselines-diff
    fingerprint: sha256:e49543c814a36d09ff9ed323a2d12269d7371ebae20ebd392381c9374a5cbd4e
setup:
  files:
    package.json: |
      {
        "name": "policy-sample",
        "version": "1.0.0",
        "type": "module"
      }
    src/legacy.py: |
      def processData(rows):
          return [r for r in rows if r]
    src/index.js: |
      export function main(input) {
        console.log('starting')
        return input
      }
    other-repo/package.json: |
      {
        "name": "other-sample",
        "version": "1.0.0",
        "type": "module"
      }
    other-repo/src/index.js: |
      export function main(input) {
        return input
      }
  env:
    TRUECOURSE_TELEMETRY: '0'
  git:
    branch: main
    identity:
      name: TrueCourse Reference
      email: reference@truecourse.test
    commits:
      - files:
          - package.json
          - src/legacy.py
          - src/index.js
        message: seed policy sample
normalize: []
driver: cli
steps:
  - run:
      - rules
      - categories
    expect:
      exit: 1
      stderr:
        contains: No TrueCourse project found here
    cwd: other-repo
  - run:
      - add
      - '--no-skills'
    expect:
      exit: 0
      stdout:
        matches: added|already registered
      files:
        .truecourse:
          exists: true
        .truecourse/LATEST.json:
          absent: true
    note: Registered — the store exists — while no analysis snapshot was written.
    milestone:
      - add-registers-repo-without-analyzing
  - run:
      - rules
      - categories
    expect:
      exit: 0
      stdout:
        matches: ^(?=[\s\S]*security)(?=[\s\S]*bugs)(?=[\s\S]*architecture)(?=[\s\S]*performance)(?=[\s\S]*reliability)(?=[\s\S]*code-quality)(?=[\s\S]*database)(?=[\s\S]*style[^\n]*enabled)[\s\S]*$
    note: 'All eight categories with a state each. It also ESTABLISHES the starting point the style claim needs: with no per-repo override, style is enabled.'
    milestone:
      - rules-categories-shows-enabled-disabled
  - run:
      - analyze
      - '--no-llm'
      - '--no-skills'
    expect:
      exit: 0
  - run:
      - list
      - '--limit'
      - '200'
    expect:
      exit: 0
      stdout:
        contains: Function in camelCase
    note: The doc's own Style example — a naming convention — reported against the seeded Python function.
    milestone:
      - catches-style-violations
  - run:
      - rules
      - categories
      - '--disable'
      - style
    expect:
      exit: 0
      stdout:
        matches: Disabled style
      files:
        .truecourse/config.json:
          contains: '"enabledCategories"'
    milestone:
      - rules-categories-disable
      - rule-configuration-stored-in-config-json
  - run:
      - rules
      - categories
    expect:
      exit: 0
      stdout:
        matches: style[^\n]*disabled
  - run:
      - analyze
      - '--no-llm'
      - '--no-skills'
    expect:
      exit: 0
  - run:
      - list
      - '--limit'
      - '200'
    expect:
      exit: 0
      stdout:
        matches: ^(?![\s\S]*Function in camelCase)(?=[\s\S]*violations \()[\s\S]*$
    note: 'The toggle is not cosmetic: the next analysis produced no Style findings while still producing others. The claim''s other half — the LLM kind — is exercised by the `rules llm` steps below in this same repository.'
    milestone:
      - rule-kinds-toggleable-per-repository
  - run:
      - rules
      - categories
      - '--enable'
      - style
    expect:
      exit: 0
      stdout:
        matches: Enabled style
    milestone:
      - rules-categories-enable
  - run:
      - rules
      - categories
      - '--reset'
    expect:
      exit: 0
      stdout:
        matches: Reset to global default
    milestone:
      - rules-categories-reset
  - run:
      - rules
      - categories
    expect:
      exit: 0
      stdout:
        contains: 'Override with:'
    note: The hint only prints when NO per-repo override exists, so its return is the observable difference between "reset" and "set to the default values".
  - run:
      - rules
      - llm
    expect:
      exit: 0
      stdout:
        matches: LLM rules for[^\n]*(enabled|disabled)
    milestone:
      - rules-llm-shows-status
  - run:
      - rules
      - llm
      - '--disable'
    expect:
      exit: 0
      stdout:
        matches: LLM rules disabled
      files:
        .truecourse/config.json:
          contains: '"enableLlmRules"'
    note: 'config.json now carries both halves the baseline doc names: the category override written earlier in this scenario and the LLM toggle written here.'
    milestone:
      - rules-llm-disable
      - config-json-holds-categories-and-llm-toggles
  - run:
      - add
      - '--no-skills'
    expect:
      exit: 0
    cwd: other-repo
  - run:
      - rules
      - llm
    expect:
      exit: 0
      stdout:
        matches: global default[^\n]*enabled
    cwd: other-repo
    note: The first repository is sitting on an explicit `disabled` override at this exact moment; the second reports the untouched global default. Two repositories, two policies.
    milestone:
      - rule-configuration-is-per-repository
  - run:
      - rules
      - llm
      - '--enable'
    expect:
      exit: 0
      stdout:
        matches: LLM rules enabled
    milestone:
      - rules-llm-enable
