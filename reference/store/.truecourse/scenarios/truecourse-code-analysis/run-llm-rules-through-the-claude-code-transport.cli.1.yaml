guard: 3
id: run-llm-rules-through-the-claude-code-transport.cli.1
title: A developer runs the LLM rules over a real project through Claude Code
promise: A developer runs the LLM rules over a real project through Claude Code
flow:
  id: run-llm-rules-through-the-claude-code-transport
  fingerprint: sha256:84bbd4a60627ed3407800528ac08e78bb3d5df72cc092348dbd463554a0a7733
interface:
  path:
    - cli/analyze
  fingerprints:
    - sha256:66792fe9ce97d69aa7a54ecd634d57f145eebe1d89de01e7f2f4aedc0dc232b8
binds:
  - doc: reference/spec-docs/analyze/overview.mdx
    section: commands
    fingerprint: sha256:9b82a730b41a72e6e00cc47eaf3a26930b06548e0496be87a19843f7b3c73ede
  - doc: reference/spec-docs/analyze/overview.mdx
    section: rule-coverage
    fingerprint: sha256:e2ac33a1d0da9236cf914ab67ae65a25c2702a0b033828a750b416c44d61f89f
needs:
  - claude-login
  - analysis-target
setup:
  env:
    TRUECOURSE_TELEMETRY: '0'
normalize: []
steps:
  - run:
      - analyze
      - '--no-llm'
      - '--no-stash'
      - '--no-skills'
    cwd: .tc-supplied/analysis-target
    expect:
      exit: 0
      stdout:
        matches: ^(?![\s\S]*LLM will analyze)(?=[\s\S]*violations \()[\s\S]*$
    note: >-
      The deterministic baseline over the REGISTERED project, and the paired
      observation the next step's `LLM will analyze N files` is read against: this run
      announced no LLM work at all.
  - run:
      - analyze
      - '--llm'
      - '--llm-transport'
      - cli
      - '--no-stash'
      - '--no-skills'
    cwd: .tc-supplied/analysis-target
    timeoutMs: 1800000
    expect:
      exit: 0
      stdout:
        matches: ^(?![\s\S]*Run LLM-powered rules\?)(?=[\s\S]*LLM will analyze [1-9][0-9]* files?)(?=[\s\S]*violations \()[\s\S]*$
    note: Three sub-assertions on one command, all structural, none content-exact. "LLM will analyze N files with M rules" with N ≥ 1 is the public evidence that source code went to the configured transport AND that the LLM rules ran alongside the deterministic scan; the absent confirm prompt is the pre-approval. The model's findings are never asserted — they are not deterministic, and the claims do not require them to be.
    milestone:
      - analyze-llm-runs-llm-rules
      - analyze-llm-preapproves-cost-estimate
      - llm-rules-send-source-to-configured-llm