guard: 3
id: analyze-a-repository-for-the-first-time.cli.1
title: A developer analyzes a repository for the first time and reads the report
promise: A developer analyzes a repository for the first time and reads the report
flow:
  id: analyze-a-repository-for-the-first-time
  fingerprint: sha256:a2b7d79671fb6dea0fa66edebdb7bfa6bc800475c8820bf32b541f9072bdbd9a
journey:
  path:
    - cli/analyze
    - cli/list
  fingerprints:
    - sha256:66792fe9ce97d69aa7a54ecd634d57f145eebe1d89de01e7f2f4aedc0dc232b8
    - sha256:b7b34908386f2c205afb3ab048ed34ebca96cd05f9ae0622025f613a45c574e8
binds:
  - doc: reference/spec-docs/analyze/baseline-and-diff.mdx
    section: baselines-diff
    fingerprint: sha256:e49543c814a36d09ff9ed323a2d12269d7371ebae20ebd392381c9374a5cbd4e
  - doc: reference/spec-docs/analyze/overview.mdx
    section: overview
    fingerprint: sha256:a190d81681a869fb10582940aa88c9fa6324f2f1d62979cbc383cbf014ac1f51
  - doc: reference/spec-docs/analyze/overview.mdx
    section: rule-coverage
    fingerprint: sha256:e2ac33a1d0da9236cf914ab67ae65a25c2702a0b033828a750b416c44d61f89f
  - doc: reference/spec-docs/analyze/overview.mdx
    section: commands
    fingerprint: sha256:9b82a730b41a72e6e00cc47eaf3a26930b06548e0496be87a19843f7b3c73ede
  - doc: reference/spec-docs/analyze/overview.mdx
    section: language-support
    fingerprint: sha256:ce4418cd98a71103c8434e29537bc6310a2c117c769c9926e6e12dbc824fba3c
  - doc: reference/spec-docs/analyze/overview.mdx
    section: what-it-catches
    fingerprint: sha256:6ca33dd8428dd3bf4098933ba88aa1dfb5f75ce20449bad634c7283985a5a4e0
setup:
  files:
    package.json: |
      {
        "name": "sample-app",
        "version": "1.0.0",
        "type": "module"
      }
    src/index.js: |
      import { render } from './render.js'

      export function main(input) {
        console.log('starting')
        return render(input)
      }
    src/render.js: |
      import { format } from './format.js'

      export function renderVersion() {
        return 1
      }

      export function render(input) {
        return format(input)
      }
    src/format.js: |
      import { renderVersion } from './render.js'

      export function format(input) {
        return `${input} v${renderVersion()}`
      }
    src/unsafe.js: |
      export function runRule(source) {
        return eval(source)
      }
    src/db.js: |
      export async function listUsers(db) {
        return db.query('SELECT * FROM users')
      }
    src/parse.js: |
      export function parseConfig(text) {
        return JSON.parse(text)
      }
    src/scan.js: |
      export function scan(lines, patterns) {
        const hits = []
        for (const pattern of patterns) {
          const re = new RegExp(pattern)
          for (const line of lines) {
            if (re.test(line)) hits.push(line)
          }
        }
        return hits
      }
    src/collect.py: |
      def collect(items=[]):
          items.append(1)
          return items
  env:
    TRUECOURSE_TELEMETRY: '0'
  git:
    branch: main
    identity:
      name: TrueCourse Reference
      email: reference@truecourse.test
    commits:
      - files:
          - package.json
          - src/index.js
          - src/render.js
          - src/format.js
          - src/unsafe.js
          - src/db.js
          - src/parse.js
          - src/scan.js
          - src/collect.py
        message: seed sample app
normalize: []
driver: cli
steps:
  - run:
      - list
    expect:
      exit: 1
      stdout:
        contains: No TrueCourse project found here
      files:
        .truecourse/LATEST.json:
          absent: true
    note: 'The message is a clack `p.log.error`, which writes to STDOUT — the journey contract said stderr and was wrong (fixed there, with a diagnostic). The severity-value error on the same command really is a bare `console.error` on stderr; the two are not the same channel.'
  - run:
      - analyze
      - '--no-llm'
      - '--no-skills'
    expect:
      exit: 0
      stdout:
        matches: ^(?![\s\S]*LLM will analyze)(?=[\s\S]*violations \()[\s\S]*$
      files:
        .truecourse:
          exists: true
        .truecourse/analyses:
          exists: true
        .truecourse/LATEST.json:
          contains: '"violations"'
        .truecourse/history.json:
          exists: true
    note: 'One command, seven contracts: the store is created, the results are JSON under `.truecourse/`, LATEST.json is this run''s snapshot, no dashboard or other process was started first, and the deterministic-only run planned no LLM call and printed no cost. The store is asserted as what it is — the `.truecourse/` directory, and the `analyses/` directory the per-run snapshot lands in, which is the one thing here no assertion can name (`<iso>_<8-hex>.json`).'
    milestone:
      - first-analyze-creates-dot-truecourse-dir
      - analyze-runs-static-and-llm-analysis
      - analyze-runs-full-analysis-in-process
      - analyze-stores-results-as-json-under-dot-truecourse
      - latest-json-is-most-recent-snapshot
      - deterministic-rules-make-no-api-calls
      - analyze-no-llm-skips-llm-rules
  - run:
      - list
      - '--limit'
      - '200'
    expect:
      exit: 0
      stdout:
        matches: ^(?=[\s\S]*console\.log call)(?=[\s\S]*Circular module dependency)(?=[\s\S]*Regex created inside loop)(?=[\s\S]*Unsafe JSON\.parse)(?=[\s\S]*SELECT \* in production code)[\s\S]*$
      files:
        .truecourse/LATEST.json:
          contains: src/index.js
    note: Each title is the finding of one seeded example the doc names for its category (console.log, an import cycle, a regex built in a loop, a bare JSON.parse, `SELECT *`). `--limit 200` only defeats pagination; the pagination contract itself belongs to the list-filter flow.
    milestone:
      - list-shows-violations-from-latest-analysis
      - supports-javascript-typescript
      - catches-code-quality-violations
      - catches-architecture-violations
      - catches-performance-violations
      - catches-reliability-violations
      - catches-database-violations
  - run:
      - list
      - '--severity'
      - critical,high
    expect:
      exit: 0
      stdout:
        matches: ^(?=[\s\S]*Dynamic code evaluation)(?=[\s\S]*Mutable default argument)[\s\S]*$
      files:
        .truecourse/LATEST.json:
          contains: src/collect.py
    note: The high-severity slice of the same report. "Mutable default argument" is a Python-only rule, so its presence — corroborated by the .py path in the snapshot — is what proves Python was analyzed.
    milestone:
      - catches-security-violations
      - catches-bug-violations
      - supports-python
  - run:
      - analyze
      - '--no-skills'
    expect:
      exit: 1
  - run:
      - analyze
      - '--llm'
      - '--no-skills'
    expect:
      exit: 1
      stdout:
        matches: (transport|claude|API key|config llm setup)
    note: No transport is saved in the sandbox HOME and `TRUECOURSE_LLM_TRANSPORT` is unset, so asking for LLM rules cannot produce LLM results. The docs state the requirement but not the failure mode, so the assertion stays at "the run does not proceed, and says why" rather than pinning one message.
    milestone:
      - llm-rules-require-an-llm-transport
