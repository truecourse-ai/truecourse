id: analyze-a-dirty-tree-with-the-documented-stash-flags
title: 'A developer analyzes a dirty tree both ways: as-is, and with the pending change stashed'
promise: 'A developer analyzes a dirty tree both ways: as-is, and with the pending change stashed'
flow:
  id: analyze-a-dirty-tree-with-the-documented-stash-flags
  fingerprint: sha256:67697289aea282b9fd5e5ffaf439979d12ef603bbc9d68f46e9737cbd0f1b446
interface:
  path:
    - cli/analyze
    - cli/list
  fingerprints:
    - sha256:66792fe9ce97d69aa7a54ecd634d57f145eebe1d89de01e7f2f4aedc0dc232b8
    - sha256:b7b34908386f2c205afb3ab048ed34ebca96cd05f9ae0622025f613a45c574e8
binds:
  - doc: reference/spec-docs/reference/cli.mdx
    section: analyze
    fingerprint: sha256:432df8a8c3e5e2bff86bf632f5a0f699b70cecc843f54766e1f5256b08875708
setup:
  files:
    package.json: |
      {
        "name": "stash-sample",
        "version": "1.0.0",
        "type": "module"
      }
    src/index.js: |
      export function main(rows) {
        return rows
      }
  env:
    TRUECOURSE_TELEMETRY: '0'
    TRUECOURSE_LLM_TRANSPORT: claude-code
  git:
    branch: main
    identity:
      name: TrueCourse Reference
      email: reference@truecourse.test
    commits:
      - files:
          - package.json
          - src/index.js
        message: seed stash sample
normalize: []
steps:
  - write:
      src/index.js: |
        export function main(rows) {
          return eval(rows)
        }
    expect:
      files:
        src/index.js:
          contains: eval
    note: >-
      The pending change, and the whole discriminator of this flow: the committed
      version of this module has no dynamic-code-evaluation finding and the working
      copy does, so the two stash answers must produce different analyses.
  - run:
      - analyze
      - '--no-stash'
      - '--no-llm'
      - '--no-skills'
    expect:
      exit: 0
      files:
        src/index.js:
          contains: eval
        .claude/skills/.truecourse-skills.json:
          absent: true
    note: >-
      Analyzing as-is: the run completes without asking about the dirty tree, and the
      pending change is still there afterwards. `--no-skills` is claimed on the same
      run — nothing was asked and no skills lockfile was written.
    milestone:
      - cli-ref-analyze-no-stash-analyzes-the-tree-as-is
      - cli-ref-analyze-no-skills-skips-the-skills-prompt
  - run:
      - list
      - '--all'
    expect:
      exit: 0
      stdout:
        contains: Dynamic code evaluation
    note: The as-is analysis SAW the working tree — the finding that exists only in the pending change is in the results.
    milestone:
      - cli-ref-analyze-no-stash-analyzes-the-tree-as-is
  - run:
      - analyze
      - '--stash'
      - '--no-llm'
      - '--no-skills'
    expect:
      exit: 0
      files:
        src/index.js:
          contains: eval
    note: >-
      The same dirty tree, the other answer: no prompt (the flag pre-approves it) and
      the pending change is back in the working tree when the run ends. A stash that
      never came back would be data loss, so its restoration is part of the claim.
    milestone:
      - cli-ref-analyze-stash-preapproves-stashing
  - run:
      - list
      - '--all'
    expect:
      exit: 0
      stdout:
        matches: ^(?![\s\S]*Dynamic code evaluation)[\s\S]*$
    note: >-
      The stashed analysis saw the COMMITTED state: the finding that exists only in
      the pending change is absent. This is the only way to tell "stashed and
      restored" from "never stashed at all".
    milestone:
      - cli-ref-analyze-stash-preapproves-stashing
