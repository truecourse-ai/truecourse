guard: 3
id: filter-the-violation-list-and-mistype-a-flag.cli.1
title: A developer pages through a long violation list and narrows it by severity
promise: A developer pages through a long violation list and narrows it by severity
flow:
  id: filter-the-violation-list-and-mistype-a-flag
  fingerprint: sha256:af5d44a77801582a31e602724fc9f0156aac9f1e38ae3b3068592ba91a4439db
journey:
  path:
    - cli/analyze
    - cli/list
  fingerprints:
    - sha256:66792fe9ce97d69aa7a54ecd634d57f145eebe1d89de01e7f2f4aedc0dc232b8
    - sha256:b7b34908386f2c205afb3ab048ed34ebca96cd05f9ae0622025f613a45c574e8
binds:
  - doc: reference/spec-docs/analyze/overview.mdx
    section: commands
    fingerprint: sha256:9b82a730b41a72e6e00cc47eaf3a26930b06548e0496be87a19843f7b3c73ede
needs:
  - analysis-target
setup:
  env:
    TRUECOURSE_TELEMETRY: '0'
    TRUECOURSE_LLM_TRANSPORT: claude-code
normalize: []
driver: cli
steps:
  - run:
      - analyze
      - '--no-llm'
      - '--no-stash'
      - '--no-skills'
    cwd: .tc-supplied/analysis-target
    expect:
      exit: 0
      files:
        .tc-supplied/analysis-target/.truecourse/LATEST.json:
          exists: true
    note: Plumbing — the listing needs an analysis of the REGISTERED project behind it.
  - run:
      - list
    cwd: .tc-supplied/analysis-target
    expect:
      exit: 0
      stdout:
        matches: '^(?=[\s\S]*Showing 1.20 of [0-9]+ violations)(?=[\s\S]*Next page: truecourse list --offset 20)[\s\S]*$'
    note: The default listing paginates — the contrast `--all` is claimed against. The `.` in `1.20` stands in for the en dash the renderer prints.
  - run:
      - list
      - '--all'
    cwd: .tc-supplied/analysis-target
    expect:
      exit: 0
      stdout:
        matches: ^(?![\s\S]*Next page)(?![\s\S]*Showing )(?=[\s\S]*[0-9]+ violations \()[\s\S]*$
    note: 'Same analysis, no "Showing X–Y of N" window and no next-page pointer: the footer switches to the whole-set form, which is how the renderer says "this is all of them".'
    milestone:
      - list-all-shows-every-violation-unpaginated
  - run:
      - list
      - '--severity'
      - high,critical
    cwd: .tc-supplied/analysis-target
    expect:
      exit: 0
      stdout:
        matches: '[0-9]+ violations \((?![^)]*(?:medium|low|info))[^)]*(?:critical|high)[^)]*\)'
    note: >-
      The footer's parenthetical tallies what the renderer just printed, per severity:
      it names a requested severity and names none of the three that were not
      requested. That tally is the filter's falsifiable form and it does not depend on
      which findings the bound project has.
    milestone:
      - list-severity-filters-by-severity
