  env:
    TRUECOURSE_TELEMETRY: '0'
  git:
    branch: main
    identity:
      name: TrueCourse Reference
      email: reference@truecourse.test
    commits:
      - files:
          - package.json
          - src/a.js
          - src/b.js
          - src/c.js
          - src/d.js
          - src/e.js
          - src/unsafe.js
          - src/collect.py
        message: seed chatty sample
normalize: []
driver: cli
steps:
  - run:
      - analyze
      - '--no-llm'
      - '--no-skills'
    expect:
      exit: 0
  - run:
      - list
    expect:
      exit: 0
      stdout:
        matches: '^(?=[\s\S]*Showing 1.20 of [0-9]+ violations)(?=[\s\S]*Next page: truecourse list --offset 20)[\s\S]*$'
    note: The default listing paginates — the contrast `--all` is claimed against. The `.` in `1.20` stands in for the en dash the renderer prints.
  - run:
      - list
      - '--all'
    expect:
      exit: 0
      stdout:
        matches: ^(?![\s\S]*Next page)(?![\s\S]*Showing )(?=[\s\S]*[0-9]+ violations \()[\s\S]*$
    note: 'Same analysis, no "Showing X–Y of N" window and no next-page pointer: the footer switches to the whole-set form, which is how the renderer says "this is all of them".'
    milestone:
      - list-all-shows-every-violation-unpaginated
  - run:
      - list
      - '--severity'
      - high,critical
    expect:
      exit: 0
      stdout:
        matches: ^(?![\s\S]*LOW)(?![\s\S]*MEDIUM)(?=[\s\S]*HIGH)[\s\S]*$
    note: 'Every printed row carries a requested severity: the 25 low findings that dominated the unfiltered report are gone, the high ones remain.'
    milestone:
      - list-severity-filters-by-severity
  - run:
      - list
      - '--severity'
      - nope
    expect:
      exit: 1
      stderr:
        matches: unknown severity value\(s\)[\s\S]*critical, high, medium, low, info
  - run:
      - list
      - '--limit'
      - abc
    expect:
      exit: 0
      stdout:
        matches: ^(?![\s\S]*Next page)[\s\S]*$
    note: A non-numeric `--limit` does not error — it degrades to "no pagination". Recorded here so the behavior is pinned by a test rather than by folklore.
  - run:
      - '--bogus'
    expect:
      exit: 1
      stderr:
        contains: unknown option
  - run:
      - bogus
    expect:
      exit: 0
      stdout:
        contains: 'Usage: truecourse'
    note: An unknown COMMAND prints help and exits 0; an unknown OPTION exits 1. Both are contract, and they differ.
