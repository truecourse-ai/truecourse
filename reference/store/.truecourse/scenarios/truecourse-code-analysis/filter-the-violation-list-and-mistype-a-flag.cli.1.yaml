setup:
  files:
    package.json: |
      {
        "name": "chatty-sample",
        "version": "1.0.0",
        "type": "module"
      }
    src/a.js: |
      export function a(rows) {
        console.log('a1', rows)
        console.log('a2', rows)
        console.log('a3', rows)
        console.log('a4', rows)
        console.log('a5', rows)
        return rows
      }
    src/b.js: |
      export function b(rows) {
        console.log('b1', rows)
        console.log('b2', rows)
        console.log('b3', rows)
        console.log('b4', rows)
        console.log('b5', rows)
        return rows
      }
    src/c.js: |
      export function c(rows) {
        console.log('c1', rows)
        console.log('c2', rows)
        console.log('c3', rows)
        console.log('c4', rows)
        console.log('c5', rows)
        return rows
      }
    src/d.js: |
      export function d(rows) {
        console.log('d1', rows)
        console.log('d2', rows)
        console.log('d3', rows)
        console.log('d4', rows)
        console.log('d5', rows)
        return rows
