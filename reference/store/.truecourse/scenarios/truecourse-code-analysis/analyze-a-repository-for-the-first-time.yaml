id: analyze-a-repository-for-the-first-time
title: A developer analyzes a repository for the first time and reads the report
promise: A developer analyzes a repository for the first time and reads the report
flow:
  id: analyze-a-repository-for-the-first-time
  fingerprint: sha256:08ce63f954d273c1e5ae8c9d40cb08b6f6ff27d41977d7f507a6292ee95d3bf3
interface:
  path:
    - cli/analyze
    - cli/list
  fingerprints:
    - sha256:66792fe9ce97d69aa7a54ecd634d57f145eebe1d89de01e7f2f4aedc0dc232b8
    - sha256:b7b34908386f2c205afb3ab048ed34ebca96cd05f9ae0622025f613a45c574e8
binds:
  - doc: reference/spec-docs/analyze/baseline-and-diff.mdx
    section: baselines-diff
    fingerprint: sha256:e49543c814a36d09ff9ed323a2d12269d7371ebae20ebd392381c9374a5cbd4e
  - doc: reference/spec-docs/analyze/overview.mdx
    section: overview
    fingerprint: sha256:a190d81681a869fb10582940aa88c9fa6324f2f1d62979cbc383cbf014ac1f51
  - doc: reference/spec-docs/analyze/overview.mdx
    section: rule-coverage
    fingerprint: sha256:e2ac33a1d0da9236cf914ab67ae65a25c2702a0b033828a750b416c44d61f89f
  - doc: reference/spec-docs/analyze/overview.mdx
    section: commands
    fingerprint: sha256:9b82a730b41a72e6e00cc47eaf3a26930b06548e0496be87a19843f7b3c73ede
  - doc: reference/spec-docs/analyze/overview.mdx
    section: language-support
    fingerprint: sha256:ce4418cd98a71103c8434e29537bc6310a2c117c769c9926e6e12dbc824fba3c
  - doc: reference/spec-docs/analyze/overview.mdx
    section: what-it-catches
    fingerprint: sha256:6ca33dd8428dd3bf4098933ba88aa1dfb5f75ce20449bad634c7283985a5a4e0
needs:
  - analysis-target
setup:
  env:
    TRUECOURSE_TELEMETRY: '0'
normalize: []
steps:
  - run:
      - analyze
      - '--no-llm'
      - '--no-stash'
      - '--no-skills'
    cwd: .tc-supplied/analysis-target
    expect:
      exit: 0
      output:
        matches: ^(?![\s\S]*LLM will analyze)(?=[\s\S]*violations \()(?=[\s\S]*Code quality checks — [1-9][0-9]* violations)(?=[\s\S]*Security checks — [1-9][0-9]* violations)(?=[\s\S]*Bugs checks — [1-9][0-9]* violations)(?=[\s\S]*Architecture checks — [1-9][0-9]* violations)(?=[\s\S]*Performance checks — [1-9][0-9]* violations)(?=[\s\S]*Reliability checks — [1-9][0-9]* violations)(?=[\s\S]*Database checks — [1-9][0-9]* violations)(?=[\s\S]*Style checks — [1-9][0-9]* violations)[\s\S]*$
      files:
        .tc-supplied/analysis-target/.truecourse:
          exists: true
        .tc-supplied/analysis-target/.truecourse/analyses:
          exists: true
        .tc-supplied/analysis-target/.truecourse/history.json:
          exists: true
        .tc-supplied/analysis-target/.truecourse/LATEST.json:
          contains: '.ts"'
    note: >-
      One command against the REGISTERED project, and every category claim rides its
      own row of the run's own report: the deterministic scan prints one
      `<Category> checks — N violations` line per category it found something in, and
      a category that found nothing prints no line at all — so a line with N ≥ 1 is
      the falsifiable form of "analysis reports <Category> violations", with no
      finding title anywhere in the assertion. The matcher spans BOTH streams because
      the progress block is written to stderr while the summary line is written to
      stdout, and no interface fact places either. The store claims are asserted as what
      they are: the `.truecourse/` directory, the `analyses/` directory the per-run
      snapshot lands in, `history.json`, and `LATEST.json` holding this run's parsed
      modules. The run planned no LLM call and printed no cost, which is the
      deterministic-only half. The `.ts` path in the snapshot is the TypeScript half
      of the language sentence; its JavaScript half is read the same way on the next
      step, because a file matcher carries one substring per path per step.
    milestone:
      - first-analyze-creates-dot-truecourse-dir
      - analyze-runs-static-and-llm-analysis
      - analyze-runs-full-analysis-in-process
      - analyze-stores-results-as-json-under-dot-truecourse
      - latest-json-is-most-recent-snapshot
      - deterministic-rules-make-no-api-calls
      - analyze-no-llm-skips-llm-rules
      - supports-javascript-typescript
      - catches-code-quality-violations
      - catches-security-violations
      - catches-bug-violations
      - catches-architecture-violations
      - catches-performance-violations
      - catches-reliability-violations
      - catches-database-violations
      - catches-style-violations
  - run:
      - list
    cwd: .tc-supplied/analysis-target
    expect:
      exit: 0
      stdout:
        matches: ^(?=[\s\S]*(?:CRITICAL|HIGH|MEDIUM|LOW|INFO))(?=[\s\S]*[0-9]+ violations \()[\s\S]*$
      files:
        .tc-supplied/analysis-target/.truecourse/LATEST.json:
          contains: '.js"'
    note: >-
      The listing renders the analysis: at least one row carrying a severity word from
      the documented set, and the footer stating the violation count. Both are the
      renderer's own row templates, so nothing here depends on WHICH findings the
      bound project has. The `.js` path in the same snapshot is the JavaScript half of
      the language sentence.
    milestone:
      - list-shows-violations-from-latest-analysis
      - supports-javascript-typescript
  - run:
      - analyze
      - '--llm'
      - '--no-stash'
      - '--no-skills'
    cwd: .tc-supplied/analysis-target
    env:
      CLAUDE_CODE_BINARY: ${sandbox}/no-claude-binary
    expect:
      exit: 1
      output:
        matches: (transport|claude|API key|config llm setup)
      files:
        .tc-supplied/analysis-target/.truecourse/LATEST.json:
          contains: '.py"'
    note: >-
      No transport is saved in the sandbox HOME and `TRUECOURSE_LLM_TRANSPORT` is
      unset, so asking for LLM rules cannot produce LLM results. "No usable transport"
      is CONSTRUCTED here rather than inherited from the machine: `CLAUDE_CODE_BINARY`
      (documented in the CLI reference's environment table) is pointed at a path that
      does not exist, so the claude-code transport the program falls back to cannot
      resolve a binary. Left ambient, this step would pass on a developer machine with
      no Claude Code login and FAIL on one that has it — a verdict about the machine
      rather than the claim (observed 2026-08-07: the step passed only because the
      ambient `claude` answered "Not logged in"). The docs state the requirement but
      not the failure mode, so the assertion stays at "the run does not proceed, and
      says why". The aborted run rewrote nothing, so `LATEST.json` is still the first
      analyze's snapshot — the Python module it recorded is where the Python half of
      the language support sentence is read.
    milestone:
      - llm-rules-require-an-llm-transport
      - supports-python
