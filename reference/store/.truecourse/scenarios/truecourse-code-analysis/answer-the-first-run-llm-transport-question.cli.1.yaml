guard: 3
id: answer-the-first-run-llm-transport-question.cli.1
title: A first-time user is asked how TrueCourse should reach the LLM, and answers once
promise: A first-time user is asked how TrueCourse should reach the LLM, and answers once
flow:
  id: answer-the-first-run-llm-transport-question
  fingerprint: sha256:2c588bf8abc29a3b1d2f8e3bff07a3af88d0634689d2b8e950042f3005e61758
interface:
  path:
    - cli/add
  fingerprints:
    - sha256:61d9dd0c58f542195f6305faa593fc5ee2fc8de203fac212df3c86d442beb0a4
binds:
  - doc: reference/spec-docs/reference/cli.mdx
    section: cli-reference
    fingerprint: sha256:106633ae02f0b61328d26fce975acffb61809ae11be76dbb9d0df54bd1c81d93
setup:
  files:
    package.json: |
      {
        "name": "first-run-sample",
        "version": "1.0.0",
        "type": "module"
      }
  env:
    TRUECOURSE_TELEMETRY: '0'
normalize: []
steps:
  - run:
      - add
      - '--no-skills'
    stdin:
      - marker: 'How should TrueCourse run its LLM calls?'
        answer: "\r"
    tty: true
    expect:
      exit: 0
      output:
        matches: How should TrueCourse run its LLM calls
    note: >-
      The sandbox home is fresh, so this IS the first truecourse command this user
      ever ran, and no transport variable is set — the two conditions the doc's Note
      states. The question itself is the observation; the answer is scripted so the
      run can finish. It is keyed to the question, so it is typed only once the
      select is up: the key is CARRIAGE RETURN, what a terminal sends for Enter and
      the only key a select prompt accepts as submit.
    milestone:
      - cli-ref-first-run-asks-how-to-reach-the-llm
  - run:
      - add
      - '--no-skills'
    tty: true
    expect:
      exit: 0
      output:
        matches: ^(?![\s\S]*How should TrueCourse run its LLM calls)[\s\S]*$
    note: >-
      The same command, on the same terminal, after the answer was given. "Saves the
      answer" has exactly one public observation — the question is not asked a second
      time — so its absence here is the whole claim.
    milestone:
      - cli-ref-first-run-saves-the-answer
