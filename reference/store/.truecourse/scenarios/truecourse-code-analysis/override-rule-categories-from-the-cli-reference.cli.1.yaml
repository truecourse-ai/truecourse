guard: 3
id: override-rule-categories-from-the-cli-reference.cli.1
title: A team turns a rule category off for their repository and puts it back
promise: A team turns a rule category off for their repository and puts it back
flow:
  id: override-rule-categories-from-the-cli-reference
  fingerprint: sha256:62a7f6e2a6da64ae7296ebef84f513edac43390d0efcd5b0237eb5b08ba04bff
interface:
  path:
    - cli/add
    - cli/rules-categories
  fingerprints:
    - sha256:61d9dd0c58f542195f6305faa593fc5ee2fc8de203fac212df3c86d442beb0a4
    - sha256:7c34c13f1388399e8fef9e49a52d4f25d1b4c525cdc32ec1b827007a6be170d6
binds:
  - doc: reference/spec-docs/reference/cli.mdx
    section: rules
    fingerprint: sha256:3db6a25efb8692740c901c8d12d5b78a7bef67efe18ab0bf1cc7dd1b5c1d339f
setup:
  files:
    package.json: |
      {
        "name": "categories-sample",
        "version": "1.0.0",
        "type": "module"
      }
    src/index.js: |
      export function main(input) {
        return input
      }
  env:
    TRUECOURSE_TELEMETRY: '0'
    TRUECOURSE_LLM_TRANSPORT: claude-code
normalize: []
steps:
  - run:
      - add
      - '--no-skills'
    expect:
      exit: 0
      files:
        .truecourse/.gitignore:
          exists: true
    note: Plumbing — every `rules` subcommand needs a registered repository.
  - run:
      - rules
      - categories
    expect:
      exit: 0
      stdout:
        matches: ^(?=[\s\S]*security)(?=[\s\S]*bugs)(?=[\s\S]*architecture)(?=[\s\S]*performance)(?=[\s\S]*reliability)(?=[\s\S]*code-quality)(?=[\s\S]*database)(?=[\s\S]*style)[\s\S]*$
      files:
        .truecourse/config.json:
          absent: true
    note: >-
      The view: every category is listed. Nothing has been overridden yet, which the
      absent per-repo config file states more precisely than any message could — and
      it is the "before" the next steps are measured against.
    milestone:
      - cli-ref-rules-manages-analysis-rules
      - cli-ref-rules-categories-views-categories
  - run:
      - rules
      - categories
      - '--disable'
      - style
    expect:
      exit: 0
      files:
        .truecourse/config.json:
          exists: true
    note: The mutation. Its message is not the claim — the next step is.
  - run:
      - rules
      - categories
    expect:
      exit: 0
      stdout:
        matches: ^(?=[\s\S]*style[^\n]*disabled)(?=[\s\S]*security[^\n]*enabled)[\s\S]*$
    note: >-
      Read back: the disabled category reads disabled on its own row and its
      neighbours are untouched. A command that printed "Disabled" and wrote nothing
      would pass the mutation step and fail this one.
    milestone:
      - cli-ref-rules-categories-disable-disables-a-category
  - run:
      - rules
      - categories
      - '--enable'
      - style
    expect:
      exit: 0
    note: The inverse mutation, on the category that is now off.
  - run:
      - rules
      - categories
    expect:
      exit: 0
      stdout:
        matches: style[^\n]*enabled
    note: 'Read back: the category is on again.'
    milestone:
      - cli-ref-rules-categories-enable-enables-a-category
  - run:
      - rules
      - categories
      - '--reset'
    expect:
      exit: 0
    note: The third flag on the row — drop the per-repo override entirely.
  - run:
      - rules
      - categories
    expect:
      exit: 0
      stdout:
        contains: global default
    note: >-
      The listing labels itself as the global default rather than a per-repo
      override. That label is the only thing that distinguishes a reset from an
      enable once the effective values happen to agree, which is exactly why it is
      the assertion.
    milestone:
      - cli-ref-rules-categories-reset-clears-the-override