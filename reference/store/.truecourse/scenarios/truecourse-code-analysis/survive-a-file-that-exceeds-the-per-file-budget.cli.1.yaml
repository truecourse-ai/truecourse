guard: 3
id: survive-a-file-that-exceeds-the-per-file-budget.cli.1
title: A repository with a file the scanner cannot finish still produces a report
promise: A repository with a file the scanner cannot finish still produces a report
flow:
  id: survive-a-file-that-exceeds-the-per-file-budget
  fingerprint: sha256:f1895c375f4ee352655d61d9e6eb00dd3345ea2f6a7b305850de1fa0c2d597f4
journey:
  path:
    - cli/analyze
    - cli/list
  fingerprints:
    - sha256:66792fe9ce97d69aa7a54ecd634d57f145eebe1d89de01e7f2f4aedc0dc232b8
    - sha256:b7b34908386f2c205afb3ab048ed34ebca96cd05f9ae0622025f613a45c574e8
binds:
  - doc: reference/spec-docs/analyze/overview.mdx
    section: rule-coverage
    fingerprint: sha256:e2ac33a1d0da9236cf914ab67ae65a25c2702a0b033828a750b416c44d61f89f
setup:
  files:
    package.json: |
      {
        "name": "budget-sample",
        "version": "1.0.0",
        "type": "module"
      }
    src/index.js: |
      export function main(input) {
        console.log('starting')
        return input
      }
    src/bulk.js: |
      // A large but entirely legitimate source file — the kind the doc says
      // the override exists for.
      export function step01(v) { return v + 1 }
      export function step02(v) { return v + 2 }
      export function step03(v) { return v + 3 }
      export function step04(v) { return v + 4 }
      export function step05(v) { return v + 5 }
      export function step06(v) { return v + 6 }
      export function step07(v) { return v + 7 }
      export function step08(v) { return v + 8 }
      export function step09(v) { return v + 9 }
      export function step10(v) { return v + 10 }
      export function step11(v) { return v + 11 }
      export function step12(v) { return v + 12 }
      export function step13(v) { return v + 13 }
      export function step14(v) { return v + 14 }
      export function step15(v) { return v + 15 }
      export function step16(v) { return v + 16 }
      export function step17(v) { return v + 17 }
      export function step18(v) { return v + 18 }
      export function step19(v) { return v + 19 }
      export function step20(v) { return v + 20 }
      export function pipeline(v) {
        return [
          step01, step02, step03, step04, step05,
          step06, step07, step08, step09, step10,
          step11, step12, step13, step14, step15,
          step16, step17, step18, step19, step20,
        ].reduce((acc, fn) => fn(acc), v)
      }
  env:
    TRUECOURSE_TELEMETRY: '0'
  git:
    branch: main
    identity:
      name: TrueCourse Reference
      email: reference@truecourse.test
    commits:
      - files:
          - package.json
          - src/index.js
          - src/bulk.js
        message: seed budget sample
normalize: []
driver: cli
steps:
  - run:
      - analyze
      - '--no-llm'
      - '--no-skills'
    expect:
      exit: 0
      output:
        matches: ^(?![\s\S]*bulk\.js)[\s\S]*$
      files:
        .truecourse/LATEST.json:
          contains: '"violations"'
    note: 'Without this control the override claim would be untestable: any warning seen later has to be attributable to the variable, not to the seed.'
  - run:
      - analyze
      - '--no-llm'
      - '--no-skills'
    env:
      TRUECOURSE_DET_FILE_TIMEOUT_MS: '1'
    expect:
      exit: 0
      output:
        matches: ^(?=[\s\S]*[Ss]kipp)(?=[\s\S]*bulk\.js)[\s\S]*$
      files:
        .truecourse/LATEST.json:
          contains: '"violations"'
        .truecourse/history.json:
          exists: true
    note: 'Same command, same project, one environment variable: files that finished comfortably a step ago are now skipped WITH A WARNING that names the file, and the run still exits 0 and still writes its snapshot and history. The matcher spans both streams because the doc does not name a channel; asserting the exit code alone would pass whether or not the promise was kept. THIS STEP IS RED ON PURPOSE. Verified 2026-08-07: the skip really happens (the seeded file is dropped from the scan and the violation count falls), the run exits 0 and writes its output — but the warning reaches NEITHER stream. It exists only as a `log.warn` line in `<repo>/.truecourse/logs/analyze.log`; the pipeline''s `skippedDeterministicFiles` list has no consumer anywhere, and the user is told `Analysis complete` with no hint the scan was partial. The doc promises a warning, the program silently drops files: a product defect, recorded as the `docs-promise-not-surfaced` diagnostic on `cli/analyze`. Re-pointing this assertion at the log file would turn a silent-partial-analysis bug into a green.'
    milestone:
      - det-file-timeout-env-override
      - pathological-file-skipped-with-warning
      - analysis-always-completes-and-writes-output
  - run:
      - list
      - '--limit'
      - '200'
    expect:
      exit: 0
    note: The report is readable after a skipping run — the output really was written, not just claimed.
