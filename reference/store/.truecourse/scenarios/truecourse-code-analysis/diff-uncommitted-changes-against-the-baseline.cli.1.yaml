guard: 3
id: diff-uncommitted-changes-against-the-baseline.cli.1
title: A developer checks what their uncommitted changes introduce and resolve
promise: A developer checks what their uncommitted changes introduce and resolve
flow:
  id: diff-uncommitted-changes-against-the-baseline
  fingerprint: sha256:1061ce3a50aae003bd7ca064aed0f8d00dab04465d6a1a5d12f005e9ee428149
interface:
  path:
    - cli/analyze
    - cli/list
  fingerprints:
    - sha256:66792fe9ce97d69aa7a54ecd634d57f145eebe1d89de01e7f2f4aedc0dc232b8
    - sha256:b7b34908386f2c205afb3ab048ed34ebca96cd05f9ae0622025f613a45c574e8
binds:
  - doc: reference/spec-docs/analyze/overview.mdx
    section: overview
    fingerprint: sha256:a190d81681a869fb10582940aa88c9fa6324f2f1d62979cbc383cbf014ac1f51
  - doc: reference/spec-docs/analyze/baseline-and-diff.mdx
    section: diff-analysis
    fingerprint: sha256:7cc77a195f14d0c09912572aa32d548a9921173dd9bb21c73323aef554e43b75
  - doc: reference/spec-docs/analyze/overview.mdx
    section: commands
    fingerprint: sha256:9b82a730b41a72e6e00cc47eaf3a26930b06548e0496be87a19843f7b3c73ede
setup:
  files:
    package.json: |
      {
        "name": "diff-sample",
        "version": "1.0.0",
        "type": "module"
      }
    src/legacy.js: |
      export function legacy(rows) {
        console.log('legacy', rows.length)
        return rows
      }
    src/unsafe.js: |
      export function runRule(source) {
        return eval(source)
      }
    src/index.js: |
      import { legacy } from './legacy.js'

      export function main(rows) {
        return legacy(rows)
      }
  env:
    TRUECOURSE_TELEMETRY: '0'
  git:
    branch: main
    identity:
      name: TrueCourse Reference
      email: reference@truecourse.test
    commits:
      - files:
          - package.json
          - src/legacy.js
          - src/unsafe.js
          - src/index.js
        message: seed diff sample
normalize: []
driver: cli
steps:
  - run:
      - analyze
      - '--no-llm'
      - '--no-skills'
    expect:
      exit: 0
  - git:
      - add
      - .truecourse/LATEST.json
    expect:
      exit: 0
  - git:
      - commit
      - '-m'
      - add truecourse baseline
    expect:
      exit: 0
  - run:
      - list
      - '--limit'
      - '200'
    expect:
      exit: 0
      stdout:
        contains: console.log call
    note: The pre-existing violation IS in the baseline report. Without this step, its later absence from the diff would prove nothing.
  - write:
      src/pay.js: |
        export function pay(text) {
          return JSON.parse(text)
        }
      src/unsafe.js: |
        export function runRule(source) {
          return JSON.stringify(source)
        }
    expect:
      files:
        src/pay.js:
          exists: true
  - run:
      - analyze
      - '--diff'
      - '--no-llm'
    expect:
      exit: 0
      stdout:
        matches: '^(?=[\s\S]*Changed files: [0-9]+)(?=[\s\S]*Summary: [0-9]+ new issues, [0-9]+ resolved)[\s\S]*$'
      files:
        .truecourse/diff.json:
          contains: Unsafe JSON.parse
    note: 'Both docs state the new/resolved sentence, so one observation carries both claim ids. The command prints the changed-file count and the new/resolved summary and defers itemization to `truecourse list --diff` (asserted two steps below) — the docs promise "new/resolved violations from your uncommitted changes", never an output shape, and the first authored form over-asserted NEW ISSUES/RESOLVED section headers this stdout never carried (first executed 2026-08-11; the step was masked by the config.json staging failure before that). The introduced finding itself is proven as DATA: diff.json carries the new violation''s title, which is also what makes `diff-writes-diff-json` falsifiable.'
    milestone:
      - analyze-diff-reports-new-and-resolved
      - analyze-diff-reports-new-and-resolved-overview
      - analyze-diff-diffs-worktree-against-baseline
      - diff-writes-diff-json
  - run:
      - list
      - '--diff'
    expect:
      exit: 0
      stdout:
        matches: '^(?![\s\S]*console\.log call)(?=[\s\S]*NEW ISSUES)(?=[\s\S]*Unsafe JSON\.parse)(?=[\s\S]*Summary: )[\s\S]*$'
    note: '`list --diff` renders the STORED result, so this doubles as proof that the diff run wrote what it printed. The untouched `console.log` violation — present in the full listing three steps earlier — is absent: the diff reports only what the changes introduce and resolve.'
    milestone:
      - list-diff-shows-diff-results
      - diff-excludes-preexisting-violations
  - delete:
      - src/pay.js
    expect:
      files:
        src/pay.js:
          absent: true
  - write:
      src/scan.js: |
        export function scan(lines, patterns) {
          const hits = []
          for (const pattern of patterns) {
            const re = new RegExp(pattern)
            for (const line of lines) {
              if (re.test(line)) hits.push(line)
            }
          }
          return hits
        }
    expect:
      files:
        src/scan.js:
          exists: true
  - run:
      - analyze
      - '--diff'
      - '--no-llm'
    expect:
      exit: 0
  - run:
      - list
      - '--diff'
    expect:
      exit: 0
      stdout:
        matches: ^(?![\s\S]*Unsafe JSON\.parse)(?=[\s\S]*Regex created inside loop)[\s\S]*$
    note: '`list --diff` reads diff.json, so its output IS the file''s content: only the second run''s finding is there. Nothing accumulated.'
    milestone:
      - diff-json-overwritten-each-run
