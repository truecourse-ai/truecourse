guard: 3
id: run-llm-rules-through-the-provider-api-transport.cli.1
title: A developer runs the same LLM rules through a provider API key instead
promise: A developer runs the same LLM rules through a provider API key instead
flow:
  id: run-llm-rules-through-the-provider-api-transport
  fingerprint: sha256:2b4b4d6f216000918f315a3a60a3a4ecb17928df955c9b21677a883327e5bde2
journey:
  path:
    - cli/analyze
    - cli/rules
  fingerprints:
    - sha256:66792fe9ce97d69aa7a54ecd634d57f145eebe1d89de01e7f2f4aedc0dc232b8
    - sha256:a1cb5505112364f829d0346050d74816873fbd3f73c3eedb7730015c7d1f4008
binds:
  - doc: reference/spec-docs/analyze/rules.mdx
    section: llm-powered-rules
    fingerprint: sha256:301491495084c720f3e0cd60ed343e7522ddb3d7203f98bdb1fd3b6909d6abaf
setup:
  env:
    TRUECOURSE_TELEMETRY: '0'
    TRUECOURSE_REFERENCE_API_KEY: ${supplied:llm-api-credentials.api-key}
normalize: []
driver: cli
steps:
  - run:
      - config
      - llm
      - setup
      - '--transport'
      - api
      - '--provider'
      - anthropic
      - '--model'
      - ${supplied:llm-api-credentials.model}
      - '--api-key-env'
      - TRUECOURSE_REFERENCE_API_KEY
    expect:
      exit: 0
      stdout:
        matches: Saved — TrueCourse calls
    note: 'The transport selection is CREATED by the public command that owns it. The earlier version seeded `~/.truecourse/config.json` by hand and pointed `TRUECOURSE_HOME` at `${sandbox}/home` — a path INSIDE the working tree, which the authoring rules forbid outright (the runner already supplies an isolated home outside the tree, and a tool home inside the tree is analyzed as repository content). There is no token that names the runner''s home, so hand-seeding the global config is not expressible honestly at all: this command is the only route. The key never enters the config file — `--api-key-env` stores the VARIABLE NAME and the value is read per run. BLOCKED while `llm-api-credentials` has no registered instance: `config llm setup` probes the provider live before saving, so with no key the step exits 1 and every later step is unreached. That is this variant''s correct state, not a failure of the scenario. The command walks `cli/config`, which layer 2 has not derived yet (the same gap that parks the five `config llm *` claims in `noFlowClaims`), so it is not in `journey.path`.'
  - run:
      - add
      - '--no-skills'
    expect:
      exit: 0
  - run:
      - rules
      - llm
      - '--enable'
    expect:
      exit: 0
      stdout:
        matches: LLM rules enabled
  - run:
      - analyze
      - '--llm'
      - '--llm-transport'
      - api
      - '--no-skills'
    expect:
      exit: 0
      stdout:
        matches: ^(?![\s\S]*Run LLM-powered rules\?)(?=[\s\S]*LLM will analyze [1-9][0-9]* files?)[\s\S]*$
    note: 'rules.mdx states both halves in one sentence — the flag runs the LLM rules FOR THAT RUN and pre-approves the cost estimate — so both are asserted here: LLM work was planned and priced, and no confirmation was requested.'
    milestone:
      - analyze-llm-flag-overrides-for-one-run
  - run:
      - analyze
      - '--no-llm'
      - '--llm-transport'
      - api
      - '--no-skills'
    expect:
      exit: 0
      stdout:
        matches: ^(?![\s\S]*LLM will analyze)(?=[\s\S]*violations \()[\s\S]*$
    note: The paired observation for the next step — this run skipped the LLM rules entirely.
  - run:
      - rules
      - llm
    expect:
      exit: 0
      stdout:
        matches: LLM rules for[^\n]*enabled
    note: 'The distinguishing observation: after a `--no-llm` run, the repository''s persisted setting still reads enabled. "For that run only" is exactly the difference between the previous step''s output and this one.'
    milestone:
      - analyze-no-llm-flag-skips-for-one-run
