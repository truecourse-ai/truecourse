guard: 3
id: run-llm-rules-through-the-provider-api-transport.cli.1
title: A developer runs the same LLM rules through a provider API key instead
promise: A developer runs the same LLM rules through a provider API key instead
flow:
  id: run-llm-rules-through-the-provider-api-transport
  fingerprint: sha256:2b4b4d6f216000918f315a3a60a3a4ecb17928df955c9b21677a883327e5bde2
interface:
  path:
    - cli/config-llm-setup
    - cli/add
    - cli/rules-llm
    - cli/analyze
  fingerprints:
    - sha256:ba1b3c947df367c66dfd393f3d81ec1adf0190b020a009dac1cf0eab64d6d526
    - sha256:61d9dd0c58f542195f6305faa593fc5ee2fc8de203fac212df3c86d442beb0a4
    - sha256:23ad6cb2a11da30f8f40226ccd122367e3fe43b2b4cdde3ee7ab696f047cbf78
    - sha256:66792fe9ce97d69aa7a54ecd634d57f145eebe1d89de01e7f2f4aedc0dc232b8
binds:
  - doc: reference/spec-docs/analyze/rules.mdx
    section: llm-powered-rules
    fingerprint: sha256:301491495084c720f3e0cd60ed343e7522ddb3d7203f98bdb1fd3b6909d6abaf
needs:
  - llm-api-credentials
  - analysis-target
setup:
  env:
    TRUECOURSE_TELEMETRY: '0'
    TRUECOURSE_REFERENCE_API_KEY: ${supplied:llm-api-credentials.api-key}
normalize: []
steps:
  - run:
      - config
      - llm
      - setup
      - '--transport'
      - api
      - '--provider'
      - ${supplied:llm-api-credentials.provider}
      - '--model'
      - ${supplied:llm-api-credentials.model}
      - '--api-key-env'
      - TRUECOURSE_REFERENCE_API_KEY
      - optional:
          - '--base-url'
          - ${supplied:llm-api-credentials.base-url}
    expect:
      exit: 0
      stdout:
        matches: Saved — TrueCourse calls
    note: >-
      The transport selection is CREATED by the public command that owns it — the only
      honest route, because the alternative (hand-seeding `~/.truecourse/config.json`)
      would need a token naming the runner's isolated home, and pointing a tool home
      inside the working tree is forbidden outright. The scenario picks NOTHING for
      itself: the provider, the model, the key and the endpoint all come from the
      registered instance, so the test grades the documented command against whatever
      account this machine actually has instead of a provider it assumed. The key never
      enters the config file: `--api-key-env` stores the VARIABLE NAME and the value is
      read per run. `--base-url` is an OPTIONAL pair — a machine that registered no
      endpoint drops the flag entirely and the provider's own default stands.
      BLOCKED while `llm-api-credentials` has no registered instance: `config llm
      setup` probes the provider live before saving, so with no key the step exits 1
      and every later step is unreached. That is this variant's correct state, not a
      failure of the scenario. The command walks `cli/config`, which the flow's own
      interface path does not claim, so it is not listed there.
  - run:
      - add
      - '--no-skills'
    cwd: .tc-supplied/analysis-target
    expect:
      exit: 0
  - run:
      - rules
      - llm
      - '--enable'
    cwd: .tc-supplied/analysis-target
    expect:
      exit: 0
      stdout:
        matches: LLM rules enabled
  - run:
      - analyze
      - '--llm'
      - '--llm-transport'
      - api
      - '--no-stash'
      - '--no-skills'
    cwd: .tc-supplied/analysis-target
    timeoutMs: 900000
    expect:
      exit: 0
      stdout:
        matches: ^(?![\s\S]*Run LLM-powered rules\?)(?=[\s\S]*LLM will analyze [1-9][0-9]* files?)[\s\S]*$
    note: 'rules.mdx states both halves in one sentence — the flag runs the LLM rules FOR THAT RUN and pre-approves the cost estimate — so both are asserted here: LLM work was planned and priced, and no confirmation was requested.'
    milestone:
      - analyze-llm-flag-overrides-for-one-run
  - run:
      - analyze
      - '--no-llm'
      - '--llm-transport'
      - api
      - '--no-stash'
      - '--no-skills'
    cwd: .tc-supplied/analysis-target
    expect:
      exit: 0
      stdout:
        matches: ^(?![\s\S]*LLM will analyze)(?=[\s\S]*violations \()[\s\S]*$
    note: The paired observation for the next step — this run skipped the LLM rules entirely.
  - run:
      - rules
      - llm
    cwd: .tc-supplied/analysis-target
    expect:
      exit: 0
      stdout:
        matches: LLM rules for[^\n]*enabled
    note: 'The distinguishing observation: after a `--no-llm` run, the repository''s persisted setting still reads enabled. "For that run only" is exactly the difference between the previous step''s output and this one.'
    milestone:
      - analyze-no-llm-flag-skips-for-one-run
