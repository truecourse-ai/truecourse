guard: 3
id: decline-the-pre-commit-hook-installation.cli.1
title: A developer reads the latency warning and declines the hook
promise: A developer reads the latency warning and declines the hook
flow:
  id: decline-the-pre-commit-hook-installation
  fingerprint: sha256:bef08b20f393c21f4a60c9853f0e3ff7ef792e2f56ffa6c869513403728fda9c
interface:
  path:
    - cli/hooks-install
    - cli/analyze
  fingerprints:
    - sha256:1038639e4b6df928f00ecbcf7f8ddcecf6a249c62ae109d2838192aa506ac539
    - sha256:66792fe9ce97d69aa7a54ecd634d57f145eebe1d89de01e7f2f4aedc0dc232b8
binds:
  - doc: reference/spec-docs/analyze/git-hooks.mdx
    section: how-it-works
    fingerprint: sha256:5d58608fdb59d3d39101a620a11ae854561091564142322987457e9d52f209d5
setup:
  files:
    package.json: |
      {
        "name": "declined-sample",
        "version": "1.0.0",
        "type": "module"
      }
    src/index.js: |
      export function main(input) {
        return input
      }
  env:
    TRUECOURSE_TELEMETRY: '0'
    TRUECOURSE_LLM_TRANSPORT: claude-code
  git:
    branch: main
    identity:
      name: TrueCourse Reference
      email: reference@truecourse.test
    commits:
      - files:
          - package.json
          - src/index.js
        message: seed declined sample
normalize: []
driver: cli
steps:
  - run:
      - hooks
      - install
    stdin:
      - marker: 'Install the pre-commit hook?'
        answer: 'n'
    tty: true
    expect:
      exit: 0
      stdout:
        matches: ^(?=[\s\S]*analyze --diff)(?=[\s\S]*every commit)(?=[\s\S]*Install the pre-commit hook\?)(?=[\s\S]*Install cancelled)[\s\S]*$
    note: 'Three things in one output: the latency warning about what the hook does on every commit, a question that must be answered, and — because the answer was no — a cancellation instead of an installation. The default answer is NO, so "requires confirmation" is not satisfied by silence.'
    milestone:
      - hooks-install-warns-and-requires-confirmation
  - run:
      - analyze
      - '--no-llm'
      - '--no-skills'
    expect:
      exit: 0
  - git:
      - add
      - .truecourse/LATEST.json
    expect:
      exit: 0
  - git:
      - commit
      - '-m'
      - add truecourse baseline
    expect:
      exit: 0
  - write:
      src/unsafe.js: |
        export function runRule(source) {
          return eval(source)
        }
    expect:
      files:
        src/unsafe.js:
          exists: true
  - git:
      - add
      - src/unsafe.js
    expect:
      exit: 0
  - git:
      - commit
      - '-m'
      - add unsafe
    expect:
      exit: 0
      stdout:
        matches: ^(?![\s\S]*TrueCourse pre-commit check)(?![\s\S]*BLOCKED)[\s\S]*$
    note: A high-severity violation introduced against a committed baseline — the exact change the installed hook blocks in the enforcement flow — sails through with no hook output. Nothing was written when the confirmation was declined.
    milestone:
      - declining-hooks-install-writes-nothing
