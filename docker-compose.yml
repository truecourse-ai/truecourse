# Postgres for a local TrueCourse. `docker compose up -d` and then the server
# is the whole setup: one storage and one job runner, the same ones a hosted
# deployment runs (Postgres 16), and the server applies the migrations at boot.
#
#   docker compose up -d
#   TRUECOURSE_MODE=local pnpm dev
#
# It needs nothing from the environment — the defaults below match the
# DATABASE_URL in .env.example:
#
#   postgres://truecourse:truecourse@localhost:5432/truecourse
#
# Override any of POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB (compose reads
# a .env file beside this one) and set DATABASE_URL to match.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-truecourse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-truecourse}
      POSTGRES_DB: ${POSTGRES_DB:-truecourse}
    volumes:
      - tc-pgdata:/var/lib/postgresql/data
    ports:
      # Loopback-only: the database is reachable from this machine and nowhere
      # else, which is the whole of its security here.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-truecourse}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tc-pgdata:
