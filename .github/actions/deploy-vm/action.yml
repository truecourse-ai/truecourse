name: Deploy application to Azure VM
description: Build and release the checked-out source, then enable monitoring.
inputs:
  environment:
    description: Azure environment, dev or prod
    required: true
runs:
  using: composite
  steps:
    - name: Check deployment configuration
      shell: bash
      env:
        DEPLOY_ENV: ${{ inputs.environment }}
      run: |
        [[ "$DEPLOY_ENV" =~ ^(dev|prod)$ ]]
        test "$AZURE_VM_DEPLOYMENT_ENABLED" = true || { echo 'Enable VM deployments in this GitHub environment after manual VM setup.'; exit 1; }

    - uses: azure/login@v2
      with:
        client-id: ${{ env.AZURE_CLIENT_ID }}
        tenant-id: ${{ env.AZURE_TENANT_ID }}
        subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

    - name: Read provisioned VM settings
      id: vm
      shell: bash
      env:
        DEPLOY_ENV: ${{ inputs.environment }}
      run: |
        az deployment group show --subscription "$AZURE_SUBSCRIPTION_ID" \
          --resource-group "rg-truecourse-$DEPLOY_ENV" --name "truecourse-vm-$DEPLOY_ENV" \
          --query properties.outputs --output json > "$RUNNER_TEMP/vm-deployment.json"
        python3 - "$RUNNER_TEMP/vm-deployment.json" >> "$GITHUB_OUTPUT" <<'PY'
        import json, re, sys
        config = json.load(open(sys.argv[1]))['releaseConfig']['value']
        registry = config['registryName']
        if not re.fullmatch(r'[a-z0-9]+', registry):
            raise SystemExit('Invalid registry in VM deployment outputs')
        print('registry=' + registry)
        PY

    - name: Build application artifact
      id: build
      shell: bash
      env:
        ACR: ${{ steps.vm.outputs.registry }}
      run: |
        TAG="run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        az acr build --subscription "$AZURE_SUBSCRIPTION_ID" --registry "$ACR" \
          --image "truecourse:$TAG" --file Dockerfile .
        DIGEST=$(az acr repository show --subscription "$AZURE_SUBSCRIPTION_ID" \
          --name "$ACR" --image "truecourse:$TAG" --query digest --output tsv)
        [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
        echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

    - name: Release application and enable alerts
      shell: bash
      env:
        DEPLOY_ENV: ${{ inputs.environment }}
        DIGEST: ${{ steps.build.outputs.digest }}
      run: python3 .github/scripts/vm-deploy.py "$DEPLOY_ENV" "$RUNNER_TEMP/vm-deployment.json" "$DIGEST"
