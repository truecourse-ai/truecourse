name: Deploy (prod)
# Stable version tags deploy the tested commit. No npm publication.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  release:
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    outputs:
      stable: ${{ steps.version.outputs.stable }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve stable release commit
        id: version
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo 'Not a stable version tag; production deployment skipped.'
          fi

  test:
    needs: release
    if: needs.release.outputs.stable == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.commit }}
      - uses: ./.github/actions/setup
      - name: Test release (shard ${{ matrix.shard }})
        run: pnpm exec vitest run --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  deploy:
    needs: [release, test]
    if: needs.release.outputs.stable == 'true'
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_VM_DEPLOYMENT_ENABLED: ${{ vars.AZURE_VM_DEPLOYMENT_ENABLED }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.commit }}
      - uses: ./.github/actions/deploy-vm
        with:
          environment: prod
