name: Deploy (prod)

# Two ways to ship production, both gated on the commit being on main:
#   1. Create a GitHub Release (or push a tag) `vX.Y.Z` on a main commit →
#      builds and releases that exact commit. Prerelease tags (`v1.2.3-rc.1`)
#      never deploy.
#   2. Actions → Deploy (prod) → Run workflow, on main → builds main's HEAD.
#      Use it to re-roll a version after a bad host state.
# Nothing deploys on merge. The `prod` Environment supplies the OIDC variables
# and its reviewer gate.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_VM_DEPLOYMENT_ENABLED: ${{ vars.AZURE_VM_DEPLOYMENT_ENABLED }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the ancestry check below needs main's history
      - name: Only commits on main ship to production
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main; production only ships merged code."
            exit 1
          fi
      - uses: ./.github/actions/deploy-vm
        id: deploy
        with:
          environment: prod
      - name: Job summary
        run: |
          echo "🚀 Deployed to **Prod**: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: \`${{ steps.deploy.outputs.image }}\`" >> "$GITHUB_STEP_SUMMARY"
