name: Deploy (dev)

# Two opt-in ways to deploy the shared staging VM — nothing auto-deploys:
#   1. Label a same-repository PR `deploy-dev` → builds that PR's branch (pushes
#      while labeled re-deploy; remove the label to stop).
#   2. Actions → Deploy (dev) → Run workflow → pick a branch (usually main).
# Unlike prod, dev allows any branch and has no reviewer gate — it's the safe
# place to try things.
on:
  pull_request:
    branches: [main]
    types: [labeled, synchronize]
  workflow_dispatch:

permissions:
  id-token: write      # OIDC federated login to Azure (no stored secret)
  contents: read
  pull-requests: write # post the Dev URL as a comment (PR runs only)

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    # Manual dispatch always runs; PR runs only when the `deploy-dev` label is on
    # and the PR comes from this repository (a fork must not reach the OIDC login).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       contains(github.event.pull_request.labels.*.name, 'deploy-dev'))
    runs-on: ubuntu-latest
    environment: dev
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_VM_DEPLOYMENT_ENABLED: ${{ vars.AZURE_VM_DEPLOYMENT_ENABLED }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/deploy-vm
        id: deploy
        with:
          environment: dev

      - name: Job summary
        run: |
          echo "🚀 Deployed to **Dev**: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: \`${{ steps.deploy.outputs.image }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment the Dev URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const image = '${{ steps.deploy.outputs.image }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🚀 Deployed to **Dev**: ${url}\n\nImage: \`${image}\`\n` +
                `_The Dev environment is shared — the most recent push wins._`,
            });
