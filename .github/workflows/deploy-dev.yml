name: Deploy (dev)

# PR deployment remains opt-in. First migration is manual and separate from
# normal deployments. All runs share one lock; see infra/azure/README.md.
on:
  pull_request:
    branches: [main]
    types: [labeled, synchronize]
  workflow_dispatch:
    inputs:
      operation:
        description: 'prepare creates only the environment; migrate stops the drained legacy app; deploy updates v2'
        type: choice
        options: [deploy, prepare, migrate]
        default: deploy
      migration_confirmation:
        description: 'For migrate only: jobs-drained-producers-paused (all workspaces, including queued jobs and follow-ups)'
        type: string
        default: ''

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'deploy-dev')
    runs-on: ubuntu-latest
    environment: dev
    env:
      OPERATION: ${{ inputs.operation || 'deploy' }}
      MIGRATION_CONFIRMATION: ${{ inputs.migration_confirmation }}
    steps:
      - uses: actions/checkout@v4

      - name: Load checked-in dev configuration
        id: config
        env:
          CONFIGURED_RG: ${{ vars.AZURE_RG }}
        run: |
          set -euo pipefail
          RG=$(jq -er .resourceGroup infra/azure/dev.json)
          test "$CONFIGURED_RG" = "$RG" || { echo '::error::AZURE_RG must match dev.json'; exit 1; }
          if [[ "$OPERATION" == migrate ]]; then
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$MIGRATION_CONFIRMATION" = jobs-drained-producers-paused || {
              echo '::error::Read the migration runbook and confirm the drain before migrating.'; exit 1;
            }
          fi
          jq -r 'to_entries[] | "\(.key)=\(.value)"' infra/azure/dev.json >> "$GITHUB_OUTPUT"

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve existing foundation resources
        id: infra
        env:
          RG: ${{ steps.config.outputs.resourceGroup }}
          ACR: ${{ steps.config.outputs.acrName }}
          IDENTITY: ${{ steps.config.outputs.identityName }}
        run: |
          set -euo pipefail
          ACR_LOGIN=$(az acr show -g "$RG" -n "$ACR" --query loginServer -o tsv)
          IDENTITY_ID=$(az identity show -g "$RG" -n "$IDENTITY" --query id -o tsv)
          # The foundation creates one vault per RG. Fail on ambiguity, never pick [0] silently.
          VAULTS=$(az keyvault list -g "$RG" -o json)
          KV_NAME=$(jq -er 'if length == 1 then .[0].name else error("Expected exactly one dev Key Vault") end' <<< "$VAULTS")
          KV_URI=$(jq -er '.[0].properties.vaultUri' <<< "$VAULTS")
          {
            echo "acr_login=$ACR_LOGIN"
            echo "identity_id=$IDENTITY_ID"
            echo "kv_name=$KV_NAME"
            echo "kv_uri=$KV_URI"
          } >> "$GITHUB_OUTPUT"

      - name: Check migration state before changing resources
        if: env.OPERATION != 'prepare'
        env:
          RG: ${{ steps.config.outputs.resourceGroup }}
          APP: ${{ steps.config.outputs.appName }}
          ENVIRONMENT: ${{ steps.config.outputs.environmentName }}
          LEGACY_APP: ${{ steps.config.outputs.legacyAppName }}
          LEGACY_ENV: ${{ steps.config.outputs.legacyEnvironmentName }}
        run: |
          set -euo pipefail
          APPS=$(az containerapp list -g "$RG" -o json)
          EXISTS=$(jq --arg name "$APP" '[.[] | select(.name == $name)] | length' <<< "$APPS")
          if [[ "$OPERATION" == migrate ]]; then
            test "$EXISTS" = 0 || { echo '::error::Replacement already exists. Use deploy for recovery; do not repeat migration.'; exit 1; }
          else
            test "$EXISTS" = 1 || { echo '::error::Run the explicit migration first.'; exit 1; }
            jq -e --arg name "$APP" --arg suffix "/managedEnvironments/$ENVIRONMENT" \
              '.[] | select(.name == $name) | (.properties.environmentId // .properties.managedEnvironmentId) | endswith($suffix)' \
              <<< "$APPS" >/dev/null
            bash infra/azure/legacy-app.sh assert-stopped "$RG" "$LEGACY_APP" "$LEGACY_ENV"
          fi

      - name: Provision only the replacement environment
        id: environment
        env:
          RG: ${{ steps.config.outputs.resourceGroup }}
          ENVIRONMENT: ${{ steps.config.outputs.environmentName }}
          LOCATION: ${{ steps.config.outputs.location }}
          LOGS: ${{ steps.config.outputs.logAnalyticsWorkspaceName }}
          APP: ${{ steps.config.outputs.appName }}
        run: |
          set -euo pipefail
          OUTPUTS=$(az deployment group create -g "$RG" -n environment-dev-v2 \
            --mode Incremental -f infra/azure/environment.bicep \
            -p name="$ENVIRONMENT" location="$LOCATION" logAnalyticsWorkspaceName="$LOGS" \
            --query properties.outputs -o json)
          ENV_ID=$(jq -er .environmentId.value <<< "$OUTPUTS")
          DOMAIN=$(jq -er .defaultDomain.value <<< "$OUTPUTS")
          {
            echo "id=$ENV_ID"
            echo "url=https://$APP.$DOMAIN"
          } >> "$GITHUB_OUTPUT"
          echo "Replacement URL: https://$APP.$DOMAIN" >> "$GITHUB_STEP_SUMMARY"
          echo "Operation: $OPERATION. Preparation does not create or start an app." >> "$GITHUB_STEP_SUMMARY"

      - name: Build and push image in ACR
        if: env.OPERATION != 'prepare'
        id: build
        env:
          ACR: ${{ steps.config.outputs.acrName }}
          ACR_LOGIN: ${{ steps.infra.outputs.acr_login }}
        run: |
          set -euo pipefail
          # Commit-only tags avoid interpolating branch names into shell code.
          TAG="dev-${GITHUB_SHA::12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          az acr build --registry "$ACR" --image "truecourse:$TAG" --file Dockerfile .
          echo "image=$ACR_LOGIN/truecourse:$TAG" >> "$GITHUB_OUTPUT"

      - name: Deactivate the drained legacy app and wait for zero replicas
        if: env.OPERATION == 'migrate'
        env:
          RG: ${{ steps.config.outputs.resourceGroup }}
          LEGACY_APP: ${{ steps.config.outputs.legacyAppName }}
          LEGACY_ENV: ${{ steps.config.outputs.legacyEnvironmentName }}
        run: bash infra/azure/legacy-app.sh deactivate "$RG" "$LEGACY_APP" "$LEGACY_ENV"

      - name: Set replacement URL references after the legacy app stops
        if: env.OPERATION == 'migrate'
        env:
          KV: ${{ steps.infra.outputs.kv_name }}
          URL: ${{ steps.environment.outputs.url }}
        run: |
          set -euo pipefail
          # Only these URL values change; no credentials are read or printed.
          az keyvault secret set --vault-name "$KV" --name workos-app-url --value "$URL" -o none
          az keyvault secret set --vault-name "$KV" --name workos-redirect-uri --value "$URL/api/auth/callback" -o none

      - name: Create or update the replacement dev app
        if: env.OPERATION != 'prepare'
        id: deploy
        env:
          RG: ${{ steps.config.outputs.resourceGroup }}
          APP: ${{ steps.config.outputs.appName }}
          LOCATION: ${{ steps.config.outputs.location }}
          LEGACY_APP: ${{ steps.config.outputs.legacyAppName }}
          LEGACY_ENV: ${{ steps.config.outputs.legacyEnvironmentName }}
          IMAGE: ${{ steps.build.outputs.image }}
          ENV_ID: ${{ steps.environment.outputs.id }}
          IDENTITY_ID: ${{ steps.infra.outputs.identity_id }}
          ACR_LOGIN: ${{ steps.infra.outputs.acr_login }}
          KV_URI: ${{ steps.infra.outputs.kv_uri }}
          CPU: ${{ steps.config.outputs.cpu }}
          MEMORY: ${{ steps.config.outputs.memory }}
          PROFILE: ${{ steps.config.outputs.workloadProfileName }}
          MIN_REPLICAS: ${{ steps.config.outputs.minReplicas }}
          MAX_REPLICAS: ${{ steps.config.outputs.maxReplicas }}
        run: |
          set -euo pipefail
          bash infra/azure/legacy-app.sh assert-stopped "$RG" "$LEGACY_APP" "$LEGACY_ENV"
          URL=$(az deployment group create -g "$RG" -n containerapp-dev-v2 \
            --mode Incremental -f infra/azure/containerapp.bicep \
            -p name="$APP" location="$LOCATION" image="$IMAGE" environmentId="$ENV_ID" \
               identityId="$IDENTITY_ID" acrLoginServer="$ACR_LOGIN" keyVaultUri="$KV_URI" \
               cpu="$CPU" memory="$MEMORY" workloadProfileName="$PROFILE" \
               minReplicas="$MIN_REPLICAS" maxReplicas="$MAX_REPLICAS" \
            --query properties.outputs.url.value -o tsv)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed dev: $URL. Image: $IMAGE" >> "$GITHUB_STEP_SUMMARY"
          echo 'Authentication, event streaming, and guard checks remain operator rollout checks. See infra/azure/README.md.' >> "$GITHUB_STEP_SUMMARY"

      - name: Comment the dev URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.deploy.outputs.url }}
          IMAGE: ${{ steps.build.outputs.image }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Deployed to Dev: ${process.env.URL}\n\nImage: \`${process.env.IMAGE}\`\n` +
                'The dev environment is shared. The most recent deployment wins.',
            });
