<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .panel { fill: #131c2b; stroke: #263450; }
      .card { fill: #182437; stroke: #263450; }
      .txt { fill: #e6edf7; font-size: 14px; }
      .muted { fill: #8fa1bd; font-size: 13px; }
      .small { fill: #8fa1bd; font-size: 12px; }
      .good { fill: #3fce7c; }
      .bad { fill: #f26d6d; }
      .warn { fill: #f0b429; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </defs>
  <rect x="2" y="2" width="1036" height="496" rx="14" fill="#0d1420" stroke="#263450"/>

  <!-- left nav rail (OSS: tabs on the left) -->
  <line x1="170" y1="2" x2="170" y2="498" stroke="#263450"/>
  <text x="26" y="40" class="txt" font-weight="700" font-size="15">Spec Guard</text>
  <text x="32" y="84" class="muted">Coverage</text>
  <rect x="18" y="100" width="140" height="34" rx="8" fill="#1d2b44" stroke="#4c8dff"/>
  <text x="32" y="122" class="txt" font-weight="600" font-size="13">Flows</text>
  <text x="32" y="160" class="muted">Journeys</text>
  <text x="32" y="198" class="muted">Runs</text>

  <!-- content header: one action -->
  <rect x="920" y="16" width="98" height="32" rx="8" fill="#1d2b44" stroke="#4c8dff"/>
  <text x="969" y="37" text-anchor="middle" fill="#9cc0ff" font-size="13" font-weight="600">Generate</text>

  <!-- flow list -->
  <rect x="186" y="60" width="320" height="422" rx="10" class="panel"/>
  <rect x="202" y="76" width="288" height="30" rx="8" fill="#0d1420" stroke="#263450"/>
  <text x="216" y="96" class="small">Search…</text>
  <text x="476" y="96" text-anchor="end" class="small">All ▾</text>

  <rect x="202" y="118" width="288" height="52" rx="6" fill="#1d2b44" stroke="#4c8dff"/>
  <text x="216" y="139" class="txt" font-weight="600" font-size="13">Task lifecycle</text>
  <text x="216" y="159" class="small"><tspan class="good">api ✓</tspan>   <tspan class="bad">web ✗</tspan></text>

  <rect x="202" y="176" width="288" height="52" rx="6" fill="#131c2b"/>
  <text x="216" y="197" class="txt" font-size="13">Signup &amp; first project</text>
  <text x="216" y="217" class="small"><tspan class="good">api ✓</tspan>   <tspan>web — awaiting driver</tspan></text>

  <rect x="202" y="234" width="288" height="52" rx="6" fill="#131c2b"/>
  <text x="216" y="255" class="txt" font-size="13">Rate limiting</text>
  <text x="216" y="275" class="small"><tspan class="good">api ✓</tspan></text>

  <line x1="202" y1="304" x2="490" y2="304" stroke="#263450"/>
  <text x="216" y="332" class="bad" font-size="13" font-weight="600">▲ FINDINGS (1)</text>
  <text x="216" y="364" class="small">Recipe · api block ✓ · entry ✓</text>
  <text x="216" y="384" class="small">Last generate · 6 flows · 2m ago</text>

  <!-- flow detail -->
  <rect x="522" y="60" width="500" height="422" rx="10" class="panel"/>
  <text x="540" y="92" class="txt" font-weight="700" font-size="15">Task lifecycle</text>
  <text x="540" y="114" class="muted">A user creates a task, sees it listed, completes it, and sees it done.</text>

  <!-- milestone graph (generate-state paint) -->
  <line x1="588" y1="170" x2="960" y2="170" stroke="#3a4a68" stroke-width="2"/>
  <circle cx="588" cy="170" r="16" fill="#182437" stroke="#3fce7c" stroke-width="2"/>
  <text x="588" y="175" text-anchor="middle" class="txt" font-size="13">1</text>
  <circle cx="712" cy="170" r="16" fill="#182437" stroke="#3fce7c" stroke-width="2"/>
  <text x="712" y="175" text-anchor="middle" class="txt" font-size="13">2</text>
  <circle cx="836" cy="170" r="16" fill="#182437" stroke="#f26d6d" stroke-width="2"/>
  <text x="836" y="175" text-anchor="middle" class="txt" font-size="13">3</text>
  <circle cx="960" cy="170" r="16" fill="#182437" stroke="#f26d6d" stroke-width="2"/>
  <text x="960" y="175" text-anchor="middle" class="txt" font-size="13">4</text>

  <text x="588" y="204" text-anchor="middle" class="small">create</text>
  <text x="712" y="204" text-anchor="middle" class="small">listed</text>
  <text x="836" y="204" text-anchor="middle" class="small">complete</text>
  <text x="960" y="204" text-anchor="middle" class="small">done filter</text>
  <text x="540" y="234" class="small">3 · docs/specs/tasks.md § completing-tasks</text>
  <text x="540" y="252" class="small">paint = generate state:<tspan class="good"> ● settled</tspan><tspan class="bad">  ▲ finding</tspan><tspan>  ○ gap</tspan></text>

  <!-- surfaces -->
  <text x="540" y="290" class="txt" font-weight="600" font-size="13">SURFACES</text>
  <rect x="540" y="302" width="464" height="48" rx="8" class="card"/>
  <text x="558" y="331" class="txt" font-size="13"><tspan font-weight="600">API</tspan>
    <tspan class="mono" dx="12">task-lifecycle.api.1</tspan></text>
  <text x="796" y="331" class="good" font-size="13">birth ✓</text>
  <text x="988" y="331" text-anchor="end" fill="#9cc0ff" font-size="13">yaml · evidence</text>

  <rect x="540" y="358" width="464" height="48" rx="8" class="card"/>
  <text x="558" y="387" class="txt" font-size="13"><tspan font-weight="600">Web</tspan></text>
  <rect x="616" y="369" width="150" height="24" rx="12" fill="none" stroke="#f0b429"/>
  <text x="691" y="386" text-anchor="middle" class="warn" font-size="12">⚠ awaiting web driver</text>

  <text x="540" y="444" class="small">Scenarios are reached only through their flow — there is no flat Scenarios tab.</text>
</svg>
