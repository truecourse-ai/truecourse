      .muted { fill: #8fa1bd; font-size: 13px; }
      .small { fill: #8fa1bd; font-size: 12px; }
      .good { fill: #3fce7c; }
      .bad { fill: #f26d6d; }
      .warn { fill: #f0b429; }
      .grey { fill: #5b6b85; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </defs>
  <rect x="2" y="2" width="1036" height="536" rx="14" fill="#0d1420" stroke="#263450"/>

  <!-- left nav rail (OSS: tabs on the left) -->
